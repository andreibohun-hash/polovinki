<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Половинки</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Палитра — одно место; canvas читает цвета через getComputedStyle (PROTO-BASE §9). */
:root{
  --bg:#efe6d8; --frame:#f6efe4; --ink:#3b3340; --muted:#8a7f86;
  --accent:#ff8a3d; --off:#e6dccd; --danger:#e8505b;
  --board:#e6d9c5; --slot:#f2eadc; --tile:#fffaf2; --tile-shadow:#d4c4ad; --stone:#b8ab9a; --stone-dark:#9a8d7c;
  --c0:#ff5470; --c1:#3b8cff; --c2:#ffb81f; --c3:#2fbf71; --c4:#9b5cff;
  --panel-ink:#3b3340; --panel-muted:#8a7f86; --panel-slot:#efe6d8;   /* панели всегда светлые (как плитки) — свои цвета в обеих темах */
  --honey:#f7b733; --wood:#c98b4f; --wood-dark:#8f5a2b; --steel:#7d8494;
  --frame-w:430px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1a20; --frame:#26232b; --ink:#f3eef2; --muted:#a79fa8; --off:#3a3540;
    --board:#33303a; --slot:#2b2831; --tile:#f7f1e8; --tile-shadow:#1a181d; --stone:#6f6878; --stone-dark:#57505f; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:var(--frame);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;pointer-events:none}
header b{font-size:18px} header span{color:var(--muted)}
header button{pointer-events:auto;padding:6px 10px}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#tip{position:absolute;left:16px;right:16px;top:0;text-align:center;color:var(--ink);opacity:.75;font-size:15px;line-height:1.3;pointer-events:none}
footer{display:flex;gap:8px;justify-content:center;padding:8px 14px calc(10px + env(safe-area-inset-bottom))}
button{font:inherit;color:var(--ink);background:var(--off);border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.45}
button.primary{background:var(--accent);color:#fff;font-weight:700}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,30,40,.38);padding:20px}
#overlay.show{display:flex}
.card{background:var(--frame);border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center;
  animation:pop .18s ease-out} /* стартует с видимого состояния, не с opacity:0 (§9) */
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.card h2{margin:0 0 8px} .card p{color:var(--muted);margin:0 0 16px}
.card .stars{font-size:44px;color:var(--c2);letter-spacing:6px;margin:0 0 6px}
.card .st{display:inline-block;animation:starIn .5s cubic-bezier(.3,1.7,.5,1) both;text-shadow:0 3px 0 rgba(160,100,0,.25)}
.card .st.off{color:var(--off);text-shadow:none}
@keyframes starIn{from{transform:scale(2) rotate(-50deg)}to{transform:scale(1) rotate(0)}}  /* старт с видимого состояния (§9) */
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px;max-height:42vh;overflow-y:auto;padding:2px}
.levels .ch{grid-column:1/-1;text-align:left;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.levels button{padding:8px 0;font-size:14px}
.levels button small{display:block;font-size:10px;color:var(--c2)}
.levels button.locked{opacity:.4}
.cheat{margin-top:10px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--frame);padding:8px 14px;border-radius:10px;
  pointer-events:none;opacity:.95;transition:opacity .25s;white-space:nowrap}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card, .card .st{animation:none} #toast{transition:none} }
</style>
</head>

<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Половинки». Поле w×h, в клетках — пусто, камень или плитка с половинкой фигуры.
// Свайп двигает плитку до упора (стена, камень, другая плитка). Если после остановки
// левая половинка стоит вплотную слева от правой того же цвета — стыковка: обе исчезают,
// целая фигура идёт в копилку. После каждого хода (или каждого every-го) на поле падает
// новая половинка в клетку с искрой (видно заранее). Цель — goal целых; ходить некуда — проигрыш.
// Коды клеток: 0 — пусто, -1 — камень, 1 + цвет*2 + сторона — половинка (сторона 0 левая, 1 правая).
// Ход — число m = клетка*4 + направление (0 →, 1 ←, 2 ↓, 3 ↑).
// ---------------------------------------------------------------------------
const CFG = {
  // --- правила, солвер, генератор ---
  PAR_BEAM: 40,        // ширина луча солвера в игре (par для звёзд); оффлайн-аудит берёт SIM_BEAM
  SIM_BEAM: 300,       // ширина луча солвера в sim.mjs
  MAX_DEPTH: 60,       // предел глубины солвера (ходов)
  BOT_CAP: 150,        // предел ходов ботов: на уровнях без раздачи иначе можно ходить вечно
  GEN_ATTEMPTS: 80,    // попыток собрать поле на один сид, прежде чем взять последнее
  GOAL_BOOST: 1.5,     // множитель цели «N любых» и заказа (ящики не трогает) — решение Андрея 11.11: цели +50%
  GOAL_BOOST_FROM: 4,  // с какого уровня действует буст; уровни-уроки без раздачи не трогаются
  STAR3_SLACK: 1,      // ★★★ — ходов не больше par + STAR3_SLACK
  STAR2_SLACK: 4,      // ★★ — ходов не больше par + STAR2_SLACK
  // --- оболочка: тайминги (мс, абсолютное время) и ввод ---
  SLIDE_MS_CELL: 55,   // скольжение плитки на одну клетку
  SLIDE_MIN_MS: 110,   // минимальная длительность скольжения
  DOCK_MS: 320,        // стыковка: половинки сходятся, целое вспыхивает
  FLY_MS: 460,         // целая фигура летит в копилку
  SPAWN_MS: 420,       // полёт новой половинки из окошка «дальше» в клетку искры
  END_DELAY_MS: 380,   // пауза между последним эффектом и карточкой победы/проигрыша
  SWIPE_PX: 14,        // порог свайпа в экранных px; короче — тап (плитка вздрагивает)
  UNDO_PER_LEVEL: 3,   // отмен на уровень: раздача делает бесконечную отмену читом
  TOAST_MS: 1600,      // сколько висит тост
  // --- сочность (только оболочка; на правила не влияют) ---
  SHAKE_PX: 4,         // амплитуда встряски экрана на «щёлк» (растёт с серией до SHAKE_MAX)
  SHAKE_MAX: 9,        // потолок встряски
  SHAKE_MS: 240,       // длительность встряски
  LAND_MS: 190,        // сплющивание плитки при остановке
  HIT_MS: 210,         // вздрагивание плитки/камня, в которые упёрлись
  TRAIL_N: 3,          // сколько призраков шлейфа за скользящей плиткой
  PRAISE_MS: 950,      // сколько живёт надпись «Щёлк!» / «Отлично! ×2»
  CONFETTI_DOCK: 18,   // конфетти на одну стыковку
  CONFETTI_WIN: 80,    // конфетти на победу
  WIN_HOLD_MS: 1100,   // сколько празднуем на поле до карточки победы
  INTRO_MS: 260,       // впрыгивание одной плитки на старте уровня (задержка по диагонали INTRO_STEP)
  INTRO_STEP: 38,      // мс задержки на клетку диагонали
  IDLE_HINT_MS: 5000,  // бездействие, после которого подмигивает плитка с готовой стыковкой
  DANGER_EMPTY: 4,     // пустых клеток не больше — рамка поля тревожно пульсирует
  DRAG_PULL: 0.16,     // насколько плитка тянется за пальцем (доля клетки)
};

const STONE = -1, CRATE = -2;                              // помехи: камень вечный, ящик ломается стыковкой рядом
const HONEY = 1;                                           // пол (массив floor): мёд — плитка на нём останавливается
const RAINBOW = 5;                                         // «цвет» радужной половинки: стыкуется с любым цветом
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];          // → ← ↓ ↑
// Код плитки: 1 + цвет*4 + сторона (0 левая, 1 правая, 2 верхняя, 3 нижняя); +100 — в цепи; +1000*t — таймер на t ходов.
const pieceCode = (color, side, chain, timer) => 1 + color * 4 + side + (chain ? 100 : 0) + (timer ? 1000 * timer : 0);
const colorOf = (code) => ((code % 100) - 1) >> 2;
const sideOf = (code) => ((code % 100) - 1) & 3;
const isChained = (code) => code > 0 && Math.floor((code % 1000) / 100) === 1;
const timerOf = (code) => code > 0 ? Math.floor(code / 1000) : 0;
const isVert = (code) => sideOf(code) >= 2;

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Случайное число без состояния: раздача зависит только от (сид уровня, номер раздачи, соль).
function hashRand(seed, k, salt){
  return mulberry32((seed ^ Math.imul(k + 1, 0x9E3779B1) ^ Math.imul(salt + 7, 0x85EBCA77)) >>> 0)();
}

// ---------------------------------------------------------------------------
// Контент. layout — ручное поле: строка без пробелов — по символу на клетку, с пробелами — токены:
//   '.' пусто, '#' камень, 'x' ящик, '~' мёд (пустой); половинка — буква цвета
//   (h сердце, c круг, s звезда, d ромб, l капля, r радужная): строчная — левая/верхняя, заглавная — правая/нижняя;
//   суффиксы: '^' — вертикальная (верх/низ), '*' — в цепи, цифра — таймер; префикс '~' — мёд под плиткой.
// Генератор: w×h, colors цветов, pairs пар, stones камней, crates ящиков, honey клеток мёда, vert — доля вертикальных пар,
//   chains — плиток в цепи, timers — плиток с таймером timer на старте, timerP — доля раздач с таймером,
//   rainbow — доля радужных в раздаче.
// Цель: goal — N любых фигур; order — заказ [сердца, круги, звёзды, ромбы, капли]; crateGoal — сломать ящиков.
// every — раздача после каждого every-го хода (0 — нет); help — доля раздач «пара к одинокой»;
// seed — сдвиг сида (подобран sim.mjs autopick; с 11.11 — под цели с бустом CFG.GOAL_BOOST); lesson — урок: аудит не требует, чтобы случайный бот проигрывал.
// ---------------------------------------------------------------------------
const B = { w: 5, h: 6, every: 1, help: 0.85 };           // база генерируемых уровней
const LEVELS = [
  // --- глава 1: основа ---
  { n: 1, layout: ['.....', '.....', 'h...H', '.....', '.....'], goal: 1, every: 0, lesson: true,
    tip: 'Свайпни половинку к её паре' },
  { n: 2, layout: ['.....', '.....', 'h.S.H', '.....', '.....', 's....'], goal: 2, every: 0, lesson: true,
    tip: 'Левая встаёт слева от правой. Звезда мешает — убери её' },
  { n: 3,  w: 5, h: 5, colors: 2, pairs: 2, stones: 1, goal: 3, every: 2, help: 1,    seed: 2, lesson: true,
    tip: 'Каждые 2 хода падает новая половинка — искра показывает куда' },
  { n: 4,  w: 5, h: 6, colors: 3, pairs: 3, stones: 1, goal: 4, every: 1, help: 0.9,  seed: 0,
    tip: 'Теперь новая половинка падает после каждого хода' },
  { n: 5,  w: 5, h: 6, colors: 3, pairs: 4, stones: 1, goal: 5, every: 1, help: 0.85, seed: 1 },
  { n: 6,  w: 5, h: 6, colors: 3, pairs: 5, stones: 2, goal: 6, every: 1, help: 0.85, seed: 0 },
  { n: 7,  w: 5, h: 6, colors: 3, pairs: 6, stones: 3, goal: 7, every: 1, help: 0.85, seed: 4 },
  { n: 8,  w: 5, h: 6, colors: 4, pairs: 4, stones: 2, goal: 6, every: 1, help: 0.85, seed: 26,
    tip: 'Новый цвет — ромб' },
  { n: 9,  w: 5, h: 6, colors: 4, pairs: 5, stones: 2, goal: 6, every: 1, help: 0.85, seed: 36 },
  { n: 10, w: 5, h: 6, colors: 3, pairs: 4, stones: 1, goal: 8, every: 1, help: 0.85, seed: 7 },
  // --- A. верх/низ ---
  { n: 11, layout: ['. . h^ . .', '. . . . .', 's . . . S', '. . . . .', '. . H^ . .'], goal: 2, every: 0, lesson: true,
    tip: 'Новое: верхняя половинка стыкуется с нижней' },
  { n: 12, ...B, colors: 3, pairs: 3, stones: 1, vert: 0.5, goal: 4, seed: 1 },
  { n: 13, ...B, colors: 3, pairs: 4, stones: 2, vert: 0.5, goal: 5, seed: 3 },
  { n: 14, ...B, colors: 4, pairs: 4, stones: 2, vert: 0.5, goal: 5, seed: 6 },
  { n: 15, ...B, colors: 3, pairs: 5, stones: 3, vert: 0.5, goal: 6, seed: 0 },
  // --- B. мёд ---
  { n: 16, layout: ['. . h . .', '. . . . .', '. . ~ H .', '. . . . .', '. . . . .'], goal: 1, every: 0, lesson: true,
    tip: 'Новое: на мёде плитка останавливается' },
  { n: 17, ...B, colors: 3, pairs: 3, stones: 1, honey: 3, goal: 4, seed: 1 },
  { n: 18, ...B, colors: 3, pairs: 4, stones: 1, honey: 4, goal: 5, seed: 0 },
  { n: 19, ...B, colors: 4, pairs: 4, stones: 2, honey: 4, goal: 5, seed: 0 },
  { n: 20, ...B, colors: 3, pairs: 4, stones: 2, honey: 3, vert: 0.5, goal: 6, seed: 5, tip: 'Мёд и верх/низ вместе' },
  // --- C. радужная ---
  { n: 21, layout: ['. . . . .', 'r . . . H', '. . . . .', 's . . . R', '. . . . .'], goal: 2, every: 0, lesson: true,
    tip: 'Новое: радужная половинка подходит к любой фигуре' },
  { n: 22, ...B, colors: 4, pairs: 4, stones: 2, rainbow: 0.15, goal: 6, seed: 9 },
  { n: 23, ...B, colors: 4, pairs: 5, stones: 2, rainbow: 0.15, goal: 7, seed: 2 },
  { n: 24, ...B, colors: 5, pairs: 5, stones: 2, rainbow: 0.15, goal: 6, seed: 0, tip: 'Новый цвет — капля' },
  { n: 25, ...B, colors: 4, pairs: 4, stones: 2, rainbow: 0.12, vert: 0.5, goal: 6, seed: 2 },
  // --- D. ящики ---
  { n: 26, layout: ['. h . . .', '. . # . .', '. . H x .'], goal: 0, crateGoal: 1, every: 0, lesson: true,
    tip: 'Новое: стыковка рядом ломает ящик' },
  { n: 27, ...B, colors: 3, pairs: 4, stones: 0, crates: 3, goal: 0, crateGoal: 3, seed: 17 },
  { n: 28, ...B, colors: 3, pairs: 4, stones: 1, crates: 4, goal: 0, crateGoal: 4, seed: 24 },
  { n: 29, ...B, colors: 4, pairs: 4, stones: 1, crates: 3, goal: 3, crateGoal: 3, seed: 0 },
  { n: 30, ...B, colors: 3, pairs: 4, stones: 1, crates: 3, vert: 0.5, goal: 0, crateGoal: 3, seed: 2 },
  // --- E. цепи ---
  { n: 31, layout: ['. c . s .', '. . . . .', '. . . . .', 'S* . C . .'], goal: 2, every: 0, lesson: true,
    tip: 'Новое: цепь держит плитку, стыковка рядом её снимает' },
  { n: 32, ...B, colors: 3, pairs: 4, stones: 1, chains: 1, goal: 5, seed: 1 },
  { n: 33, ...B, colors: 3, pairs: 4, stones: 1, chains: 2, goal: 5, seed: 2 },
  { n: 34, ...B, colors: 4, pairs: 5, stones: 1, chains: 2, goal: 6, seed: 4 },
  { n: 35, ...B, colors: 3, pairs: 4, stones: 1, chains: 2, honey: 3, goal: 6, seed: 7 },
  // --- F. таймер ---
  { n: 36, layout: ['h4 . . . .', '. . . . .', '. . . H .', '# . . . .', '. s . . S'], goal: 2, every: 0, lesson: true,
    tip: 'Новое: число — сколько ходов до окаменения. Успей!' },
  { n: 37, ...B, colors: 3, pairs: 4, stones: 1, timerP: 0.25, timer: 8, goal: 5, seed: 1 },
  { n: 38, ...B, colors: 3, pairs: 4, stones: 1, timers: 1, timerP: 0.3, timer: 7, goal: 5, seed: 3 },
  { n: 39, ...B, colors: 4, pairs: 4, stones: 1, timerP: 0.3, timer: 7, goal: 6, seed: 1 },
  { n: 40, ...B, colors: 3, pairs: 4, stones: 0, crates: 3, timerP: 0.25, timer: 8, goal: 2, crateGoal: 3, seed: 11 },
  // --- G. заказ ---
  { n: 41, layout: ['h . . . H', '. . . . .', 's . . . S', '. . . . .', 'h . . . H'], goal: 0, order: [2, 0, 0, 0, 0], every: 0, lesson: true,
    tip: 'Новое: заказ — нужны только сердца' },
  { n: 42, ...B, colors: 3, pairs: 4, stones: 1, goal: 0, order: [2, 0, 2, 0, 0], seed: 1 },
  { n: 43, ...B, colors: 4, pairs: 4, stones: 1, goal: 0, order: [3, 2, 0, 0, 0], seed: 2 },
  { n: 44, ...B, colors: 4, pairs: 4, stones: 2, goal: 0, order: [0, 0, 3, 2, 0], seed: 2 },
  { n: 45, ...B, colors: 3, pairs: 4, stones: 1, chains: 2, goal: 0, order: [2, 2, 0, 0, 0], seed: 13 },
  // --- экзамен: смеси, пила ---
  { n: 46, ...B, colors: 3, pairs: 4, stones: 1, vert: 0.3, rainbow: 0.1, goal: 6, seed: 5 },
  { n: 47, ...B, colors: 4, pairs: 4, stones: 1, honey: 3, crates: 2, goal: 4, crateGoal: 2, seed: 16 },
  { n: 48, ...B, colors: 4, pairs: 4, stones: 1, chains: 2, timerP: 0.2, timer: 8, vert: 0.4, goal: 6, seed: 0 },
  { n: 49, ...B, colors: 3, pairs: 4, stones: 1, rainbow: 0.15, honey: 2, goal: 6, seed: 3 },
  { n: 50, ...B, colors: 4, pairs: 4, stones: 1, vert: 0.4, honey: 2, crates: 2, goal: 0, order: [2, 0, 2, 0, 0], crateGoal: 2, seed: 6,
    tip: 'Финал главы: всё вместе' },
];

// Уровни после таблицы — бесконечный генератор: пила лёгкий / средний / сложный, на поле не больше 2 механик.
const MECHS = [
  (sp) => { sp.vert = 0.45; },
  (sp) => { sp.honey = 3; },
  (sp) => { sp.rainbow = 0.12; },
  (sp) => { sp.crates = 3; sp.crateGoal = 3; sp.goal = Math.max(2, sp.goal - 3); },
  (sp) => { sp.chains = 2; },
  (sp) => { sp.timerP = 0.22; sp.timer = 8; },
  (sp) => { const o = [0, 0, 0, 0, 0]; o[sp.n % 3] = 2; o[(sp.n + 1) % 3 + 1] = 2; sp.order = o; sp.goal = 0; },
];
// Буст цели поверх таблицы: одна ручка в CFG, таблица остаётся как была.
function boostGoals(sp){
  const k = CFG.GOAL_BOOST;
  if (k === 1 || sp.n < CFG.GOAL_BOOST_FROM || !sp.every) return sp;
  return { ...sp, goal: Math.round((sp.goal || 0) * k), order: sp.order ? sp.order.map(n => Math.round(n * k)) : sp.order };
}
function levelSpec(li){ return boostGoals(baseSpec(li)); }
function baseSpec(li){
  if (li < LEVELS.length) return LEVELS[li];
  const n = li + 1, step = n - LEVELS.length - 1, phase = step % 3, tier = Math.min(4, Math.floor(step / 15));
  const sp = { n, w: 5, h: 6, colors: 3 + (phase > 0 ? 1 : 0), pairs: 4 + (phase === 2 ? 1 : 0), stones: 1 + phase,
    goal: 5 + phase + (tier >> 1), every: 1, help: 0.85, seed: 0 };
  const r = mulberry32(7000 + n), a = Math.floor(r() * MECHS.length);

  if (phase > 0){ let b = Math.floor(r() * MECHS.length); if (b === a) b = (b + 1) % MECHS.length; if (!(sp.order && b === 3)) MECHS[b](sp); }
  return sp;
}

// --- раскладка уровня ---
const LAYOUT_CHARS = 'hcsdlr';                            // r — радужная (цвет RAINBOW = 5)
function parseLayout(rows){
  const toks = rows.map(r => r.indexOf(' ') >= 0 ? r.trim().split(/\s+/) : r.split(''));
  const h = toks.length, w = toks[0].length, grid = new Array(w * h).fill(0), floor = new Array(w * h).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    let t = toks[y][x]; const i = y * w + x;
    if (t[0] === '~'){ floor[i] = HONEY; t = t.slice(1); if (!t) continue; }
    if (t === '.') continue;
    if (t === '#'){ grid[i] = STONE; continue; }
    if (t === 'x'){ grid[i] = CRATE; continue; }
    const col = LAYOUT_CHARS.indexOf(t[0].toLowerCase());
    if (col < 0) throw new Error('layout: неизвестный токен ' + t);
    const first = t[0] === t[0].toLowerCase(), vert = t.indexOf('^') >= 0, chain = t.indexOf('*') >= 0;
    const tm = t.match(/\d+/);

}
function cellToken(s, i){
  const c = s.grid[i], hon = s.floor && s.floor[i] === HONEY ? '~' : '';

  if (c === STONE) return hon + '#';
  if (c === CRATE) return hon + 'x';
  const ch = LAYOUT_CHARS[colorOf(c)], sd = sideOf(c);
  return hon + (sd === 0 || sd === 2 ? ch : ch.toUpperCase()) + (sd >= 2 ? '^' : '') + (isChained(c) ? '*' : '') + (timerOf(c) || '');
}

  const out = [];
  for (let y = 0; y < s.h; y++){ const r = []; for (let x = 0; x < s.w; x++) r.push(cellToken(s, y * s.w + x)); out.push(r.join(' ')); }

}

// --- движение и стыковка ---
// Куда доедет плитка из клетки i в направлении d: до стены, до занятой клетки или до мёда (на мёде останавливается).
function slideDest(grid, w, h, i, d, floor){
  const dx = DIRS[d][0], dy = DIRS[d][1];
  let x = i % w, y = (i - x) / w;
  for (;;){
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= w || ny >= h || grid[ny * w + nx] !== 0) break;
    x = nx; y = ny;
    if (floor && floor[y * w + x] === HONEY) break;
  }

}
const colorsMatch = (a, b) => { const ca = colorOf(a), cb = colorOf(b); return ca === cb || ca === RAINBOW || cb === RAINBOW; };

function dockPartner(grid, w, h, j, code){
  if (code <= 0) return -1;

  let k = -1, want = -1;
  if (sd === 0 && x < w - 1){ k = j + 1; want = 1; }
  else if (sd === 1 && x > 0){ k = j - 1; want = 0; }
  else if (sd === 2 && y < h - 1){ k = j + w; want = 3; }
  else if (sd === 3 && y > 0){ k = j - w; want = 2; }
  if (k < 0) return -1;
  const n = grid[k];
  return n > 0 && sideOf(n) === want && colorsMatch(code, n) ? k : -1;
}
function hasDock(grid, w, h){ for (let i = 0; i < grid.length; i++){ const c = grid[i]; if (c > 0 && (sideOf(c) === 0 || sideOf(c) === 2) && dockPartner(grid, w, h, i, c) >= 0) return true; } return false; }
function nearestEmpty(grid, w, from){
  let best = -1, bd = Infinity; const fx = from % w, fy = (from - fx) / w;
  for (let i = 0; i < grid.length; i++){
    if (grid[i] !== 0) continue;
    const x = i % w, dd = Math.abs(x - fx) + Math.abs((i - x) / w - fy);
    if (dd < bd){ bd = dd; best = i; }
  }

}
function pieceCount(s){ let n = 0; for (const c of s.grid) if (c > 0) n++; return n; }
function neighbors4(i, w, h){ const x = i % w, y = (i - x) / w, o = []; if (x > 0) o.push(i - 1); if (x < w - 1) o.push(i + 1); if (y > 0) o.push(i - w); if (y < h - 1) o.push(i + w); return o; }

// Стыковка a+b: фигура в копилку (радужная берёт цвет пары), рядом ломаются ящики и снимаются цепи. ev — события для оболочки.
function dock(s, a, b, ev){
  const ca = colorOf(s.grid[a]), cb = colorOf(s.grid[b]), col = ca === RAINBOW ? cb : ca;
  s.collected.push(col); if (col < RAINBOW) s.got[col]++;
  s.grid[a] = 0; s.grid[b] = 0; s.docks++;
  for (const c of [a, b]) for (const k of neighbors4(c, s.w, s.h)){
    const v = s.grid[k];
    if (v === CRATE){ s.grid[k] = 0; s.crates++; ev.push({ type: 'crate', cell: k }); }
    else if (isChained(v)){ s.grid[k] = v - 100; ev.push({ type: 'chain', cell: k, code: v }); }
  }

}
// Таймеры: после хода каждый тикает; дошёл до нуля — плитка каменеет.
function tickTimers(s, ev){
  for (let i = 0; i < s.grid.length; i++){
    const t = timerOf(s.grid[i]); if (!t) continue;
    if (t === 1){ ev.push({ type: 'stone', cell: i, code: s.grid[i] }); s.grid[i] = STONE; if (!s.every) s.dead = true; }
    else s.grid[i] -= 1000;
  }
}

// Следующая раздача: какая половинка и куда. Решается сразу после хода — игрок видит её заранее.
// Соли 1–5 — как в v0.1 (поля и раздачи уровней 1–10 не меняются); новые механики берут свои соли 6+.
function planNext(s){
  const empties = [];
  for (let i = 0; i < s.grid.length; i++) if (s.grid[i] === 0) empties.push(i);
  const bal = [];                                    // [цвет][ось]: >0 — первых (левых/верхних) больше
  for (let c = 0; c < s.colors; c++) bal.push([0, 0]);
  for (const c of s.grid) if (c > 0 && colorOf(c) < s.colors){ const sd = sideOf(c); bal[colorOf(c)][sd >> 1] += (sd & 1) ? -1 : 1; }
  const lonely = [];
  for (let c = 0; c < s.colors; c++) for (let ax = 0; ax < 2; ax++) if (bal[c][ax]) lonely.push([c, ax]);
  let code;
  if (lonely.length && hashRand(s.seed, s.k, 1) < s.help){
    const [col, ax] = lonely[Math.floor(hashRand(s.seed, s.k, 2) * lonely.length)];
    const side = ax * 2 + (bal[col][ax] > 0 ? 1 : 0);
    code = pieceCode(s.rainbow && hashRand(s.seed, s.k, 6) < s.rainbow ? RAINBOW : col, side);
  } else {
    let col = Math.floor(hashRand(s.seed, s.k, 3) * s.colors);
    if (s.order && hashRand(s.seed, s.k, 7) < 0.5){ const want = []; s.order.forEach((n, c) => { if (n > s.got[c]) want.push(c); }); if (want.length) col = want[Math.floor(hashRand(s.seed, s.k, 8) * want.length)]; }
    const ax = s.vert && hashRand(s.seed, s.k, 9) < s.vert ? 1 : 0;
    code = pieceCode(col, ax * 2 + (hashRand(s.seed, s.k, 4) < 0.5 ? 0 : 1));
  }
  if (s.timerP && hashRand(s.seed, s.k, 10) < s.timerP) code += 1000 * s.timer;
  const cell = empties.length ? empties[Math.floor(hashRand(s.seed, s.k, 5) * empties.length)] : -1;

}
// Падение раздачи: в клетку искры, а если её заняли — в ближайшую пустую. Может сразу состыковаться.
function spawn(s, ev){
  const want = s.next.cell;
  const cell = want >= 0 && s.grid[want] === 0 ? want : nearestEmpty(s.grid, s.w, Math.max(0, want));
  if (cell < 0) return null;
  const code = s.next.code;
  s.grid[cell] = code;
  const partner = dockPartner(s.grid, s.w, s.h, cell, code), partnerCode = partner >= 0 ? s.grid[partner] : 0;
  let color = -1;
  if (partner >= 0) color = dock(s, cell, partner, ev);
  s.k++;
  planNext(s);
  return { cell, code, partner, partnerCode, planned: want, color };
}

function makeState(li, spec, grid, w, h, seed, floor){
  const s = { li, n: spec.n, w, h, grid, floor: floor || new Array(w * h).fill(0), seed,
    goal: spec.goal || 0, order: spec.order ? spec.order.slice() : null, crateGoal: spec.crateGoal || 0,
    every: spec.every || 0, colors: spec.colors || 5, help: spec.help === undefined ? 0.8 : spec.help,
    vert: spec.vert || 0, rainbow: spec.rainbow || 0, timerP: spec.timerP || 0, timer: spec.timer || 8,
    k: 0, moves: 0, docks: 0, got: [0, 0, 0, 0, 0], crates: 0, dead: false, collected: [], next: null, last: null };
  if (s.every > 0) planNext(s);

}
// Генератор поля. Порядок расхода rnd для полей без новых механик — как в v0.1 (уровни 1–10 не меняются).
function genGrid(spec, seed){
  const w = spec.w, h = spec.h, N = w * h; let grid = null, floor = null;
  for (let a = 0; a < CFG.GEN_ATTEMPTS; a++){
    const rnd = mulberry32(seed * 131 + a);
    grid = new Array(N).fill(0); floor = new Array(N).fill(0);
    const free = () => { const f = []; for (let i = 0; i < N; i++) if (!grid[i]) f.push(i); return f; };
    const put = (code) => { const f = free(), i = f[Math.floor(rnd() * f.length)]; grid[i] = code; return i; };
    for (let k = 0; k < (spec.stones || 0); k++) put(STONE);
    for (let k = 0; k < (spec.crates || 0); k++) put(CRATE);
    for (let k = 0; k < (spec.honey || 0); k++){ const f = free().filter(i => !floor[i]); floor[f[Math.floor(rnd() * f.length)]] = HONEY; }
    const placed = [];
    const want = []; if (spec.order) spec.order.forEach((n, c) => { if (n) want.push(c); });
    for (let p = 0; p < spec.pairs; p++){
      const col = p < want.length ? want[p] : p < spec.colors ? p : Math.floor(rnd() * spec.colors);
      const ax = spec.vert && rnd() < spec.vert ? 2 : 0;
      placed.push(put(pieceCode(col, ax))); placed.push(put(pieceCode(col, ax + 1)));
    }
    for (let k = 0; k < (spec.chains || 0); k++){ const i = placed[Math.floor(rnd() * placed.length)]; if (!isChained(grid[i])) grid[i] += 100; }
    for (let k = 0; k < (spec.timers || 0); k++){ const i = placed[Math.floor(rnd() * placed.length)]; if (!timerOf(grid[i])) grid[i] += 1000 * (spec.timer || 8); }
    if (hasDock(grid, w, h)) continue;                               // пара не должна стоять готовой до первого хода
    const s = makeState(-1, spec, grid.slice(), w, h, seed, floor);
    if (!legalMoves(s).length) continue;
    if (spec.every > 0 && !greedyPlay(s).win) continue;              // страховка в игре: уровень проходим простым ботом
    return { grid, floor };
  }

}
function levelSeed(spec){ return 1000 + spec.n * 97 + (spec.seed || 0); }
function createState(li){
  const spec = levelSpec(li), seed = levelSeed(spec);
  if (spec.layout){ const L = parseLayout(spec.layout); return makeState(li, spec, L.grid, L.w, L.h, seed, L.floor); }
  const G0 = genGrid(spec, seed);
  return makeState(li, spec, G0.grid, spec.w, spec.h, seed, G0.floor);
}
function cloneState(s){ return { ...s, grid: s.grid.slice(), got: s.got.slice(), collected: s.collected.slice(), order: s.order, next: s.next && { ...s.next }, last: null }; }

function legalMoves(s){
  const out = [];
  if (isWin(s) || s.dead) return out;
  const { grid, w, h } = s;
  for (let i = 0; i < grid.length; i++){
    if (grid[i] <= 0 || isChained(grid[i])) continue;
    const x = i % w, y = (i - x) / w;
    for (let d = 0; d < 4; d++){
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (nx >= 0 && ny >= 0 && nx < w && ny < h && grid[ny * w + nx] === 0) out.push(i * 4 + d);
    }
  }

}
// Ход без копирования состояния: куда доедет и с кем состыкуется (для превью, ботов и солвера).
function peekMove(s, m){
  const i = m >> 2, j = slideDest(s.grid, s.w, s.h, i, m & 3, s.floor);
  return { to: j, partner: j === i ? -1 : dockPartner(s.grid, s.w, s.h, j, s.grid[i]) };
}
function applyMove(s, m){
  const i = m >> 2, d = m & 3, n = cloneState(s);
  const code = n.grid[i];
  if (code <= 0 || isChained(code)) return null;
  const j = slideDest(n.grid, n.w, n.h, i, d, n.floor);
  if (j === i) return null;
  n.grid[i] = 0; n.grid[j] = code; n.moves++;
  const last = { from: i, to: j, dir: d, code, dist: Math.abs(j - i) / (d < 2 ? 1 : n.w), partner: -1, color: -1, spawn: null, ev: [] };
  const p = dockPartner(n.grid, n.w, n.h, j, code);
  if (p >= 0){ last.partner = p; last.partnerCode = n.grid[p]; last.color = dock(n, j, p, last.ev); }
  if (!isWin(n)){
    tickTimers(n, last.ev);
    if (n.every > 0){
      if (n.moves % n.every === 0) last.spawn = spawn(n, last.ev);
      else if (n.next && n.grid[n.next.cell] !== 0) n.next.cell = nearestEmpty(n.grid, n.w, n.next.cell);  // искру заняли — переезжает
    }

}
function goalProgress(s){

  if (s.order) s.order.forEach((n, c) => { done += Math.min(s.got[c], n); total += n; });
  return { done, total };
}
function isWin(s){ return s.docks >= s.goal && s.crates >= s.crateGoal && (!s.order || s.order.every((n, c) => s.got[c] >= n)); }
function isLose(s){ return !isWin(s) && (s.dead || legalMoves(s).length === 0); }
function dockMoves(s){ return legalMoves(s).filter(m => peekMove(s, m).partner >= 0); }

// Солвер: поиск лучом по слоям глубины (каждый слой — ход). Возвращает список ходов или null.
// Первый найденный выигрыш — самый короткий среди просмотренных; при узком луче это «лучшее найденное», не точный минимум.
function stateKey(s){ return s.grid.join(',') + '|' + (s.next ? s.next.code + ':' + s.next.cell : '') + '|' + s.docks + ',' + s.crates + ',' + s.got.join('') + '|' + (s.every ? s.moves % s.every : 0); }
function scoreState(s){ return goalProgress(s).done * 1000 + dockMoves(s).length * 25 - pieceCount(s) * 4; }
function solve(s0, width){
  width = width || CFG.PAR_BEAM;
  if (isWin(s0)) return [];
  let beam = [{ s: s0, path: [] }];
  const seen = new Set([stateKey(s0)]);
  for (let depth = 0; depth < CFG.MAX_DEPTH; depth++){
    const cand = [];
    for (const node of beam){
      for (const m of legalMoves(node.s)){
        const n = applyMove(node.s, m), key = stateKey(n);
        if (seen.has(key)) continue;
        seen.add(key);
        const path = node.path.concat(m);
        if (isWin(n)) return path;
        if (isLose(n)) continue;
        cand.push({ s: n, path, sc: scoreState(n) });
      }
    }
    if (!cand.length) return null;
    cand.sort((a, b) => b.sc - a.sc);
    beam = cand.slice(0, width);
  }
  return null;
}

// Боты для симулятора (PROTO-BASE §6). Все возвращают метрики ощущения, не только исход.
//   random — любой ход; novice — стыкует, если видит готовую стыковку, иначе любой ход;
//   greedy — стыкует с пользой для цели, иначе ход, после которого прогресс и готовых стыковок больше всего (на шаг вперёд).
function greedyPick(s){
  let best = -1, bs = -Infinity;
  const p0 = goalProgress(s).done;
  for (const m of legalMoves(s)){
    const n = applyMove(s, m);
    if (isWin(n)) return m;
    const sc = isLose(n) ? -1e9 : (goalProgress(n).done - p0) * 1000 + n.docks * 30 + dockMoves(n).length * 10 - pieceCount(n);
    if (sc > bs){ bs = sc; best = m; }
  }
  return best;
}
function playBot(s, policy, seed){
  const rnd = mulberry32(seed || 1);
  let steps = 0, withDock = 0, firstDock = -1;
  while (!isWin(s) && !isLose(s) && steps < CFG.BOT_CAP){
    const moves = legalMoves(s), dm = dockMoves(s);
    if (dm.length) withDock++;
    let m;
    if (policy === 'greedy') m = greedyPick(s);
    else if (policy === 'novice' && dm.length) m = dm[Math.floor(rnd() * dm.length)];
    else m = moves[Math.floor(rnd() * moves.length)];
    const d0 = s.docks;
    s = applyMove(s, m); steps++;
    if (firstDock < 0 && s.docks > d0) firstDock = steps;
  }
  const pr = goalProgress(s);
  return { win: isWin(s), moves: s.moves, docks: s.docks, goal: pr.total, done: pr.done, obvious: steps ? withDock / steps : 0, firstDock, full: isLose(s) };
}
function greedyPlay(s){ return playBot(s, 'greedy', 1); }
function randomRun(li, seed){ return playBot(createState(li), 'random', seed); }
function noviceRun(li, seed){ return playBot(createState(li), 'novice', seed); }
function greedyRun(li){ return playBot(createState(li), 'greedy', 1); }

// Оболочка: экраны, ввод, рендер, звук, сейв, дебаг-хук. Время абсолютное (§4).

}

  hintFor: null, hintMove: -1,   // подсказка: для какого состояния посчитана и какой ход
  slotAt: [],                    // когда фигура долетит до слота копилки (мс performance.now)
  fxOpen: [],                    // открытые эффекты для журнала fx.end: { name, t1 }
  fxUntil: 0,                    // когда закончится последний эффект
  ending: 0,                     // когда показать win/lose; 0 — не ждём
  drag: null,                    // { cell, sx, sy, id, dir }
  levelT0: 0,                    // старт уровня (пульс панели цели)
  toldSpark: false,              // тост про занятую искру уже показан
  cursor: 0, kbd: false,         // клавиатурный курсор (отладка на десктопе)
  timeScale: 1,
  paused: false,
};

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---
const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];   // пентатоника для щелчков по счёту стыковок
const Audio = {
  ac: null, noiseBuf: null,
  init(){
    if (this.ac){ if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; return; }
    const len = Math.floor(this.ac.sampleRate * 0.5), buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0), rnd = mulberry32(99);
    for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
    this.noiseBuf = buf;
  },
  on(){ return this.ac && !G.save.muted; },
  tone(freq, ms, type, delay, vol, toFreq){
    if (!this.on()) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, e);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, e);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(e + 0.02);
  },
  hiss(ms, f0, f1, delay, vol, type){
    if (!this.on() || !this.noiseBuf) return;
    const src = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    src.buffer = this.noiseBuf; f.type = type || 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, e);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, e);
    src.connect(f).connect(g).connect(this.ac.destination); src.start(t); src.stop(e + 0.02);
  },
  swipe(ms){ this.hiss(Math.max(80, ms), 900, 2400, 0, 0.12); log('sound', 'swipe'); },
  thunk(delay, dist){ const f = 200 - Math.min(5, dist || 1) * 14; this.tone(f, 100, 'sine', delay, 0.32, f * 0.5); this.hiss(50, 700, 250, delay, 0.1); log('sound', 'thunk'); },
  click(k, delay, combo){                            // «щёлк» стыковки: сухой клик + аккорд, выше с каждой фигурой и серией
    const f = NOTES[Math.min(k + Math.max(0, (combo || 1) - 1), NOTES.length - 1)];
    this.hiss(30, 5000, 3500, delay, 0.4, 'highpass');
    this.tone(f, 300, 'triangle', delay + 0.03, 0.22);
    this.tone(f * 1.5, 260, 'sine', delay + 0.06, 0.1);
    this.tone(f * 2, 200, 'sine', delay + 0.09, 0.07);
    if ((combo || 1) >= 2) this.hiss(260, 6000, 9000, delay + 0.08, 0.06, 'highpass');   // искристый хвост серии
    log('sound', 'click', 'k=' + k + ' combo=' + combo);
  },
  coin(delay){ this.tone(1568, 60, 'square', delay, 0.04); this.tone(2093, 140, 'sine', delay + 0.04, 0.12); log('sound', 'slot'); },
  star(i, delay){ const f = NOTES[2 + i * 2]; this.tone(f, 320, 'triangle', delay, 0.2); this.tone(f * 2, 240, 'sine', delay + 0.02, 0.08); log('sound', 'star', 'i=' + i); },
  fanfare(delay){
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 200, 'triangle', delay + i * 0.08, 0.18));
    [523, 659, 784, 1047].forEach((f) => this.tone(f, 700, 'sine', delay + 0.36, 0.09));
    this.hiss(500, 3000, 8000, delay + 0.3, 0.07, 'highpass');
    log('sound', 'fanfare');
  },
  crack(delay){ this.hiss(140, 900, 300, delay, 0.35, 'lowpass'); this.tone(240, 90, 'square', delay, 0.06, 120); log('sound', 'crack'); },
  clink(delay){ this.tone(2400, 70, 'square', delay, 0.05); this.tone(3100, 120, 'triangle', delay + 0.05, 0.06); log('sound', 'clink'); },
  petrify(delay){ this.tone(120, 260, 'sawtooth', delay, 0.1, 60); this.hiss(260, 500, 150, delay, 0.2, 'lowpass'); log('sound', 'petrify'); },
  intro(){ [392, 523, 659].forEach((f, i) => this.tone(f, 120, 'sine', i * 0.06, 0.08)); log('sound', 'intro'); },
  plop(delay){ this.tone(720, 120, 'sine', delay, 0.16, 300); log('sound', 'plop'); },
  nope(){ this.tone(140, 70, 'square', 0, 0.05); log('sound', 'nope'); },
  undo(){ this.hiss(120, 2400, 900, 0, 0.1); log('sound', 'undo'); },
  win(){ this.tone(1047, 200, 'triangle', 0, 0.12); log('sound', 'win'); },
  lose(){ this.tone(330, 220, 'triangle', 0, 0.16, 220); this.tone(220, 360, 'triangle', 0.18, 0.16, 140); log('sound', 'lose'); },
};
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// --- экраны: DOM-оверлеи, любой открывается кодом или хешем (§6, §11) ---
const $ = (id) => document.getElementById(id);
const STARS = (k) => '★'.repeat(k) + '☆'.repeat(3 - k);
function starsFor(s, par){ return par == null ? 3 : s.moves <= par + CFG.STAR3_SLACK ? 3 : s.moves <= par + CFG.STAR2_SLACK ? 2 : 1; }
// Уровень открыт, если до него дошёл прогресс или включён чит «открыть все уровни».
function isOpen(li){ return G.save.unlockAll || li <= G.save.level; }
function setUnlockAll(on){ G.save.unlockAll = !!on; save(); log('event', 'cheat', 'unlockAll=' + G.save.unlockAll); if (on) toast('Все уровни открыты'); }
function goto(screen, payload){
  G.screen = screen; log('screen', screen);
  const ov = $('overlay'), card = $('card');
  if (screen === 'game'){ ov.classList.remove('show'); return; }
  ov.classList.add('show');
  if (screen === 'menu'){
    let lv = '';
    const CH = { 0: 'Основа', 10: 'A · верх и низ', 15: 'B · мёд', 20: 'C · радужная', 25: 'D · ящики', 30: 'E · цепи', 35: 'F · таймер', 40: 'G · заказ', 45: 'Экзамен' };
    for (let i = 0; i < LEVELS.length; i++){
      if (CH[i]) lv += `<div class="ch">${CH[i]}</div>`;
      const b = G.save.best[i] || 0, open = isOpen(i);
      lv += `<button data-act="lvl" data-li="${i}" class="${open ? '' : 'locked'}">${open ? i + 1 : '🔒'}<small>${b ? STARS(b) : open ? '&nbsp;' : i + 1}</small></button>`;
    }
    card.innerHTML = `<h2>Половинки</h2><p>Свайпни половинку — она скользит до упора. Левую стыкуй с правой того же цвета.</p>
      <div class="row"><button class="primary" data-act="play">Играть · уровень ${G.save.level + 1}</button></div>
      <div class="levels">${lv}</div><div class="row"><button data-act="help">Как играть</button></div>
      <div class="row">${G.save.unlockAll ? '<button class="cheat" data-act="relock">Чит включён · закрыть обратно</button>' : '<button class="cheat" data-act="unlock">Чит: открыть все уровни</button>'}<button class="cheat" data-act="wipe">Сбросить прогресс</button></div>`;
  }
  if (screen === 'help') card.innerHTML = `<h2>Как играть</h2><p style="text-align:left">
      • Свайп по плитке — она скользит до стены, камня или другой плитки.<br>
      • Левая половинка встала вплотную слева от правой того же цвета — щёлк, фигура в копилку.<br>
      • После хода падает новая половинка: искра на поле показывает куда, окошко «дальше» — какая.<br>
      • Собери цель, пока поле не забилось.<br>
      • Дальше: верх/низ, мёд-стоп, радужная к любому цвету, ящики и цепи ломаются стыковкой рядом, таймер, заказ.</p><button class="primary" data-act="back">Понятно</button>`;
  if (screen === 'win'){
    const n = payload ? payload.stars : 3;
    let st = ''; for (let i = 0; i < 3; i++) st += `<span class="st ${i < n ? 'on' : 'off'}" style="animation-delay:${(0.12 + i * 0.22).toFixed(2)}s">★</span>`;
    card.innerHTML = `<h2>${n === 3 ? 'Идеально!' : n === 2 ? 'Отлично!' : 'Собрано!'}</h2><div class="stars">${st}</div><p>${payload ? payload.text : ''}</p>
      <div class="row"><button class="primary" data-act="next">Дальше</button><button data-act="retry">Ещё раз</button></div>`;
  }
  if (screen === 'lose'){
    const canUndo = G.undoLeft > 0 && G.hist.length > 0;
    const pr = G.s ? goalProgress(G.s) : { done: 0, total: 0 };
    card.innerHTML = `<h2>${G.s && G.s.dead ? 'Окаменела!' : 'Поле забито'}</h2><p>${G.s && G.s.dead ? 'Половинка с таймером не успела.' : 'Ходить больше некуда.'} Цель: ${pr.done} из ${pr.total}.</p>
      <div class="row"><button class="primary" data-act="retry">Ещё раз</button>${canUndo ? `<button data-act="undo">Отменить ход (${G.undoLeft})</button>` : ''}<button data-act="menu">Меню</button></div>`;
  }
}
$('card').addEventListener('click', (e) => {
  const el = e.target && e.target.closest ? e.target.closest('button') : null;
  const act = el && el.dataset.act; if (!act) return;
  Audio.init(); log('input', 'button', act);
  if (act === 'play') startLevel(G.save.level);
  else if (act === 'lvl'){ if (isOpen(+el.dataset.li)) startLevel(+el.dataset.li); else { toast('Сначала пройди уровень ' + (G.save.level + 1)); Audio.nope(); } }
  else if (act === 'unlock' || act === 'relock'){ setUnlockAll(act === 'unlock'); goto('menu'); }
  else if (act === 'wipe'){ G.save = { level: 0, muted: G.save.muted, best: {}, unlockAll: false }; save(); log('event', 'cheat', 'wipe'); goto('menu'); }
  else if (act === 'retry') startLevel(G.s ? G.s.li : G.save.level);
  else if (act === 'next') startLevel(G.s ? G.s.li + 1 : G.save.level);
  else if (act === 'undo'){ goto('game'); undo(); }
  else if (act === 'help') goto('help');
  else if (act === 'back') goto(G.s ? 'game' : 'menu');
  else goto('menu');
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'game' && !G.s) startLevel(G.save.level); else if (h && h !== G.screen) goto(h); });

let toastUntil = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.remove('hide'); toastUntil = performance.now() + CFG.TOAST_MS; }

// Мягкая очистка (новый ход): обрываем то, что привязано к клеткам; уже вспыхнувшие стыковки, частицы
// и надписи доигрывают — быстрый игрок не теряет «щёлк». Полная (старт уровня, отмена) — всё.
function clearFx(hard){
  const now = performance.now();
  const keep = (f) => !hard && f.ref && now >= f.ref.t0;
  for (const f of G.fxOpen) if (!keep(f)) log('fx.end', f.name, 'cut');
  G.fxOpen = G.fxOpen.filter(keep);
  G.merges = hard ? [] : G.merges.filter(M => now >= M.t0);
  for (let k = 0; k < G.slotAt.length; k++) if (G.slotAt[k] > now && !G.merges.some(M => M.slot === k)) G.slotAt[k] = now;
  G.slide = null; G.drop = null; G.wiggle = null; G.land = null; G.hit = null; G.ghosts = [];
  if (hard){ G.parts = []; G.praise = []; G.shake = null; G.combo = 0; G.crateFly = []; }
  G.fxUntil = G.fxOpen.reduce((m, f) => Math.max(m, f.t1), 0);
  if (G.s) G.slotAt = G.slotAt.slice(0, G.s.docks);
}
function startLevel(li){
  li = Math.max(0, li);
  G.s = createState(li); G.s0 = G.s; G.hist = []; G.undoLeft = CFG.UNDO_PER_LEVEL; G.par = null;
  G.ending = 0; G.drag = null; G.slotAt = []; G.chipAt = {}; G.winT = 0; clearFx(true); G.levelT0 = performance.now(); G.lastInputT = G.levelT0; G.hintFor = null;
  Audio.intro(); log('fx.start', 'intro'); G.fxOpen.push({ name: 'intro', t1: G.levelT0 + CFG.INTRO_MS + CFG.INTRO_STEP * 12 });
  G.cursor = G.s.grid.findIndex(c => c > 0);
  const spec = levelSpec(li);
  $('tip').textContent = spec.tip || '';
  log('event', 'level.start', 'level=' + (li + 1) + ' goal=' + goalProgress(G.s).total + ' every=' + G.s.every);
  goto('game'); hud();
  const s0 = G.s0;
  setTimeout(() => { if (G.s0 === s0){ const p = solve(s0, CFG.PAR_BEAM); G.par = p ? p.length : null; log('event', 'par', 'par=' + G.par); } }, 60);
}
function hud(){
  $('hud-level').textContent = 'Уровень ' + (G.s ? G.s.li + 1 : G.save.level + 1);
  $('hud-moves').textContent = G.s ? 'ходов: ' + G.s.moves : '';
  $('btn-mute').textContent = G.save.muted ? '🔇' : '🔊';
  $('btn-undo').textContent = 'Отмена (' + G.undoLeft + ')';
  $('btn-undo').disabled = !G.s || !G.hist.length || G.undoLeft <= 0;
}

// --- ход в оболочке: ядро считает, оболочка раскладывает эффекты по абсолютному времени ---
function doMove(m){
  if (!G.s || G.screen !== 'game' || G.ending || isWin(G.s) || isLose(G.s)) return false;
  const i = m >> 2, d = m & 3;
  if (G.s.grid[i] <= 0) return false;
  const next = applyMove(G.s, m);
  if (!next){ bump(i, d); return false; }
  clearFx(false);
  G.lastInputT = performance.now();
  G.combo = next.last.partner >= 0 ? G.combo + 1 : 0;
  G.hist.push(G.s); G.s = next;
  log('input', 'swipe', 'cell=' + i + ' dir=' + '→←↓↑'[d]);
  animateMove(next);
  hud();
  if (isWin(G.s)) log('event', 'level.win', 'moves=' + G.s.moves);
  else if (isLose(G.s)) log('event', 'level.lose', 'moves=' + G.s.moves + ' done=' + goalProgress(G.s).done);
  return true;
}
function fxOpen(name, t1, info, ref){ G.fxOpen.push({ name, t1, ref }); log('fx.start', name, info); G.fxUntil = Math.max(G.fxUntil, t1); }
const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
function shakeAt(t0, amp){ if (REDUCED) return; if (!G.shake || G.shake.t1 < t0 || G.shake.amp < amp) G.shake = { t0, t1: t0 + CFG.SHAKE_MS / G.timeScale, amp }; }
function praise(text, x, y, t0, color, size){ G.praise.push({ text, x: Math.max(70, Math.min(W - 70, x)), y, t0, t1: t0 + CFG.PRAISE_MS / G.timeScale, color, size: size || 26 }); log('fx.start', 'praise', text); }
const PRAISE = ['Щёлк!', 'Отлично!', 'Супер!', 'Вау!', 'Невероятно!'];
// Частицы: dot — кружок, rect — вертящееся конфетти, star — искра, dust — пыль. Всё от сида, без Math.random.
function burst(n, x, y, t0, opts){
  const rnd = mulberry32(((t0 * 7) | 0) + n * 131 + (x | 0));
  for (let k = 0; k < n; k++){
    const a = opts.angle !== undefined ? opts.angle + (rnd() - 0.5) * (opts.spread || 1) : rnd() * Math.PI * 2;
    const v = (opts.v || 0.2) * (0.5 + rnd());
    G.parts.push({ type: opts.type || 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + (opts.vy || 0), t0, life: (opts.life || 600) * (0.7 + rnd() * 0.6),
      color: opts.colors ? opts.colors[k % opts.colors.length] : opts.color, r: (opts.r || 3) * (0.6 + rnd() * 0.8), rot: rnd() * 6.28, spin: (rnd() - 0.5) * 0.03, ph: rnd() * 6.28, g: opts.g === undefined ? 0.0004 : opts.g });
  }
}
function animateMove(n){
  const L = n.last, T = performance.now(), ts = G.timeScale;
  const slideMs = Math.max(CFG.SLIDE_MIN_MS, L.dist * CFG.SLIDE_MS_CELL) / ts;
  const t1 = T + slideMs;
  G.slide = { code: L.code, from: L.from, to: L.to, dir: L.dir, t0: T, t1 };
  fxOpen('slide', t1, 'cells=' + L.dist);
  Audio.swipe(slideMs); buzz(8);
  const g = geo(), cs = g.cell, dx = DIRS[L.dir][0], dy = DIRS[L.dir][1];
  if (L.partner < 0){
    // остановка: плитка сплющивается, у переднего края — пыль; то, во что упёрлись, вздрагивает
    G.land = { cell: L.to, dir: L.dir, t0: t1, t1: t1 + CFG.LAND_MS / ts };
    const x = L.to % n.w, y = (L.to - x) / n.w, bx = x + dx, by = y + dy, p = cellXY(L.to, g);
    const ex = p.x + cs / 2 + dx * cs * 0.45, ey = p.y + cs / 2 + dy * cs * 0.45;
    burst(7, ex, ey, t1, { type: 'dust', color: -1, angle: Math.atan2(-dy, -dx), spread: 2.6, v: 0.09, life: 380, r: 4, g: 0 });
    if (bx >= 0 && by >= 0 && bx < n.w && by < n.h) G.hit = { cell: by * n.w + bx, dir: L.dir, t0: t1, t1: t1 + CFG.HIT_MS / ts };
    else if (L.dist >= 2) shakeAt(t1, 2);
  }
  let slot = n.docks - (L.partner >= 0 ? 1 : 0) - (L.spawn && L.spawn.partner >= 0 ? 1 : 0);
  let tNext = t1;
  if (L.partner >= 0){
    addMerge(L.to, L.partner, L.code, L.partnerCode, L.color, T, t1, slot++, G.combo, 'move');
    Audio.click(slot - 1, slideMs / 1000, G.combo); buzz([10, 30, 14]);
    tNext = t1 + CFG.DOCK_MS * 0.55 / ts;
  } else Audio.thunk(slideMs / 1000, L.dist);
  if (L.spawn){
    const S = L.spawn, d1 = tNext + CFG.SPAWN_MS / ts;
    G.drop = { code: S.code, cell: S.cell, t0: tNext, t1: d1 };
    fxOpen('drop', d1, 'cell=' + S.cell + (S.cell !== S.planned ? ' moved' : ''));
    Audio.plop((tNext - T) / 1000);
    if (S.partner >= 0){ addMerge(S.cell, S.partner, S.code, S.partnerCode, S.color, T, d1, slot++, 1, 'gift'); Audio.click(slot - 1, (d1 - T) / 1000, 1); }
    else { const p = cellXY(S.cell, geo()); burst(8, p.x + geo().cell / 2, p.y + geo().cell * 0.9, d1, { type: 'dust', color: -1, angle: -Math.PI / 2, spread: 3, v: 0.07, life: 340, r: 3.5, g: 0 }); }
    if (S.cell !== S.planned && !G.toldSpark){ G.toldSpark = true; toast('Искру заняли — половинка упала рядом'); }   // один раз за сессию, не попап на ход
  }
  animateEvents(L, T, t1);
  if (isWin(n)) celebrate(Math.max(G.merges.reduce((m, M) => Math.max(m, M.flyEnd), t1), G.crateFly.reduce((m, f) => Math.max(m, f.t1), 0)));
  else if (isLose(n)) shakeAt(Math.max(G.fxUntil, t1), 7);
}
// Победа: когда последняя фигура долетела в копилку — «Готово!», дождь конфетти, фанфара; карточка — после паузы.
function celebrate(t){
  const g = geo(), hold = CFG.WIN_HOLD_MS / G.timeScale;
  G.winT = t;
  praise('Готово!', W / 2, g.oy + g.bh * 0.45, t, P.accent, 40);
  const cols = [0, 1, 2, 3, 4, -2];
  for (let k = 0; k < (REDUCED ? 20 : CFG.CONFETTI_WIN); k++){
    const r = mulberry32(900 + k);
    G.parts.push({ type: 'rect', x: r() * W, y: -10 - r() * 120, vx: (r() - 0.5) * 0.05, vy: 0.12 + r() * 0.16, t0: t + r() * 250, life: 2600,
      color: cols[k % cols.length], r: 4 + r() * 3, rot: r() * 6.28, spin: (r() - 0.5) * 0.02, ph: r() * 6.28, g: 0.00005, sway: 10 });
  }
  shakeAt(t, 5);
  Audio.fanfare((t - performance.now()) / 1000);
  fxOpen('celebrate', t + hold, 'confetti=' + CFG.CONFETTI_WIN);
}
// Стыковка: active — клетка пришедшей половинки, partner — стоявшей. До t0 стоящую рисуем как плитку.
function addMerge(active, partner, code, partnerCode, color, tShow, t0, slot, combo, kind){
  const ts = G.timeScale, t1 = t0 + CFG.DOCK_MS / ts, flyEnd = t1 + CFG.FLY_MS / ts, col = color;
  const first = (sideOf(code) & 1) === 0;                    // пришла левая/верхняя
  const aCell = first ? active : partner, bCell = first ? partner : active, vert = isVert(code);
  const target = targetFor(col, slot);

  G.merges.push(M);
  if (target.kind === 'slot') G.slotAt[slot] = flyEnd;
  else if (target.kind === 'chip') G.chipAt[target.key] = Math.max(G.chipAt[target.key] || 0, flyEnd);
  fxOpen('dock', flyEnd, SHAPES[col] + ' target=' + (target.key || target.kind) + ' combo=' + M.combo, M);

  const g = geo(), j = mergeJoint(M, g), cx = j.x, cy = j.y, tp = t0 + CFG.DOCK_MS * 0.45 / ts;
  const power = Math.min(4, M.combo);
  burst(10 + power * 3, cx, cy, tp, { type: 'dot', colors: [col, col, -2], v: 0.2 + power * 0.03, vy: -0.1, life: 650, r: 3.2 });
  burst(CFG.CONFETTI_DOCK + power * 4, cx, cy, tp, { type: 'rect', colors: [col, -2, 2, col], v: 0.24 + power * 0.03, vy: -0.16, life: 900, r: 4, g: 0.0005 });
  burst(5 + power, cx, cy, tp, { type: 'star', color: -2, v: 0.16, life: 520, r: 7, g: 0 });
  const rainbow = colorOf(code) === RAINBOW || colorOf(partnerCode) === RAINBOW;
  const offOrder = target.kind === 'none' && !!G.s.order;
  const text = offOrder ? 'Не в заказ' : kind === 'gift' ? 'Подарок!' : rainbow && M.combo <= 1 ? 'Радуга!' : M.combo <= 1 ? PRAISE[0] : PRAISE[Math.min(M.combo - 1, PRAISE.length - 1)] + ' ×' + M.combo;

// Точка стыка пары: середина общего ребра клеток.
function mergeJoint(M, g){ const a = cellXY(M.aCell, g); return M.vert ? { x: a.x + g.cell / 2, y: a.y + g.cell } : { x: a.x + g.cell, y: a.y + g.cell / 2 }; }

function animateEvents(L, T, t1){

  const tp = (firstMerge === Infinity ? t1 : firstMerge) + CFG.DOCK_MS * 0.45 / ts;

    const p = cellXY(e.cell, g), cx = p.x + cs / 2, cy = p.y + cs / 2;

      burst(8, cx, cy, tp, { type: 'dust', color: -1, v: 0.08, life: 420, r: 5, g: 0 });

const cv = $('cv'), ctx = cv.getContext('2d'), tipEl = $('tip');

let scale = 1, W = VW, H = 600, DPR = 1;

const PANEL_H = 84, PANEL_GAP = 22, TIP_H = 44, NEXT_W = 112;
function geo(){
  const s = G.s, avail = H - 8;
  const cell = Math.min((W - 24) / s.w, (avail - PANEL_H - PANEL_GAP - TIP_H - 16) / s.h, 80);
  const bw = cell * s.w, bh = cell * s.h, group = PANEL_H + PANEL_GAP + bh + 16 + TIP_H;
  const top = 6 + Math.max(0, (avail - group) * 0.32), ox = (W - bw) / 2;
  const px = Math.max(10, ox - 8), pw = W - 2 * px;
  const hasNext = s.every > 0;
  return { cell, ox, oy: top + PANEL_H + PANEL_GAP, bw, bh, py: top, px, pw,
    goalW: hasNext ? pw - NEXT_W - 10 : pw, nextX: px + pw - NEXT_W, tipY: top + PANEL_H + PANEL_GAP + bh + 14 };
}
function cellXY(i, g){ const x = i % G.s.w; return { x: g.ox + x * g.cell, y: g.oy + (i - x) / G.s.w * g.cell }; }
function cellAt(p){
  if (!G.s) return -1;
  const g = geo(), x = Math.floor((p.x - g.ox) / g.cell), y = Math.floor((p.y - g.oy) / g.cell);
  return x < 0 || y < 0 || x >= G.s.w || y >= G.s.h ? -1 : y * G.s.w + x;

cv.addEventListener('pointerdown', (e) => {
  Audio.init();

  const i = cellAt(toVirtual(e));
  if (i < 0 || G.s.grid[i] <= 0) return;
  G.drag = { cell: i, sx: e.clientX, sy: e.clientY, id: e.pointerId, dir: -1, len: 0 }; G.kbd = false; G.lastInputT = performance.now();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', (e) => {
  const D = G.drag; if (!D || e.pointerId !== D.id) return;
  const dx = e.clientX - D.sx, dy = e.clientY - D.sy;
  D.len = Math.hypot(dx, dy);
  D.dir = Math.hypot(dx, dy) < CFG.SWIPE_PX ? -1 : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 1) : (dy > 0 ? 2 : 3);
});
function onUp(e){
  const D = G.drag; if (!D || e.pointerId !== D.id) return;
  G.drag = null;
  if (D.dir < 0){ bump(D.cell, -1); return; }      // тап — плитка вздрагивает, хода нет

}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
document.addEventListener('keydown', (e) => {          // дубли на клавиатуру для отладки (§3): WASD — курсор, стрелки — свайп
  if (!G.s) return;
  G.lastInputT = performance.now();
  const w = G.s.w, N = G.s.grid.length, c = G.cursor;
  const arrows = { ArrowRight: 0, ArrowLeft: 1, ArrowDown: 2, ArrowUp: 3 }, cur = { d: 1, a: -1, s: w, w: -w };
  if (e.key in arrows){ e.preventDefault(); G.kbd = true; if (doMove(c * 4 + arrows[e.key]) && G.s.grid[G.s.last.to] > 0) G.cursor = G.s.last.to; }
  else if (e.key in cur){ G.kbd = true; G.cursor = Math.max(0, Math.min(N - 1, c + cur[e.key])); }
  else if (e.key === 'z' || e.key === 'u') undo();
  else if (e.key === 'r') startLevel(G.s.li);
  else if (e.key === 'm') goto('menu');
});
$('btn-undo').onclick = () => { log('input', 'button', 'undo'); undo(); };
$('btn-reset').onclick = () => { log('input', 'button', 'reset'); startLevel(G.s ? G.s.li : G.save.level); };
$('btn-menu').onclick = () => { log('input', 'button', 'menu'); goto('menu'); };
$('btn-mute').onclick = () => { G.save.muted = !G.save.muted; save(); hud(); log('input', 'button', 'mute=' + G.save.muted); };

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
function fit(){
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  const cw = Math.round(r.width * DPR), ch = Math.round(r.height * DPR);

let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);

// --- рисование: именованные функции, цвета из CSS-переменных (§9, §11) ---
let P = {};
function readPalette(){

    ink: v('--ink'), muted: v('--muted'), accent: v('--accent'), danger: v('--danger'), pInk: v('--panel-ink'), pMuted: v('--panel-muted'), pSlot: v('--panel-slot'), honey: v('--honey'), wood: v('--wood'), woodDark: v('--wood-dark'), steel: v('--steel'),

const HALF_R = 0.5;                                // «радиус» фигуры в долях клетки: половинка занимает около половины плитки
function rr(c, x, y, w, h, r){ c.beginPath(); c.roundRect(x, y, w, h, r); }
// Контур фигуры цвета col с центром (cx, cy) и «радиусом» R. Все фигуры симметричны относительно вертикали —
// поэтому половинки режутся по вертикальной оси и стыкуются ровным краем.
function shapePath(c, col, cx, cy, R){
  c.beginPath();

    c.moveTo(cx, cy + R * 0.9);
    c.bezierCurveTo(cx - R * 1.3, cy + R * 0.05, cx - R * 0.8, cy - R * 1.05, cx, cy - R * 0.42);
    c.bezierCurveTo(cx + R * 0.8, cy - R * 1.05, cx + R * 1.3, cy + R * 0.05, cx, cy + R * 0.9);
  } else if (SHAPES[col] === 'circle' || SHAPES[col] === 'rainbow'){
    c.arc(cx, cy, R * 0.86, 0, Math.PI * 2);
  } else if (SHAPES[col] === 'star'){
    for (let k = 0; k < 10; k++){
      const a = -Math.PI / 2 + k * Math.PI / 5, rr2 = k % 2 ? R * 0.44 : R * 1.0;
      c.lineTo(cx + Math.cos(a) * rr2, cy + 0.08 * R + Math.sin(a) * rr2);
    }

    c.moveTo(cx, cy - R); c.lineTo(cx + R * 0.78, cy); c.lineTo(cx, cy + R); c.lineTo(cx - R * 0.78, cy);
  } else {                                           // капля: острый верх, круглый низ
    c.moveTo(cx, cy - R);

// Целая фигура: заливка цветом, тёмный контур, блик.
function drawShape(c, col, cx, cy, R){
  shapePath(c, col, cx, cy, R);
  if (col === RAINBOW){                                // радужная: круг в полосах всех цветов
    c.save(); c.clip(); const bands = 5, top = cy - R, hh = (2 * R) / bands;
    for (let k = 0; k < bands; k++){ c.fillStyle = P.colors[k]; c.fillRect(cx - R, top + k * hh, 2 * R, hh + 0.5); }
    c.restore(); shapePath(c, col, cx, cy, R);

// Половинка code: целая фигура с центром на ровном крае (ex, ey), обрезанная по краю и по плитке (bx, by, bw, bh).
// Стороны: 0 левая (край справа), 1 правая (край слева), 2 верхняя (край снизу), 3 нижняя (край сверху).

// Точка ровного края половинки в клетке (x, y) размера s с отступом pad.
function halfEdge(code, x, y, s, pad){
  const sd = sideOf(code);
  return sd === 0 ? { x: x + s - pad, y: y + s / 2 } : sd === 1 ? { x: x + pad, y: y + s / 2 } : sd === 2 ? { x: x + s / 2, y: y + s - pad } : { x: x + s / 2, y: y + pad };
}// Плитка с половинкой в клетке (x, y) размера s. Ровный край половинки лежит на краю плитки —
// две соседние плитки «левая | правая» показывают почти целую фигуру с зазором.
// scl — общий масштаб, sx/sy — растяжение по осям (скольжение, сплющивание при остановке).
// Плитка с половинкой в клетке (x, y) размера s. Ровный край половинки лежит на краю плитки —
// две соседние плитки-пары показывают почти целую фигуру с зазором. Цепь и таймер рисуются поверх.
// scl — общий масштаб, sx/sy — растяжение по осям (скольжение, сплющивание при остановке).
function drawPiece(c, code, x, y, s, alpha, scl, sx, sy){
  const pad = s * 0.06, r = s * 0.2, cx = x + s / 2, cy = y + s / 2, kx = (scl || 1) * (sx || 1), ky = (scl || 1) * (sy || 1);

  c.fillStyle = P.shadow; rr(c, x + pad, y + pad + s * 0.05, s - 2 * pad, s - 2 * pad, r); c.fill();
  c.fillStyle = P.tile; rr(c, x + pad, y + pad, s - 2 * pad, s - 2 * pad, r); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.7)'; rr(c, x + s * 0.18, y + pad + s * 0.035, s * 0.64, s * 0.07, s * 0.035); c.fill();   // блик сверху

// Цепь: два перекрещенных ряда звеньев и замочек — плитка не двигается.
function drawChain(c, x, y, s){
  c.save(); c.strokeStyle = P.steel; c.lineWidth = s * 0.055; c.lineCap = 'round';
  const L = 6;
  for (const [x0, y0, x1, y1] of [[x + s * 0.12, y + s * 0.12, x + s * 0.88, y + s * 0.88], [x + s * 0.88, y + s * 0.12, x + s * 0.12, y + s * 0.88]]){
    for (let k = 0; k < L; k++){
      const u = (k + 0.5) / L, px = x0 + (x1 - x0) * u, py = y0 + (y1 - y0) * u, ang = Math.atan2(y1 - y0, x1 - x0);

    }
  }

}
// Таймер: кружок с числом у угла, противоположного ровному краю; 1–2 хода — красный и пульсирует.
function drawTimer(c, code, t, x, y, s){

  const bx = sd === 0 ? x + s * 0.24 : sd === 1 ? x + s * 0.76 : x + s * 0.78, by = sd === 2 ? y + s * 0.24 : sd === 3 ? y + s * 0.76 : y + s * 0.24;

    if (empty <= CFG.DANGER_EMPTY){
      const k = 0.5 + 0.5 * Math.sin(now / (110 + empty * 30));
      ctx.save(); ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--danger'); ctx.globalAlpha = 0.25 + 0.5 * k * (1 - empty / (CFG.DANGER_EMPTY + 1));
      ctx.lineWidth = 4; rr(ctx, g.ox - 8, g.oy - 8, g.bw + 16, g.bh + 16, 18); ctx.stroke(); ctx.restore();
    }
  }
  for (let i = 0; i < s.grid.length; i++){ const p = cellXY(i, g); ctx.fillStyle = P.slot; rr(ctx, p.x + cs * 0.05, p.y + cs * 0.05, cs * 0.9, cs * 0.9, cs * 0.18); ctx.fill(); if (s.floor[i] === HONEY) drawHoney(ctx, p.x, p.y, cs); }
  if (s.every > 0 && s.next && s.next.cell >= 0 && s.li <= 3 && s.moves < 3 && !(G.drop && now < G.drop.t1)) drawGuide(ctx, g, now);   // под панелями: дуга выходит из-под карточек и не пересекает текст
  drawGoal(ctx, g, now);
  if (s.every > 0 && s.next && !isWin(s)) drawNext(ctx, g, now);
  // искра следующей раздачи
  if (s.every > 0 && s.next && s.next.cell >= 0 && !isWin(s) && !(G.drop && now < G.drop.t1)){ const p = cellXY(s.next.cell, g); drawSpark(ctx, p.x, p.y, cs, s.next.code, now); }
  // превью свайпа: честный расчёт ядра — куда доедет и будет ли щёлк
  let ghost = null;
  if (G.drag && G.drag.dir >= 0){
    const pk = peekMove(s, G.drag.cell * 4 + G.drag.dir);
    if (pk.to !== G.drag.cell) ghost = { to: pk.to, partner: pk.partner, code: s.grid[G.drag.cell] };
  }
  // подсказка при бездействии: плитка с готовой стыковкой подмигивает в сторону пары (ход ядра, не догадка)
  let hintCell = -1, hintDir = 0, hintK = 0;
  const idle = now - G.lastInputT - CFG.IDLE_HINT_MS;
  if (idle > 0 && G.screen === 'game' && !G.drag && now >= G.fxUntil && !isWin(s) && !isLose(s)){
    if (G.hintFor !== s){ G.hintFor = s; const dm = dockMoves(s); G.hintMove = dm.length ? dm[0] : -1; if (G.hintMove >= 0) log('fx.start', 'hint', 'cell=' + (G.hintMove >> 2)); }
    if (G.hintMove >= 0){ hintCell = G.hintMove >> 2; hintDir = G.hintMove & 3; const ph = (idle % 1400) / 1400; hintK = ph < 0.4 ? Math.sin(ph / 0.4 * Math.PI * 2) : 0; }
  }
  // плитки из ядра; те, что сейчас в анимации, рисуют свои эффекты
  const skip = new Set();
  if (G.slide && now < G.slide.t1) skip.add(G.slide.to);
  if (G.drop && now < G.drop.t1) skip.add(G.drop.cell);
  if (ghost){
    const p = cellXY(ghost.to, g);
    ctx.save(); ctx.setLineDash([6, 5]); ctx.lineWidth = 2.5; ctx.strokeStyle = ghost.partner >= 0 ? P.accent : P.muted;
    rr(ctx, p.x + cs * 0.08, p.y + cs * 0.08, cs * 0.84, cs * 0.84, cs * 0.2); ctx.stroke(); ctx.restore();
    drawPiece(ctx, ghost.code, p.x, p.y, cs, 0.35);
  }
  const ghostAt = {};
  for (const q of G.ghosts) if (now < q.until) ghostAt[q.cell] = q;
  for (let i = 0; i < s.grid.length; i++){
    let c = s.grid[i];
    const gh = ghostAt[i];
    if (gh && gh.kind === 'crate'){ const p = cellXY(i, g); drawCrate(ctx, p.x, p.y, cs, 1 + 0.05 * Math.sin(now / 50)); continue; }
    if (gh && gh.kind === 'stone') c = gh.code;
    if (!c || skip.has(i)) continue;
    let { x, y } = cellXY(i, g);
    if (G.hit && G.hit.cell === i && now >= G.hit.t0 && now < G.hit.t1){      // во что упёрлись — вздрагивает от удара
      const v = (now - G.hit.t0) / (G.hit.t1 - G.hit.t0), k = Math.sin(v * Math.PI) * (1 - v) * cs * 0.09;
      x += DIRS[G.hit.dir][0] * k; y += DIRS[G.hit.dir][1] * k;
    }
    if (c === STONE){ drawStone(ctx, i, x, y, cs); continue; }
    if (c === CRATE){ drawCrate(ctx, x, y, cs); continue; }
    let scl = 1, sx = 1, sy = 1;
    if (now < G.levelT0 + CFG.INTRO_MS + CFG.INTRO_STEP * (s.w + s.h)){   // старт уровня: плитки впрыгивают по диагонали
      const v = (now - G.levelT0 - CFG.INTRO_STEP * ((i % s.w) + Math.floor(i / s.w))) / CFG.INTRO_MS;
      scl = 0.35 + 0.65 * backOut(v);
    }
    if (G.land && G.land.cell === i && now >= G.land.t0 && now < G.land.t1){  // остановка: сплющивание вдоль хода
      const v = (now - G.land.t0) / (G.land.t1 - G.land.t0), q = Math.sin(v * Math.PI) * (1 - v * 0.5) * 0.2;
      if (G.land.dir < 2){ sx = 1 - q; sy = 1 + q * 0.7; } else { sy = 1 - q; sx = 1 + q * 0.7; }
      x += DIRS[G.land.dir][0] * q * cs * 0.25; y += DIRS[G.land.dir][1] * q * cs * 0.25;
    }
    if (isWin(s) && G.winT && now >= G.winT){                                // победа: оставшиеся плитки подпрыгивают волной
      const v = (now - G.winT - 70 * ((i % s.w) + Math.floor(i / s.w))) / 320;
      if (v > 0 && v < 1){ const hop = Math.sin(v * Math.PI); y -= hop * cs * 0.18; scl *= 1 + hop * 0.08; }
    }
    if (i === hintCell){
      x += DIRS[hintDir][0] * hintK * cs * 0.08; y += DIRS[hintDir][1] * hintK * cs * 0.08;
    }
    if (G.wiggle && G.wiggle.cell === i && now < G.wiggle.t1){
      const u = (now - G.wiggle.t0) / (G.wiggle.t1 - G.wiggle.t0), k = Math.sin(u * Math.PI * 3) * (1 - u) * cs * 0.06;
      if (G.wiggle.dir < 0) scl = 1 + Math.sin(u * Math.PI) * 0.06; else { x += DIRS[G.wiggle.dir][0] * k; y += DIRS[G.wiggle.dir][1] * k; }
    }
    if (G.drag && G.drag.cell === i){                                          // плитка тянется за пальцем «резинкой»
      scl *= 1.06;
      if (G.drag.dir >= 0){ const pull = Math.min(cs * CFG.DRAG_PULL, G.drag.len / scale * 0.25); x += DIRS[G.drag.dir][0] * pull; y += DIRS[G.drag.dir][1] * pull; }
    }
    if (ghost && ghost.partner === i) scl *= 1 + 0.06 * (0.5 + 0.5 * Math.sin(now / 80));
    drawPiece(ctx, c, x, y, cs, 1, scl, sx, sy);
    if (gh && gh.kind === 'chain'){ ctx.save(); ctx.globalAlpha = 1; drawChain(ctx, x, y, cs); ctx.restore(); }
    if (i === hintCell){ ctx.save(); ctx.globalAlpha = 0.45 + 0.45 * Math.abs(hintK); ctx.strokeStyle = P.accent; ctx.lineWidth = 3.5;
      rr(ctx, x + 1, y + 1, cs - 2, cs - 2, cs * 0.22); ctx.stroke(); ctx.restore(); }
    if (G.kbd && i === G.cursor){ ctx.strokeStyle = P.accent; ctx.lineWidth = 3; rr(ctx, x + 2, y + 2, cs - 4, cs - 4, cs * 0.2); ctx.stroke(); }
  }
  if (G.kbd && s.grid[G.cursor] <= 0){ const p = cellXY(G.cursor, g); ctx.strokeStyle = P.accent; ctx.lineWidth = 2; rr(ctx, p.x + 4, p.y + 4, cs - 8, cs - 8, cs * 0.2); ctx.stroke(); }
  // стоящие половинки стыковок (уже удалены из ядра) — до момента стыковки
  for (const M of G.merges){
    if (now < M.tShow || now >= M.t0) continue;
    const st = M.active === M.aCell ? M.bCell : M.aCell, p = cellXY(st, g);
    drawPiece(ctx, st === M.aCell ? M.aCode : M.bCode, p.x, p.y, cs, 1, 1 + 0.05 * Math.sin((now - M.tShow) / 70));
  }
  // скольжение
  if (G.slide && now < G.slide.t1){
    // разгон (как по льду до удара), бледный шлейф позади, растяжение вдоль хода
    const S = G.slide, a = cellXY(S.from, g), b = cellXY(S.to, g), raw = (now - S.t0) / (S.t1 - S.t0);
    const pos = (r) => { r = Math.max(0, Math.min(1, r)); return r * 0.55 + r * r * 0.45; };
    for (let k = CFG.TRAIL_N; k >= 1; k--){
      const uk = pos(raw - k * 0.09); if (raw - k * 0.09 <= 0) continue;
      drawPiece(ctx, S.code, a.x + (b.x - a.x) * uk, a.y + (b.y - a.y) * uk, cs, 0.22 * (1 - k / (CFG.TRAIL_N + 1)), 0.92);
    }
    const u = pos(raw), st = 0.14 * Math.sin(Math.min(1, raw) * Math.PI * 0.9);
    drawPiece(ctx, S.code, a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u, cs, 1, 1, S.dir < 2 ? 1 + st : 1 - st * 0.5, S.dir < 2 ? 1 - st * 0.5 : 1 + st);
  }
  // падение раздачи
  if (G.drop && now < G.drop.t1 && now >= G.drop.t0){
    // летит из окошка «дальше» в свою клетку по дуге и садится с лёгким отскоком
    const D = G.drop, u = (now - D.t0) / (D.t1 - D.t0), p = cellXY(D.cell, g), t = nextTile(g);
    const v = easeIO(Math.min(1, u / 0.8)), k0 = t.s / cs;
    const x = t.x + (p.x - t.x) * v, y = t.y + (p.y - t.y) * v - Math.sin(v * Math.PI) * 50;
    const sc = u < 0.8 ? k0 + (1 - k0) * v : 1, q = u < 0.8 ? 0 : Math.sin((u - 0.8) / 0.2 * Math.PI) * 0.16;
    drawPiece(ctx, D.code, x, y, cs, 1, sc, 1 + q, 1 - q);
  }
  // стыковки: половинки сходятся → вспышка целого → полёт в копилку
  for (const M of G.merges){
    if (now < M.t0 || now >= M.flyEnd) continue;
    const a = cellXY(M.aCell, g), J = mergeJoint(M, g), edgeX = J.x, cy = J.y, R = cs * HALF_R;
    const u = (now - M.t0) / (M.t1 - M.t0);
    if (u < 0.45){
      const v = backOut(u / 0.45), gap = cs * 0.06 * (1 - v);
      ctx.save(); ctx.globalAlpha = 1 - v * 0.7; ctx.fillStyle = P.tile;
      if (M.vert) rr(ctx, a.x + cs * 0.06, a.y + cs * 0.06 + v * cs * 0.3, cs * 0.88, cs * 1.88 - v * cs * 0.6, cs * 0.2);
      else rr(ctx, a.x + cs * 0.06 + v * cs * 0.3, a.y + cs * 0.06, cs * 1.88 - v * cs * 0.6, cs * 0.88, cs * 0.2);
      ctx.fill(); ctx.restore();
      if (M.vert){ drawHalf(ctx, M.aCode, J.x, J.y - gap, R, a.x, a.y, cs, cs * 2); drawHalf(ctx, M.bCode, J.x, J.y + gap, R, a.x, a.y, cs, cs * 2); }
      else { drawHalf(ctx, M.aCode, J.x - gap, J.y, R, a.x, a.y, cs * 2, cs); drawHalf(ctx, M.bCode, J.x + gap, J.y, R, a.x, a.y, cs * 2, cs); }
    } else if (u < 1){
      const v = (u - 0.45) / 0.55, pulse = 1 + (0.35 + 0.05 * Math.min(4, M.combo)) * Math.sin(Math.min(1, v * 1.6) * Math.PI);
      drawBurst(ctx, edgeX, cy, R, M.color, v, Math.min(4, M.combo));
      ctx.save(); ctx.translate(edgeX, cy); ctx.rotate(Math.sin(v * Math.PI * 2) * 0.12 * (1 - v)); drawShape(ctx, M.color, 0, 0, R * pulse); ctx.restore();
    } else {
      const v = easeIO((now - M.t1) / (M.flyEnd - M.t1)), sp = targetXY(M.target, g);
      if (M.target.kind === 'none'){ ctx.save(); ctx.globalAlpha = 1 - v; drawShape(ctx, M.color, edgeX, cy - v * 40, R * (1 - v * 0.6)); ctx.restore(); continue; }
      const x = edgeX + (sp.x - edgeX) * v, y = cy + (sp.y - cy) * v - Math.sin(v * Math.PI) * 60;
      ctx.save(); ctx.globalAlpha = 0.3; for (let k = 1; k <= 3; k++){ const vk = easeIO((now - M.t1 - k * 30) / (M.flyEnd - M.t1)); if (vk <= 0) continue;
        drawShape(ctx, M.color, edgeX + (sp.x - edgeX) * vk, cy + (sp.y - cy) * vk - Math.sin(vk * Math.PI) * 60, (R + (sp.r - R) * vk) * (1 - k * 0.15)); }
      ctx.restore();
      ctx.save(); ctx.translate(x, y); ctx.rotate(v * Math.PI * 2); drawShape(ctx, M.color, 0, 0, R + (sp.r - R) * v); ctx.restore();
    }
  }
  for (const f of G.crateFly){                                  // ящик летит в фишку цели
    if (now < f.t0 || now >= f.t1) continue;
    const v = easeIO((now - f.t0) / (f.t1 - f.t0)), sp = chipXY('crate', g);
    const x = f.x + (sp.x - f.x) * v, y = f.y + (sp.y - f.y) * v - Math.sin(v * Math.PI) * 50, sz = cs * (0.9 - 0.55 * v);
    ctx.save(); ctx.translate(x, y); ctx.rotate(v * 5); drawCrate(ctx, -sz / 2, -sz / 2, sz); ctx.restore();
  }
  drawParticles(ctx, now);
  drawPraise(ctx, now);
  // рука-подсказка на первом уровне до первого хода
  if (s.li === 0 && s.moves === 0 && !G.drag){
    const i = s.grid.findIndex(c => c > 0 && sideOf(c) === 0);
    if (i >= 0){ const p = cellXY(i, g); drawHand(ctx, p.x + cs * 0.5, p.y + cs * 0.62, cs * 2.2, now); }
  }
  // журнал fx.end и финал — по состоянию в кадре, не по событию (урок «Стыковки»)
  if (G.fxOpen.length){ const keep = []; for (const f of G.fxOpen){ if (now >= f.t1) log('fx.end', f.name); else keep.push(f); } G.fxOpen = keep; }
  if (G.screen === 'game' && !G.ending && (isWin(s) || isLose(s)) && now >= G.fxUntil) G.ending = now + (isWin(s) ? 0 : CFG.END_DELAY_MS);
  if (G.ending && now >= G.ending) finishEnding();
  const tipTop = Math.round(g.tipY * scale) + 'px'; if (tipEl.style.top !== tipTop) tipEl.style.top = tipTop;
  if (toastUntil && now > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
}

// --- цикл: rAF + watchdog setInterval; безопасно, потому что время абсолютное (§4). Кадр под try/catch. ---
let lastFrame = 0, frameErrors = 0;
function safeRender(){ try { render(); } catch (e) { frameErrors++; if (frameErrors < 5) console.error(e); log('event', 'frame.error', e && e.message); } }
function frame(){ lastFrame = performance.now(); if (!G.paused) safeRender(); requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) safeRender(); }, 40);

// --- дебаг-хук (§6): состояние, любой экран, ходы, прогон времени, автоигра ---
const DIR_KEYS = { R: 0, L: 1, D: 2, U: 3, '→': 0, '←': 1, '↓': 2, '↑': 3 };
window.POLOVINKI = {
  G, CFG,
  state(){ const s = G.s; return s ? { level: s.li + 1, rows: gridRows(s), moves: s.moves, docks: s.docks, goal: s.goal, order: s.order, crates: s.crates, crateGoal: s.crateGoal, progress: goalProgress(s), every: s.every,
    next: s.next, par: G.par, undoLeft: G.undoLeft, win: isWin(s), lose: isLose(s), screen: G.screen, frameErrors } : { screen: G.screen }; },
  play(n){ startLevel(Math.max(1, n || 1) - 1); return this.state(); },
  move(cell, dir){ doMove(cell * 4 + (typeof dir === 'string' ? DIR_KEYS[dir] : dir)); return this.state(); },
  moves(){ return G.s ? legalMoves(G.s).map(m => ({ cell: m >> 2, dir: '→←↓↑'[m & 3], ...peekMove(G.s, m) })) : []; },
  undo(){ undo(); return this.state(); },
  goto(screen){ goto(screen); return G.screen; },
  solve(w){ return G.s ? (solve(G.s, w || CFG.SIM_BEAM) || []).map(m => ({ cell: m >> 2, dir: '→←↓↑'[m & 3] })) : null; },
  hint(){ const p = G.s && solve(G.s, CFG.PAR_BEAM); return p && p.length ? { cell: p[0] >> 2, dir: '→←↓↑'[p[0] & 3] } : null; },
  auto(delayMs, width){ const p = (G.s && solve(G.s, width || CFG.SIM_BEAM)) || []; p.forEach((m, k) => setTimeout(() => doMove(m), (delayMs || 450) * (k + 1))); return p.length; },
  drive(sec){                                   // ручной прогон игрового времени: rAF заморожен в скрытой вкладке
    const end = performance.now() + sec * 1000; let n = 0;
    while (performance.now() < end && n < 200000){ safeRender(); n++; }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },   // чит: открыть все уровни
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт ---
fit(); hud();
const startHash = location.hash.slice(1) === 'unlock' ? (setUnlockAll(true), 'menu') : location.hash.slice(1);
if (startHash === 'game') startLevel(G.save.level); else goto(startHash || 'menu');
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length);
</script>
</body>
