      <div class="row"><button ${canRevive ? '' : 'class="primary"'} data-act="retry">Ещё раз</button>${canUndo ? `<button data-act="undo">Отменить ход (${G.undoLeft})</button>` : ''}<button data-act="menu">Меню</button></div>`;
  }
  if (screen === 'offer'){
    const mag = G.offer === 'magnet';
    card.innerHTML = `<h2>${mag ? 'Магниты кончились' : 'Мётлы кончились'}</h2><p>${mag ? 'Магнит стыкует пару под открытый заказ, где бы половинки ни стояли.' : 'Метла сметает половинки из самого забитого ряда или столбца.'}</p>
      <p class="note">Посмотреть рекламу и получить +1? В прототипе рекламы нет — бустер выдаётся сразу.</p>
      <div class="row"><button class="primary" data-act="ad-yes">▶ Смотреть · +1</button><button data-act="ad-no">Не надо</button></div>`;
  }
}
// Заглушки монетизации: только журнал. name — offer | accept | decline | inter; what — точка (rv_revive, rv_magnet, rv_broom, inter_win).
function monet(name, what, info){ log('event', 'monet.' + name, what + (info ? ' ' + info : '')); }
$('card').addEventListener('click', (e) => {
  const el = e.target && e.target.closest ? e.target.closest('button') : null;
  const act = el && el.dataset.act; if (!act) return;
  Audio.init(); log('input', 'button', act);
  if (act === 'play') startLevel(G.save.level);
  else if (act === 'lvl'){ if (isOpen(+el.dataset.li)) startLevel(+el.dataset.li); else { toast('Сначала пройди уровень ' + (G.save.level + 1)); Audio.nope(); } }
  else if (act === 'unlock' || act === 'relock'){ setUnlockAll(act === 'unlock'); goto('menu'); }
  else if (act === 'wipe'){ G.save = { level: 0, muted: G.save.muted, best: {}, unlockAll: false, boost: { magnet: CFG.BOOST_START, broom: CFG.BOOST_START } }; save(); log('event', 'cheat', 'wipe'); hud(); goto('menu'); }
  else if (act === 'retry'){ if (G.screen === 'lose' && G.s && !G.s.dead && !G.revived) monet('decline', 'rv_revive'); startLevel(G.s ? G.s.li : G.save.level); }
  else if (act === 'next'){ if (G.s && G.s.li + 1 >= CFG.INTER_FROM) monet('inter', 'inter_win', 'after level=' + (G.s.li + 1)); startLevel(G.s ? G.s.li + 1 : G.save.level); }
  else if (act === 'revive'){ monet('accept', 'rv_revive'); doRevive(); }
  else if (act === 'ad-yes'){ monet('accept', 'rv_' + G.offer); G.save.boost[G.offer] = (G.save.boost[G.offer] || 0) + 1; save(); goto(G.s ? 'game' : 'menu'); hud(); toast(G.offer === 'magnet' ? '+1 магнит' : '+1 метла'); }
  else if (act === 'ad-no'){ monet('decline', 'rv_' + G.offer); goto(G.s ? 'game' : 'menu'); }
  else if (act === 'undo'){ goto('game'); undo(); }
  else if (act === 'help') goto('help');
  else if (act === 'back') goto(G.s ? 'game' : 'menu');
  else goto('menu');
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'game' && !G.s) startLevel(G.save.level); else if (h && h !== G.screen) goto(h); });

let toastUntil = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.remove('hide'); toastUntil = performance.now() + CFG.TOAST_MS; }

// Мягкая очистка (новый ход): обрываем то, что привязано к клеткам; уже вспыхнувшие стыковки, частицы
// и надписи доигрывают — быстрый игрок не теряет «щёлк». Полная (старт уровня, отмена) — всё.
function clearFx(hard){
  const now = performance.now();
  const keep = (f) => !hard && f.ref && now >= f.ref.t0;
  for (const f of G.fxOpen) if (!keep(f)) log('fx.end', f.name, 'cut');
  G.fxOpen = G.fxOpen.filter(keep);
  G.merges = hard ? [] : G.merges.filter(M => now >= M.t0);
  G.slide = null; G.drop = null; G.wiggle = null; G.land = null; G.hit = null; G.ghosts = []; G.sweep = null;
  if (hard){ G.parts = []; G.praise = []; G.shake = null; G.combo = 0; G.crateFly = []; G.trayFlash = 0; }
  G.fxUntil = G.fxOpen.reduce((m, f) => Math.max(m, f.t1), 0);
}
function startLevel(li){
  li = Math.max(0, li);
  G.s = createState(li); G.s0 = G.s; G.hist = []; G.undoLeft = CFG.UNDO_PER_LEVEL; G.par = null;
  G.ending = 0; G.drag = null; G.winT = 0; G.revived = false; snapView(); clearFx(true); G.levelT0 = performance.now(); G.lastInputT = G.levelT0; G.hintFor = null;
  Audio.intro(); log('fx.start', 'intro'); G.fxOpen.push({ name: 'intro', t1: G.levelT0 + CFG.INTRO_MS + CFG.INTRO_STEP * 12 });
  G.cursor = G.s.grid.findIndex(c => c > 0);
  const spec = levelSpec(li);
  log('event', 'level.start', 'level=' + (li + 1) + ' goal=' + goalProgress(G.s).total + ' every=' + G.s.every + ' cap=' + G.s.cap + (G.s.hard ? ' hard' : ''));
  goto('game'); hud(); fit();
}                                                  // par для звёзд считается на победе (finishEnding): на длинных уровнях луч солвера — десятки мс, на старте это рывок
function hud(){
  $('hud-level').innerHTML = 'Уровень ' + (G.s ? G.s.li + 1 : G.save.level + 1) + (G.s && G.s.hard ? '<i>сложный</i>' : '');
  if (!G.save.boost) G.save.boost = { magnet: CFG.BOOST_START, broom: CFG.BOOST_START };
  for (const k of ['magnet', 'broom']){ const n = G.save.boost[k] || 0, el = $('n-' + k); el.textContent = n > 0 ? n : '+1 ▶'; el.className = n > 0 ? '' : 'ad'; }
  $('boosts').classList.toggle('hide', !(G.s && G.s.every > 0 && G.s.li + 1 >= CFG.BOOST_FROM));
  $('boosts').classList.toggle('pulse', !!G.s && G.s.li + 1 === CFG.BOOST_FROM && G.s.moves === 0);
  $('btn-mute').textContent = G.save.muted ? '🔇' : '🔊';
  $('btn-undo').textContent = 'Отмена (' + G.undoLeft + ')';
  $('btn-undo').disabled = !G.s || !G.hist.length || G.undoLeft <= 0;
}

// --- ход в оболочке: ядро считает, оболочка раскладывает эффекты по абсолютному времени ---
function doMove(m){
  if (!G.s || G.screen !== 'game' || G.ending || isWin(G.s) || isLose(G.s)) return false;
  const i = m >> 2, d = m & 3;
  if (G.s.grid[i] <= 0) return false;
  const next = applyMove(G.s, m);
  if (!next){ bump(i, d); return false; }
  snapView(); clearFx(false);
  G.lastInputT = performance.now();
  G.combo = next.last.partner >= 0 ? G.combo + 1 : 0;
  G.hist.push(G.s); G.s = next;
  log('input', 'swipe', 'cell=' + i + ' dir=' + '→←↓↑'[d]);
  animateMove(next);
  hud();
  if (isWin(G.s)) log('event', 'level.win', 'moves=' + G.s.moves);
  else if (isLose(G.s)) log('event', 'level.lose', 'moves=' + G.s.moves + ' done=' + goalProgress(G.s).done + ' why=' + (G.s.trayOver ? 'tray' : G.s.dead ? 'timer' : 'board'));
  return true;
}
function fxOpen(name, t1, info, ref){ G.fxOpen.push({ name, t1, ref }); log('fx.start', name, info); G.fxUntil = Math.max(G.fxUntil, t1); }
const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
function shakeAt(t0, amp){ if (REDUCED) return; if (!G.shake || G.shake.t1 < t0 || G.shake.amp < amp) G.shake = { t0, t1: t0 + CFG.SHAKE_MS / G.timeScale, amp }; }
function praise(text, x, y, t0, color, size){ G.praise.push({ text, x: Math.max(70, Math.min(W - 70, x)), y, t0, t1: t0 + CFG.PRAISE_MS / G.timeScale, color, size: size || 26 }); log('fx.start', 'praise', text); }
const PRAISE = ['Щёлк!', 'Отлично!', 'Супер!', 'Вау!', 'Невероятно!'];
// Частицы: dot — кружок, rect — вертящееся конфетти, star — искра, dust — пыль. Всё от сида, без Math.random.
function burst(n, x, y, t0, opts){
  const rnd = mulberry32(((t0 * 7) | 0) + n * 131 + (x | 0));
  for (let k = 0; k < n; k++){
    const a = opts.angle !== undefined ? opts.angle + (rnd() - 0.5) * (opts.spread || 1) : rnd() * Math.PI * 2;
    const v = (opts.v || 0.2) * (0.5 + rnd());
    G.parts.push({ type: opts.type || 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + (opts.vy || 0), t0, life: (opts.life || 600) * (0.7 + rnd() * 0.6),
      color: opts.colors ? opts.colors[k % opts.colors.length] : opts.color, r: (opts.r || 3) * (0.6 + rnd() * 0.8), rot: rnd() * 6.28, spin: (rnd() - 0.5) * 0.03, ph: rnd() * 6.28, g: opts.g === undefined ? 0.0004 : opts.g });
  }
}
function animateMove(n){
  const L = n.last, T = performance.now(), ts = G.timeScale;
  const slideMs = Math.max(CFG.SLIDE_MIN_MS, L.dist * CFG.SLIDE_MS_CELL) / ts;
  const t1 = T + slideMs;
  G.slide = { code: L.code, from: L.from, to: L.to, dir: L.dir, t0: T, t1 };
  fxOpen('slide', t1, 'cells=' + L.dist);
  Audio.swipe(slideMs); buzz(8);
  const g = geo(), cs = g.cell, dx = DIRS[L.dir][0], dy = DIRS[L.dir][1];
  if (L.partner < 0){
    // остановка: плитка сплющивается, у переднего края — пыль; то, во что упёрлись, вздрагивает
    G.land = { cell: L.to, dir: L.dir, t0: t1, t1: t1 + CFG.LAND_MS / ts };
    const x = L.to % n.w, y = (L.to - x) / n.w, bx = x + dx, by = y + dy, p = cellXY(L.to, g);
    const ex = p.x + cs / 2 + dx * cs * 0.45, ey = p.y + cs / 2 + dy * cs * 0.45;
    burst(7, ex, ey, t1, { type: 'dust', color: -1, angle: Math.atan2(-dy, -dx), spread: 2.6, v: 0.09, life: 380, r: 4, g: 0 });
    if (bx >= 0 && by >= 0 && bx < n.w && by < n.h) G.hit = { cell: by * n.w + bx, dir: L.dir, t0: t1, t1: t1 + CFG.HIT_MS / ts };
    else if (L.dist >= 2) shakeAt(t1, 2);
  }
  const chain = (by) => L.ev.filter(e => e.by === by && (e.type === 'done' || e.type === 'order' || e.type === 'untray'));
  let tNext = t1, tEnd = t1;
  if (L.partner >= 0){
    tEnd = addMerge({ active: L.to, partner: L.partner, code: L.code, partnerCode: L.partnerCode, color: L.color, target: L.target, tShow: T, t0: t1, combo: G.combo, kind: 'move', evs: chain('move') });
    Audio.click(n.served, slideMs / 1000, G.combo); buzz([10, 30, 14]);
    tNext = t1 + CFG.DOCK_MS * 0.55 / ts;
  } else Audio.thunk(slideMs / 1000, L.dist);
  if (L.spawn){
    const S = L.spawn, d1 = tNext + CFG.SPAWN_MS / ts;
    G.drop = { code: S.code, cell: S.cell, t0: tNext, t1: d1 };
    fxOpen('drop', d1, 'cell=' + S.cell + (S.cell !== S.planned ? ' moved' : ''));
    Audio.plop((tNext - T) / 1000);
    if (S.partner >= 0){
      tEnd = Math.max(tEnd, addMerge({ active: S.cell, partner: S.partner, code: S.code, partnerCode: S.partnerCode, color: S.color, target: S.target, tShow: T, t0: d1, combo: 1, kind: 'gift', evs: chain('spawn') }));
      Audio.click(n.served, (d1 - T) / 1000, 1);
    } else { const p = cellXY(S.cell, geo()); burst(8, p.x + geo().cell / 2, p.y + geo().cell * 0.9, d1, { type: 'dust', color: -1, angle: -Math.PI / 2, spread: 3, v: 0.07, life: 340, r: 3.5, g: 0 }); }
  }
  animateEvents(L, T, t1);
  if (isWin(n)) celebrate(Math.max(tEnd, G.merges.reduce((m, M) => Math.max(m, M.flyEnd), t1), G.crateFly.reduce((m, f) => Math.max(m, f.t1), 0)));
  else if (isLose(n) && !n.trayOver) shakeAt(Math.max(G.fxUntil, t1), 7);
}
// Победа: когда последняя фигура долетела в копилку — «Готово!», дождь конфетти, фанфара; карточка — после паузы.
function celebrate(t){
  const g = geo(), hold = CFG.WIN_HOLD_MS / G.timeScale;
  G.winT = t;
  praise('Готово!', W / 2, g.oy + g.bh * 0.45, t, P.accent, 40);
  const cols = [0, 1, 2, 3, 4, -2];
  for (let k = 0; k < (REDUCED ? 20 : CFG.CONFETTI_WIN); k++){
    const r = mulberry32(900 + k);
    G.parts.push({ type: 'rect', x: r() * W, y: -10 - r() * 120, vx: (r() - 0.5) * 0.05, vy: 0.12 + r() * 0.16, t0: t + r() * 250, life: 2600,
      color: cols[k % cols.length], r: 4 + r() * 3, rot: r() * 6.28, spin: (r() - 0.5) * 0.02, ph: r() * 6.28, g: 0.00005, sway: 10 });
  }
  shakeAt(t, 5);
  Audio.fanfare((t - performance.now()) / 1000);
  fxOpen('celebrate', t + hold, 'confetti=' + CFG.CONFETTI_WIN);
}
// Стыковка: active — клетка пришедшей половинки, partner — стоявшей. До t0 стоящую рисуем как плитку.
// o = { active, partner, code, partnerCode, color, target (из ядра), tShow, t0, combo, kind: move|gift|magnet, evs }.
// Магнит: обе половинки сами летят друг к другу (tShow…t0), дальше — как обычная стыковка. Возвращает время конца цепочки событий.
function addMerge(o){
  const ts = G.timeScale, s = G.s, magnet = o.kind === 'magnet', col = o.color;
  const t1 = o.t0 + CFG.DOCK_MS * (magnet ? 0.55 : 1) / ts, flyEnd = t1 + CFG.FLY_MS / ts;
  const first = (sideOf(o.code) & 1) === 0;                    // пришла левая/верхняя
  const aCell = first ? o.active : o.partner, bCell = first ? o.partner : o.active, vert = isVert(o.code);
  const target = o.target.kind === 'order' ? { ...o.target, n: s.queue[o.target.id].length } : o.target;
  const M = { aCell, bCell, aCode: first ? o.code : o.partnerCode, bCode: first ? o.partnerCode : o.code, vert, active: o.active, color: col, magnet,
    tShow: o.tShow, t0: o.t0, t1, flyEnd, target, combo: o.combo || 1 };
  G.merges.push(M);
  fxOpen('dock', flyEnd, SHAPES[col] + ' target=' + target.kind + ' combo=' + M.combo, M);
  // момент «щёлк»: конфетти и искры цвета фигуры, надпись, встряска
  const g = geo(), j = mergeJoint(M, g), cx = j.x, cy = j.y, tp = o.t0 + CFG.DOCK_MS * (magnet ? 0.08 : 0.45) / ts;
  const power = Math.min(4, M.combo);
  burst(10 + power * 3, cx, cy, tp, { type: 'dot', colors: [col, col, -2], v: 0.2 + power * 0.03, vy: -0.1, life: 650, r: 3.2 });
  burst(CFG.CONFETTI_DOCK + power * 4, cx, cy, tp, { type: 'rect', colors: [col, -2, 2, col], v: 0.24 + power * 0.03, vy: -0.16, life: 900, r: 4, g: 0.0005 });
  burst(5 + power, cx, cy, tp, { type: 'star', color: -2, v: 0.16, life: 520, r: 7, g: 0 });
  const rainbow = colorOf(o.code) === RAINBOW || colorOf(o.partnerCode) === RAINBOW;
  const toTray = target.kind === 'tray', over = target.kind === 'over';
  const text = magnet ? 'Магнит!' : o.kind === 'gift' ? 'Подарок!' : rainbow && M.combo <= 1 ? 'Радуга!' : M.combo <= 1 ? PRAISE[0] : PRAISE[Math.min(M.combo - 1, PRAISE.length - 1)] + ' ×' + M.combo;
  if (!over && !toTray) praise(text, cx, cy - g.cell * 0.65, tp, P.colors[col], 24 + power * 3);   // в лоток и «не влезла» — без слов: это видно по полёту и по лотку
  shakeAt(tp, Math.min(CFG.SHAKE_MAX, CFG.SHAKE_PX + (M.combo - 1) * 1.5));
  // фигура долетела до заказа или лотка: звон и искры
  if (target.kind === 'order' || toTray){
    const sp = targetXY(target, g);
    burst(toTray ? 5 : 9, sp.x, sp.y, flyEnd, { type: 'star', color: 2, v: 0.12, life: 420, r: 5, g: 0 });
    burst(8, sp.x, sp.y, flyEnd, { type: 'dot', color: col, v: 0.1, life: 360, r: 2.5, g: 0 });
    if (!toTray) Audio.coin((flyEnd - performance.now()) / 1000);
  }
  return scheduleDelivery(target, col, flyEnd, o.evs || []);
}
// Точка стыка пары: середина общего ребра клеток; у магнита — середина между двумя клетками.
function mergeJoint(M, g){
  const a = cellXY(M.aCell, g);
  if (M.magnet){ const b = cellXY(M.bCell, g); return { x: (a.x + b.x) / 2 + g.cell / 2, y: (a.y + b.y) / 2 + g.cell / 2 }; }
  return M.vert ? { x: a.x + g.cell / 2, y: a.y + g.cell } : { x: a.x + g.cell, y: a.y + g.cell / 2 };
}

// --- заказы и лоток на экране ---
// Вид (G.view) отстаёт от ядра ровно на анимации: фигура ещё летит — слот заказа ещё пуст. Изменения вида лежат в G.vq
// с абсолютным временем; новый ход сначала догоняет вид до ядра (snapView), потом раскладывает свои события.
function viewFromState(s){
  return { cards: s.active.map(o => o && { id: o.id, c: o.c, f: o.f.slice(), pop: o.c.map(() => 0), born: 0, done: 0 }),
    tray: s.tray.map(c => ({ color: c, t: 0 })), served: s.served, oi: s.oi, crates: s.crates, landT: 0, crateT: 0 };
}
function snapView(){ G.vq = []; G.flies = []; G.view = G.s ? viewFromState(G.s) : null; }
function vAt(t, fn){ G.vq.push({ t, fn }); }
function runView(now){
  if (!G.vq.length) return;
  G.vq.sort((a, b) => a.t - b.t);
  while (G.vq.length && G.vq[0].t <= now) G.vq.shift().fn();
}
function fillSlot(T, t){ const c = G.view.cards[T.slot]; if (c && c.id === T.id){ c.f[T.k] = true; c.pop[T.k] = t; } G.view.served++; G.view.landT = t; }
// Что происходит после того, как фигура долетела (tL): слот заказа или лоток, затем цепочка ядра —
// заказ закрылся, пришёл новый, лоток отдал подошедшее. Возвращает время конца цепочки.
function scheduleDelivery(T, color, tL, evs){
  const g = geo(), ts = G.timeScale, s = G.s, delay = (t) => (t - performance.now()) / 1000;
  let tc = tL;
  if (T.kind === 'order') vAt(tL, () => fillSlot(T, tL));
  else if (T.kind === 'tray'){ vAt(tL, () => { G.view.tray.push({ color, t: tL }); }); Audio.tray(delay(tL)); }
  else if (T.kind === 'over'){ shakeAt(tL, 8); Audio.over(delay(tL)); G.trayFlash = tL; }
  for (const e of evs){
    if (e.type === 'done'){
      tc += 90 / ts; const t = tc, r = cardRect(e.slot, g), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      vAt(t, () => { const c = G.view.cards[e.slot]; if (c && c.id === e.id) c.done = t; });
      burst(12, cx, cy, t, { type: 'star', color: 2, v: 0.16, life: 520, r: 6, g: 0 });
      burst(12, cx, cy, t, { type: 'rect', colors: [3, -2, 2], v: 0.2, vy: -0.1, life: 700, r: 3.5, g: 0.0005 });
      Audio.order(delay(t));
      tc += CFG.ORDER_DONE_MS / ts; const t2 = tc;
      vAt(t2, () => { const c = G.view.cards[e.slot]; if (c && c.id === e.id) G.view.cards[e.slot] = null; });
    } else if (e.type === 'order'){
      const t = tc, id = e.id;
      vAt(t, () => { const c = s.queue[id]; G.view.cards[e.slot] = { id, c, f: c.map(() => false), pop: c.map(() => 0), born: t, done: 0 }; G.view.oi = Math.max(G.view.oi, id + 1); });
      tc += CFG.ORDER_IN_MS / ts;
    } else if (e.type === 'untray'){
      const t0 = tc, t1 = tc + CFG.UNTRAY_MS / ts, T2 = { kind: 'order', slot: e.slot, k: e.k, id: e.id, n: s.queue[e.id].length };
      vAt(t0, () => { const i = Math.min(e.from, G.view.tray.length - 1); if (i >= 0) G.view.tray.splice(i, 1); G.flies.push({ color: e.color, from: e.from, T: T2, t0, t1 }); });
      vAt(t1, () => fillSlot(T2, t1));
      Audio.coin(delay(t1));
      tc = t1;
    }
  }
  if (tc > tL) fxOpen('orders', tc, 'events=' + evs.length);
  return tc;
}

// --- бустеры и «Продолжить» ---
function useBoost(kind){
  if (!G.s || G.screen !== 'game' || G.ending || isWin(G.s) || isLose(G.s)) return false;
  if ((G.save.boost[kind] || 0) <= 0){ G.offer = kind; monet('offer', 'rv_' + kind, 'level=' + (G.s.li + 1)); goto('offer'); return false; }
  const n = kind === 'magnet' ? useMagnet(G.s) : useBroom(G.s);
  if (!n){ toast(kind === 'magnet' ? 'Нет пары под открытый заказ' : 'На поле нечего сметать'); Audio.nope(); log('event', 'boost.none', kind); return false; }
  G.save.boost[kind]--; save();
  snapView(); clearFx(false);
  const T = performance.now(); G.lastInputT = T; G.hist = []; G.combo = 0; G.s = n;   // через бустер отмена не шагает
  log('event', 'boost.use', kind + ' left=' + G.save.boost[kind]);
  let tEnd = T;
  if (kind === 'magnet'){ tEnd = animateMagnet(n.last, T, n.last.ev); animateEvents(n.last, T, T + CFG.MAGNET_MS / G.timeScale); }
  else tEnd = animateBroom(n.last, T);
  hud();
  if (isWin(n)){ log('event', 'level.win', 'moves=' + n.moves + ' by=' + kind); celebrate(Math.max(tEnd, G.merges.reduce((m, M) => Math.max(m, M.flyEnd), T))); }
  return true;
}
// Магнит: две половинки летят друг к другу и стыкуются посередине. L = { a, b, aCode, bCode, color, target }.
function animateMagnet(L, T, evs){
  const t0 = T + CFG.MAGNET_MS / G.timeScale;
  Audio.magnet(); buzz([8, 40, 16]);
  const chain = (evs || []).filter(e => e.type === 'done' || e.type === 'order' || e.type === 'untray');
  return addMerge({ active: L.a, partner: L.b, code: L.aCode, partnerCode: L.bCode, color: L.color, target: L.target, tShow: T, t0, combo: 1, kind: 'magnet', evs: chain });
}
// Метла: полоса идёт по ряду или столбцу, половинки исчезают по мере прохода. L = { row, col, gone: [{ cell, code }] }.
function animateBroom(L, T){
  const g = geo(), cs = g.cell, ms = CFG.BROOM_MS / G.timeScale, t1 = T + ms, s = G.s;
  G.sweep = { row: L.row, col: L.col, t0: T, t1 };
  for (const q of L.gone){
    const x = q.cell % s.w, y = (q.cell - x) / s.w, frac = L.row >= 0 ? (x + 0.5) / s.w : (y + 0.5) / s.h, until = T + ms * frac, p = cellXY(q.cell, g);
    G.ghosts.push({ cell: q.cell, kind: 'piece', code: q.code, until });
    burst(9, p.x + cs / 2, p.y + cs / 2, until, { type: 'dust', color: -1, v: 0.12, life: 460, r: 5, g: 0 });
    burst(6, p.x + cs / 2, p.y + cs / 2, until, { type: 'rect', colors: [colorOf(q.code), -2], v: 0.18, vy: -0.08, life: 600, r: 3.5, g: 0.0005 });
  }
  const mid = L.row >= 0 ? { x: g.ox + g.bw / 2, y: g.oy + (L.row + 0.5) * cs } : { x: g.ox + (L.col + 0.5) * cs, y: g.oy + g.bh / 2 };
  praise('Чисто!', mid.x, mid.y - cs * 0.6, t1, P.accent, 26);
  Audio.broom(); buzz(30); shakeAt(T, 3);
  fxOpen('broom', t1, 'cells=' + L.gone.length);
  return t1;
}
// «Продолжить» после проигрыша: лоток пустеет, магнит собирает пары под заказ, метла сметает ряд. Заглушка рекламы — без ролика.
function doRevive(){
  const n = G.s && revive(G.s); if (!n) return false;
  G.revived = true; G.hist = []; G.ending = 0;
  snapView(); clearFx(true);
  const T = performance.now(), ts = G.timeScale, g = geo(), L = n.last; G.lastInputT = T;
  G.view.tray.forEach((it, k) => { const p = trayXY(k, g); burst(8, p.x, p.y, T, { type: 'dot', colors: [it.color, -2], v: 0.14, life: 420, r: 3 }); });
  G.view.tray = [];
  G.s = n; goto('game');
  log('event', 'revive', 'pairs=' + L.pairs.length + ' swept=' + L.gone.length + ' tray=' + L.cleared.length);
  let t = T + 120 / ts;
  for (const q of L.pairs){ addMerge({ active: q.a, partner: q.b, code: q.aCode, partnerCode: q.bCode, color: q.color, target: q.target, tShow: t, t0: t + CFG.MAGNET_MS / ts, combo: 1, kind: 'magnet', evs: [] }); t += CFG.MAGNET_MS * 0.9 / ts; }
  const tPairs = G.merges.reduce((m, M) => Math.max(m, M.flyEnd), t);
  if (L.gone.length){ const t0 = L.pairs.length ? t + 80 / ts : t; for (const q of L.gone) G.ghosts.push({ cell: q.cell, kind: 'piece', code: q.code, until: t0 }); vAt(t0, () => animateBroom(L, t0)); G.fxUntil = Math.max(G.fxUntil, t0 + CFG.BROOM_MS / ts); }
  vAt(tPairs + 30, () => { G.view = viewFromState(n); });           // пары могли закрыть заказы — к концу вид совпадает с ядром
  praise('Второй шанс!', W / 2, g.oy + g.bh * 0.42, T, P.accent, 34);
  Audio.revive(); buzz([20, 40, 20]);
  fxOpen('revive', tPairs + 30, 'pairs=' + L.pairs.length);
  hud();
  if (isWin(n)){ log('event', 'level.win', 'moves=' + n.moves + ' by=revive'); celebrate(tPairs + 60); }
  return true;
}
// События хода: ящик ломается и летит в цель, цепь рассыпается, таймер каменеет. До момента события клетка показывает прежнее.
function animateEvents(L, T, t1){
  const g = geo(), cs = g.cell, ts = G.timeScale;
  const firstMerge = G.merges.filter(M => M.tShow === T).reduce((m, M) => Math.min(m, M.t0), Infinity);
  const tp = (firstMerge === Infinity ? t1 : firstMerge) + CFG.DOCK_MS * 0.45 / ts;
  for (const e of L.ev){
    if (e.cell === undefined) continue;                              // события заказов и лотка раскладывает scheduleDelivery
    const p = cellXY(e.cell, g), cx = p.x + cs / 2, cy = p.y + cs / 2;
    if (e.type === 'crate'){
      G.ghosts.push({ cell: e.cell, kind: 'crate', until: tp });
      burst(14, cx, cy, tp, { type: 'rect', colors: [-3, -3, -5], v: 0.22, vy: -0.12, life: 700, r: 4.5, g: 0.0006 });
      burst(8, cx, cy, tp, { type: 'dust', color: -1, v: 0.08, life: 420, r: 5, g: 0 });
      if (G.s.crateGoal){ const f = { x: cx, y: cy, t0: tp, t1: tp + CFG.FLY_MS / ts }; G.crateFly.push(f); vAt(f.t1, () => { G.view.crates++; G.view.crateT = f.t1; }); fxOpen('crate', f.t1, 'cell=' + e.cell); }
      praise('Трах!', cx, cy + cs * 0.55, tp, P.wood, 22); shakeAt(tp, 5);
      Audio.crack((tp - performance.now()) / 1000);
    } else if (e.type === 'chain'){
      G.ghosts.push({ cell: e.cell, kind: 'chain', until: tp });
      burst(12, cx, cy, tp, { type: 'rect', color: -4, v: 0.2, vy: -0.1, life: 600, r: 3, g: 0.0006 });
      praise('Свобода!', cx, cy + cs * 0.55, tp, P.steel, 20);
      Audio.clink((tp - performance.now()) / 1000);
      fxOpen('chain', tp + 200, 'cell=' + e.cell);
    } else if (e.type === 'stone'){
      G.ghosts.push({ cell: e.cell, kind: 'stone', code: e.code, until: t1 });
      burst(12, cx, cy, t1, { type: 'dust', color: -4, v: 0.1, life: 520, r: 5, g: 0 });
      praise('Окаменела!', cx, cy + cs * 0.55, t1, P.muted, 20); shakeAt(t1, 4);
      Audio.petrify((t1 - performance.now()) / 1000);
      fxOpen('petrify', t1 + 300, 'cell=' + e.cell);
    }
  }
}function bump(cell, dir){
  const T = performance.now();
  G.wiggle = { cell, dir, t0: T, t1: T + 180 };
  Audio.nope(); log('input', 'bump', 'cell=' + cell + ' dir=' + (dir < 0 ? 'tap' : '→←↓↑'[dir]));
}
function undo(){
  if (!G.s || !G.hist.length || G.undoLeft <= 0) return;
  if (G.screen !== 'game') goto('game');
  clearFx(true); G.ending = 0; G.lastInputT = performance.now();
  G.s = G.hist.pop(); G.undoLeft--; snapView();
  Audio.undo(); log('input', 'undo', 'left=' + G.undoLeft); hud();
}
function finishEnding(){
  G.ending = 0;
  if (isWin(G.s)){
    if (G.par == null){ const p = solve(G.s0, CFG.PAR_BEAM); G.par = p ? p.length : null; }
    const li = G.s.li, stars = starsFor(G.s, G.par);
    G.save.best[li] = Math.max(G.save.best[li] || 0, stars);
    G.save.level = Math.max(G.save.level, li + 1); save();
    Audio.win(); buzz([20, 40, 20]);
    for (let i = 0; i < stars; i++) Audio.star(i, 0.12 + i * 0.22 + 0.25);
    log('event', 'reward', 'stars=' + stars + ' moves=' + G.s.moves + ' par=' + G.par);
    goto('win', { stars, text: 'Заказов ' + G.s.queue.length + ' · ходов ' + G.s.moves + (G.par != null ? ' · лучшее, что нашёл бот, — ' + G.par : '') });
  } else { Audio.lose(); buzz(120); goto('lose'); }
}

// --- ввод: Pointer Events, порог свайпа, pointercancel = pointerup (§3) ---
const cv = $('cv'), ctx = cv.getContext('2d');
const VW = 400;                                    // виртуальная ширина; логика и раскладка в виртуальных юнитах (§2)
let scale = 1, W = VW, H = 600, DPR = 1;
function toVirtual(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
// Раскладка сверху вниз: открытые заказы и маленькая карточка следующего, под ними лоток, ниже поле. Группа по центру с уклоном вверх.
const ORD_H = 62, ORD_GAP = 8, ORD_MAX_W = 160, NEXT_W = 66;         // карточки заказов: высота, зазор, предел ширины; ширина карточки «следующий»
const ZONE_GAP = 9, TRAY_H = 46, TRAY_S = 34, TRAY_STEP = 40, TRAY_PAD = 8;   // лоток: отступ от заказов, высота, место, шаг мест, поля
const TOP_GAP = 16, BOTTOM_PAD = 18;                                  // зазор между лотком и полем; поле под рамкой
function geo(){
  const s = G.s, avail = H - 8, head = ORD_H + ZONE_GAP + TRAY_H + TOP_GAP;
  const cell = Math.min((W - 24) / s.w, (avail - head - BOTTOM_PAD) / s.h, 80);
  const bw = cell * s.w, bh = cell * s.h, group = head + bh + BOTTOM_PAD;
  const top = 6 + Math.max(0, (avail - group) * 0.4), ox = (W - bw) / 2;
  const px = 10, pw = W - 2 * px;                                     // заказы и лоток — во всю ширину кадра, даже когда поле на низком экране сужается
  return { cell, ox, oy: top + head, bw, bh, py: top, px, pw, trayY: top + ORD_H + ZONE_GAP };
}
function cellXY(i, g){ const x = i % G.s.w; return { x: g.ox + x * g.cell, y: g.oy + (i - x) / G.s.w * g.cell }; }
function cellAt(p){
  if (!G.s) return -1;
  const g = geo(), x = Math.floor((p.x - g.ox) / g.cell), y = Math.floor((p.y - g.oy) / g.cell);
  return x < 0 || y < 0 || x >= G.s.w || y >= G.s.h ? -1 : y * G.s.w + x;
}
cv.addEventListener('pointerdown', (e) => {
  Audio.init();
  if (!G.s || G.screen !== 'game' || G.drag) return;
  const i = cellAt(toVirtual(e));
  if (i < 0 || G.s.grid[i] <= 0) return;
  G.drag = { cell: i, sx: e.clientX, sy: e.clientY, id: e.pointerId, dir: -1, len: 0 }; G.kbd = false; G.lastInputT = performance.now();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', (e) => {
  const D = G.drag; if (!D || e.pointerId !== D.id) return;
  const dx = e.clientX - D.sx, dy = e.clientY - D.sy;
  D.len = Math.hypot(dx, dy);
  D.dir = Math.hypot(dx, dy) < CFG.SWIPE_PX ? -1 : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 1) : (dy > 0 ? 2 : 3);
});
function onUp(e){
  const D = G.drag; if (!D || e.pointerId !== D.id) return;
  G.drag = null;
  if (D.dir < 0){ bump(D.cell, -1); return; }      // тап — плитка вздрагивает, хода нет
  doMove(D.cell * 4 + D.dir);
}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
document.addEventListener('keydown', (e) => {          // дубли на клавиатуру для отладки (§3): WASD — курсор, стрелки — свайп
  if (!G.s) return;
  G.lastInputT = performance.now();
  const w = G.s.w, N = G.s.grid.length, c = G.cursor;
  const arrows = { ArrowRight: 0, ArrowLeft: 1, ArrowDown: 2, ArrowUp: 3 }, cur = { d: 1, a: -1, s: w, w: -w };
  if (e.key in arrows){ e.preventDefault(); G.kbd = true; if (doMove(c * 4 + arrows[e.key]) && G.s.grid[G.s.last.to] > 0) G.cursor = G.s.last.to; }
  else if (e.key in cur){ G.kbd = true; G.cursor = Math.max(0, Math.min(N - 1, c + cur[e.key])); }
  else if (e.key === 'z' || e.key === 'u') undo();
  else if (e.key === 'q') useBoost('magnet');
  else if (e.key === 'e') useBoost('broom');
  else if (e.key === 'r') startLevel(G.s.li);
  else if (e.key === 'm') goto('menu');
});
$('btn-undo').onclick = () => { log('input', 'button', 'undo'); undo(); };
$('btn-reset').onclick = () => { log('input', 'button', 'reset'); startLevel(G.s ? G.s.li : G.save.level); };
$('btn-menu').onclick = () => { log('input', 'button', 'menu'); goto('menu'); };
$('btn-magnet').onclick = () => { Audio.init(); log('input', 'button', 'magnet'); useBoost('magnet'); };
$('btn-broom').onclick = () => { Audio.init(); log('input', 'button', 'broom'); useBoost('broom'); };
$('btn-mute').onclick = () => { G.save.muted = !G.save.muted; save(); hud(); log('input', 'button', 'mute=' + G.save.muted); };

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
function fit(){
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  scale = r.width / VW; W = VW; H = r.height / scale;
  const cw = Math.round(r.width * DPR), ch = Math.round(r.height * DPR);
  if (cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; }
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; log('event', G.paused ? 'pause' : 'resume'); });

// --- рисование: именованные функции, цвета из CSS-переменных (§9, §11) ---
let P = {};
function readPalette(){
  const cs = getComputedStyle(document.documentElement), v = (n) => cs.getPropertyValue(n).trim();
  P = { board: v('--board'), slot: v('--slot'), tile: v('--tile'), shadow: v('--tile-shadow'), stone: v('--stone'), stoneDark: v('--stone-dark'),

// Геометрия заказов и лотка: карточка заказа a из show, место k из n в карточке, карточка «следующий заказ», лоток и место k в нём.
function cardRect(a, g){ const n = G.s.show, room = g.pw - NEXT_W - ORD_GAP, w = Math.min(ORD_MAX_W, (room - ORD_GAP * (n - 1)) / n); return { x: g.px + a * (w + ORD_GAP), y: g.py, w, h: ORD_H }; }
function orderSlotXY(a, k, n, g){ const r = cardRect(a, g), step = Math.min(42, (r.w - 14) / n), x0 = r.x + r.w / 2 - step * (n - 1) / 2; return { x: x0 + step * k, y: r.y + r.h / 2, r: Math.min(17, step * 0.42) }; }
function nextRect(g){ const last = cardRect(G.s.show - 1, g); return { x: last.x + last.w + ORD_GAP, y: g.py + 9, w: NEXT_W, h: ORD_H - 18 }; }   // вплотную за последней открытой карточкой: очередь читается слева направо
function trayRect(g){ return { x: g.px, y: g.trayY, w: TRAY_PAD * 2 + TRAY_STEP * (G.s.cap - 1) + TRAY_S, h: TRAY_H }; }
function trayXY(k, g){ return { x: g.px + TRAY_PAD + TRAY_S / 2 + TRAY_STEP * k, y: g.trayY + TRAY_H / 2, r: TRAY_S / 2 - 2 }; }
function crateChipXY(g){ return { x: g.px + g.pw - 64, y: g.trayY + TRAY_H / 2, r: 13 }; }
// Куда летит собранная фигура (target из ядра): место в заказе, место в лотке, «не влезла» — за край лотка, «мимо» — вверх.
function targetXY(T, g){
  if (T.kind === 'order') return orderSlotXY(T.slot, T.k, T.n, g);
  if (T.kind === 'tray') return trayXY(Math.min(T.k, G.s.cap - 1), g);
  if (T.kind === 'over') return trayXY(G.s.cap, g);
  return { x: W / 2, y: g.py - 30, r: 4 };
}
// Фишка: целая фигура на белом кружке. Так фигура выглядит и в заказе, и в лотке — на цветном фоне зоны её цвет не теряется.
function drawChip(c, col, x, y, r, k){
  k = k || 1;
  c.fillStyle = P.chipShadow; c.beginPath(); c.arc(x, y + 2, r * k, 0, Math.PI * 2); c.fill();
  c.fillStyle = P.chip; c.beginPath(); c.arc(x, y, r * k, 0, Math.PI * 2); c.fill();
  drawShape(c, col, x, y, r * 0.7 * k);
}
// Галочка «место закрыто»: зелёный кружок с белой галкой.
function drawCheckBadge(c, x, y, r){
  c.fillStyle = P.ok; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  c.save(); c.strokeStyle = '#fff'; c.lineWidth = r * 0.42; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x - r * 0.48, y + r * 0.02); c.lineTo(x - r * 0.12, y + r * 0.38); c.lineTo(x + r * 0.5, y - r * 0.34); c.stroke(); c.restore();
}
// Заказы: открытые — «бумажные» карточки; пустое место — лунка с бледной фигурой в пунктире, закрытое — фишка с галочкой.
// Справа маленькая карточка — следующий заказ из очереди (под него можно запасать лоток), на ней число заказов после него.
// hl — место, куда попадёт фигура, если отпустить плитку сейчас (target из ядра): оно пульсирует, пока тянешь.
// На старте уровня карточки трижды пульсируют, чтобы взгляд нашёл цель.
function drawOrders(c, g, now, hl){
  const s = G.s, V = G.view, ts = G.timeScale;
  const intro = now < G.levelT0 + 1300 ? Math.max(0, Math.sin((now - G.levelT0) / 1300 * Math.PI * 3)) : 0;
  for (let a = 0; a < s.show; a++){
    const r = cardRect(a, g), card = V.cards[a], cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    if (!card) continue;                                         // очередь кончилась — пустое место не рисуем, чтобы не казалось, что там что-то ждут
    let k = 1 + 0.05 * intro;
    if (card.done) k = 1 + 0.12 * Math.sin(Math.min(1, (now - card.done) / (CFG.ORDER_DONE_MS / ts)) * Math.PI);
    else if (card.born && now < card.born + CFG.ORDER_IN_MS / ts) k = 0.55 + 0.45 * backOut((now - card.born) / (CFG.ORDER_IN_MS / ts));
    c.save(); c.translate(cx, cy); c.scale(k, k); c.translate(-cx, -cy);
    c.fillStyle = P.paperShadow; rr(c, r.x, r.y + 3, r.w, r.h, 14); c.fill();
    c.fillStyle = card.done ? P.okBg : P.paper; rr(c, r.x, r.y, r.w, r.h, 14); c.fill();
    if (card.done || intro){ c.save(); c.globalAlpha = card.done ? 1 : intro; c.strokeStyle = card.done ? P.ok : P.accent; c.lineWidth = 3; rr(c, r.x, r.y, r.w, r.h, 14); c.stroke(); c.restore(); }
    card.c.forEach((col, i) => {
      const p = orderSlotXY(a, i, card.c.length, g);
      if (card.f[i]){
        const pop = Math.max(0, 1 - (now - card.pop[i]) / 300);
        drawChip(c, col, p.x, p.y, p.r, 1 + 0.35 * pop); drawCheckBadge(c, p.x + p.r * 0.72, p.y + p.r * 0.72, p.r * 0.38);
        return;
      }
      c.fillStyle = P.pSlot; c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill();
      c.save(); c.globalAlpha = 0.5; drawShape(c, col, p.x, p.y, p.r * 0.62); c.restore();
      c.save(); c.setLineDash([3, 3]); c.strokeStyle = P.pMuted; c.lineWidth = 1.5; c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.stroke(); c.restore();
      if (hl && hl.slot === a && hl.k === i && hl.id === card.id){
        c.save(); c.globalAlpha = 0.6 + 0.4 * Math.sin(now / 90); c.strokeStyle = P.accent; c.lineWidth = 3.5; c.beginPath(); c.arc(p.x, p.y, p.r + 3, 0, Math.PI * 2); c.stroke(); c.restore();
      }
    });
    c.restore();
  }
  const nx = s.queue[V.oi];
  if (nx){
    const r = nextRect(g), more = s.queue.length - V.oi - 1, step = Math.min(18, (r.w - 12) / nx.length), x0 = r.x + r.w / 2 - step * (nx.length - 1) / 2;
    c.save(); c.globalAlpha = 0.72; c.fillStyle = P.paper; rr(c, r.x, r.y, r.w, r.h, 11); c.fill(); c.restore();
    nx.forEach((col, k) => drawShape(c, col, x0 + step * k, r.y + r.h / 2, Math.min(8, step * 0.46)));
    if (more > 0){
      c.fillStyle = P.accent; c.beginPath(); c.arc(r.x + r.w - 5, r.y + 2, 11, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff'; c.font = '800 11px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('+' + more, r.x + r.w - 5, r.y + 2.5); c.textBaseline = 'alphabetic';
    }
  }
  if (s.crateGoal){
    const p = crateChipXY(g), pop = Math.max(0, 1 - (now - V.crateT) / 300), ok = V.crates >= s.crateGoal;
    drawCrate(c, p.x - p.r, p.y - p.r, p.r * 2, 1 + 0.4 * pop);
    if (ok) drawCheckBadge(c, p.x + p.r + 14, p.y, 9);
    else { c.textAlign = 'left'; c.textBaseline = 'middle'; c.font = '800 15px system-ui, sans-serif'; c.fillStyle = P.ink; c.fillText(V.crates + '/' + s.crateGoal, p.x + p.r + 6, p.y + 1); c.textBaseline = 'alphabetic'; }
  }
}
// Лоток прямо под заказами: янтарный корпус с носиком вверх (отдаёт фигуры в заказы), cap лунок. Полный лоток пульсирует красным.
// Пока тянешь плитку: kind === 'tray' — подсвечена лунка, куда ляжет лишняя фигура; kind === 'over' — лоток краснеет: не влезет.
function drawTray(c, g, now, kind){
  const s = G.s, V = G.view, n = V.tray.length, r = trayRect(g);
  const flash = G.trayFlash && now >= G.trayFlash && now < G.trayFlash + 700, hot = n >= s.cap || flash || kind === 'over';
  const beat = hot ? 0.5 + 0.5 * Math.sin(now / (kind === 'over' || flash ? 60 : 170)) : 0;
  c.fillStyle = P.tray; c.beginPath(); c.moveTo(r.x + 25, r.y - 8); c.lineTo(r.x + 36, r.y + 2); c.lineTo(r.x + 14, r.y + 2); c.closePath(); c.fill();
  c.fillStyle = P.trayDark; rr(c, r.x, r.y + 3, r.w, r.h, 14); c.fill();
  c.fillStyle = P.tray; rr(c, r.x, r.y, r.w, r.h, 14); c.fill();
  if (hot){ c.save(); c.globalAlpha = 0.3 + 0.55 * beat; c.fillStyle = P.danger; rr(c, r.x, r.y, r.w, r.h, 14); c.fill(); c.restore(); }
  for (let k = 0; k < s.cap; k++){
    const p = trayXY(k, g);
    c.fillStyle = P.trayHole; c.beginPath(); c.arc(p.x, p.y, p.r + 1, 0, Math.PI * 2); c.fill();
    if (k < n){ const it = V.tray[k], pop = Math.max(0, 1 - (now - it.t) / 300); drawChip(c, it.color, p.x, p.y, p.r, 1 + 0.35 * pop); }
    else if (k === n && kind === 'tray'){
      c.save(); c.globalAlpha = 0.6 + 0.4 * Math.sin(now / 90); c.setLineDash([5, 4]); c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.arc(p.x, p.y, p.r + 1, 0, Math.PI * 2); c.stroke(); c.restore();
    }
  }
}

function render(){
  const now = performance.now();
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!G.s) return;
  const s = G.s, g = geo(), cs = g.cell;
  if (!G.view) snapView();
  runView(now);
  drawBackdrop(ctx, now);
  const sh = shakeOffset(now); ctx.translate(sh.x, sh.y);
  // поле и лунки; мало места — рамка тревожно пульсирует
  ctx.fillStyle = P.shadow; rr(ctx, g.ox - 8, g.oy - 4, g.bw + 16, g.bh + 16, 18); ctx.fill();
  ctx.fillStyle = P.board; rr(ctx, g.ox - 8, g.oy - 8, g.bw + 16, g.bh + 16, 18); ctx.fill();
  if (s.every > 0 && !isWin(s)){
    let empty = 0; for (const c of s.grid) if (c === 0) empty++;
    if (empty <= CFG.DANGER_EMPTY){
      const k = 0.5 + 0.5 * Math.sin(now / (110 + empty * 30));
      ctx.save(); ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--danger'); ctx.globalAlpha = 0.25 + 0.5 * k * (1 - empty / (CFG.DANGER_EMPTY + 1));
      ctx.lineWidth = 4; rr(ctx, g.ox - 8, g.oy - 8, g.bw + 16, g.bh + 16, 18); ctx.stroke(); ctx.restore();
    }
  }
  for (let i = 0; i < s.grid.length; i++){ const p = cellXY(i, g); ctx.fillStyle = P.slot; rr(ctx, p.x + cs * 0.05, p.y + cs * 0.05, cs * 0.9, cs * 0.9, cs * 0.18); ctx.fill(); if (s.floor[i] === HONEY) drawHoney(ctx, p.x, p.y, cs); }
  // искра следующей раздачи
  if (s.every > 0 && s.next && s.next.cell >= 0 && !isWin(s) && !(G.drop && now < G.drop.t1)){ const p = cellXY(s.next.cell, g); drawSpark(ctx, p.x, p.y, cs, s.next.code, now); }
  // превью свайпа: честный расчёт ядра — куда доедет и будет ли щёлк
  let ghost = null;
  if (G.drag && G.drag.dir >= 0){
    const pk = peekMove(s, G.drag.cell * 4 + G.drag.dir);
    if (pk.to !== G.drag.cell){
      const m = G.drag.cell * 4 + G.drag.dir;
      if (G.drag.pm !== m){ G.drag.pm = m; G.drag.pt = pk.partner >= 0 ? applyMove(s, m).last.target : null; }   // куда уйдёт фигура — тот же расчёт ядра, раз на направление
      ghost = { to: pk.to, partner: pk.partner, code: s.grid[G.drag.cell], kind: moveKind(s, m), target: G.drag.pt };
    }
  }
  drawOrders(ctx, g, now, ghost && ghost.target && ghost.target.kind === 'order' ? ghost.target : null);
  drawTray(ctx, g, now, ghost ? ghost.kind : 'none');
  // подсказка при бездействии: плитка с готовой стыковкой подмигивает в сторону пары (ход ядра, не догадка)
  let hintCell = -1, hintDir = 0, hintK = 0;
  const idle = now - G.lastInputT - CFG.IDLE_HINT_MS;
  const lesson = !!(LEVELS[s.li] && LEVELS[s.li].lesson);         // на уроке ведёт рука, подмигивание не нужно
  if (idle > 0 && !lesson && G.screen === 'game' && !G.drag && now >= G.fxUntil && !isWin(s) && !isLose(s)){
    if (G.hintFor !== s){                         // сначала стыковка под заказ; в лоток — только пока там просторно
      G.hintFor = s; const om = orderMoves(s);
      const tm = om.length || s.tray.length > s.cap - 2 ? [] : dockMoves(s).filter(m => moveKind(s, m) === 'tray');
      G.hintMove = om.length ? om[0] : tm.length ? tm[0] : -1;
      if (G.hintMove >= 0) log('fx.start', 'hint', 'cell=' + (G.hintMove >> 2));
    }
    if (G.hintMove >= 0){ hintCell = G.hintMove >> 2; hintDir = G.hintMove & 3; const ph = (idle % 1400) / 1400; hintK = ph < 0.4 ? Math.sin(ph / 0.4 * Math.PI * 2) : 0; }
  }
  // плитки из ядра; те, что сейчас в анимации, рисуют свои эффекты
  const skip = new Set();
  if (G.slide && now < G.slide.t1) skip.add(G.slide.to);
  if (G.drop && now < G.drop.t1) skip.add(G.drop.cell);
  if (ghost){
    const p = cellXY(ghost.to, g);
    ctx.save(); ctx.setLineDash([6, 5]); ctx.lineWidth = 2.5; ctx.strokeStyle = ghost.kind === 'over' ? P.danger : ghost.kind === 'tray' ? P.honey : ghost.partner >= 0 ? P.accent : P.muted;
    rr(ctx, p.x + cs * 0.08, p.y + cs * 0.08, cs * 0.84, cs * 0.84, cs * 0.2); ctx.stroke(); ctx.restore();
    drawPiece(ctx, ghost.code, p.x, p.y, cs, 0.35);
  }
  const ghostAt = {};
  for (const q of G.ghosts) if (now < q.until) ghostAt[q.cell] = q;
  for (let i = 0; i < s.grid.length; i++){
    let c = s.grid[i];
    const gh = ghostAt[i];
    if (gh && gh.kind === 'crate'){ const p = cellXY(i, g); drawCrate(ctx, p.x, p.y, cs, 1 + 0.05 * Math.sin(now / 50)); continue; }
    if (gh && (gh.kind === 'stone' || gh.kind === 'piece')) c = gh.code;
    if (!c || skip.has(i)) continue;
    let { x, y } = cellXY(i, g);
    if (G.hit && G.hit.cell === i && now >= G.hit.t0 && now < G.hit.t1){      // во что упёрлись — вздрагивает от удара
      const v = (now - G.hit.t0) / (G.hit.t1 - G.hit.t0), k = Math.sin(v * Math.PI) * (1 - v) * cs * 0.09;
      x += DIRS[G.hit.dir][0] * k; y += DIRS[G.hit.dir][1] * k;
    }
    if (c === STONE){ drawStone(ctx, i, x, y, cs); continue; }
    if (c === CRATE){ drawCrate(ctx, x, y, cs); continue; }
    let scl = 1, sx = 1, sy = 1;
    if (now < G.levelT0 + CFG.INTRO_MS + CFG.INTRO_STEP * (s.w + s.h)){   // старт уровня: плитки впрыгивают по диагонали
      const v = (now - G.levelT0 - CFG.INTRO_STEP * ((i % s.w) + Math.floor(i / s.w))) / CFG.INTRO_MS;
      scl = 0.35 + 0.65 * backOut(v);
    }
    if (G.land && G.land.cell === i && now >= G.land.t0 && now < G.land.t1){  // остановка: сплющивание вдоль хода
      const v = (now - G.land.t0) / (G.land.t1 - G.land.t0), q = Math.sin(v * Math.PI) * (1 - v * 0.5) * 0.2;
      if (G.land.dir < 2){ sx = 1 - q; sy = 1 + q * 0.7; } else { sy = 1 - q; sx = 1 + q * 0.7; }
      x += DIRS[G.land.dir][0] * q * cs * 0.25; y += DIRS[G.land.dir][1] * q * cs * 0.25;
    }
    if (isWin(s) && G.winT && now >= G.winT){                                // победа: оставшиеся плитки подпрыгивают волной
      const v = (now - G.winT - 70 * ((i % s.w) + Math.floor(i / s.w))) / 320;
      if (v > 0 && v < 1){ const hop = Math.sin(v * Math.PI); y -= hop * cs * 0.18; scl *= 1 + hop * 0.08; }
    }
    if (i === hintCell){
      x += DIRS[hintDir][0] * hintK * cs * 0.08; y += DIRS[hintDir][1] * hintK * cs * 0.08;
    }
    if (G.wiggle && G.wiggle.cell === i && now < G.wiggle.t1){
      const u = (now - G.wiggle.t0) / (G.wiggle.t1 - G.wiggle.t0), k = Math.sin(u * Math.PI * 3) * (1 - u) * cs * 0.06;
      if (G.wiggle.dir < 0) scl = 1 + Math.sin(u * Math.PI) * 0.06; else { x += DIRS[G.wiggle.dir][0] * k; y += DIRS[G.wiggle.dir][1] * k; }
    }
    if (G.drag && G.drag.cell === i){                                          // плитка тянется за пальцем «резинкой»
      scl *= 1.06;
      if (G.drag.dir >= 0){ const pull = Math.min(cs * CFG.DRAG_PULL, G.drag.len / scale * 0.25); x += DIRS[G.drag.dir][0] * pull; y += DIRS[G.drag.dir][1] * pull; }
    }
    if (ghost && ghost.partner === i) scl *= 1 + 0.06 * (0.5 + 0.5 * Math.sin(now / 80));
    drawPiece(ctx, c, x, y, cs, 1, scl, sx, sy);
    if (gh && gh.kind === 'chain'){ ctx.save(); ctx.globalAlpha = 1; drawChain(ctx, x, y, cs); ctx.restore(); }
    if (i === hintCell){ ctx.save(); ctx.globalAlpha = 0.45 + 0.45 * Math.abs(hintK); ctx.strokeStyle = P.accent; ctx.lineWidth = 3.5;
      rr(ctx, x + 1, y + 1, cs - 2, cs - 2, cs * 0.22); ctx.stroke(); ctx.restore(); }
    if (G.kbd && i === G.cursor){ ctx.strokeStyle = P.accent; ctx.lineWidth = 3; rr(ctx, x + 2, y + 2, cs - 4, cs - 4, cs * 0.2); ctx.stroke(); }
  }
  if (G.kbd && s.grid[G.cursor] <= 0){ const p = cellXY(G.cursor, g); ctx.strokeStyle = P.accent; ctx.lineWidth = 2; rr(ctx, p.x + 4, p.y + 4, cs - 8, cs - 8, cs * 0.2); ctx.stroke(); }
  // стоящие половинки стыковок (уже удалены из ядра) — до момента стыковки
  for (const M of G.merges){
    if (now < M.tShow || now >= M.t0) continue;
    if (M.magnet){                                              // магнит: обе половинки летят к середине между клетками
      const u = easeIO((now - M.tShow) / (M.t0 - M.tShow)), J = mergeJoint(M, g), a = cellXY(M.aCell, g), b = cellXY(M.bCell, g);
      const off = cs * 0.24 * u, ax = J.x - cs / 2 - (M.vert ? 0 : off), ay = J.y - cs / 2 - (M.vert ? off : 0), bx = J.x - cs / 2 + (M.vert ? 0 : off), by = J.y - cs / 2 + (M.vert ? off : 0);
      drawPiece(ctx, M.aCode, a.x + (ax - a.x) * u, a.y + (ay - a.y) * u, cs, 1, 1 + 0.08 * Math.sin(u * Math.PI));
      drawPiece(ctx, M.bCode, b.x + (bx - b.x) * u, b.y + (by - b.y) * u, cs, 1, 1 + 0.08 * Math.sin(u * Math.PI));
      continue;
    }
    const st = M.active === M.aCell ? M.bCell : M.aCell, p = cellXY(st, g);
    drawPiece(ctx, st === M.aCell ? M.aCode : M.bCode, p.x, p.y, cs, 1, 1 + 0.05 * Math.sin((now - M.tShow) / 70));
  }
  // скольжение
  if (G.slide && now < G.slide.t1){
    // разгон (как по льду до удара), бледный шлейф позади, растяжение вдоль хода
    const S = G.slide, a = cellXY(S.from, g), b = cellXY(S.to, g), raw = (now - S.t0) / (S.t1 - S.t0);
    const pos = (r) => { r = Math.max(0, Math.min(1, r)); return r * 0.55 + r * r * 0.45; };
    for (let k = CFG.TRAIL_N; k >= 1; k--){
      const uk = pos(raw - k * 0.09); if (raw - k * 0.09 <= 0) continue;
      drawPiece(ctx, S.code, a.x + (b.x - a.x) * uk, a.y + (b.y - a.y) * uk, cs, 0.22 * (1 - k / (CFG.TRAIL_N + 1)), 0.92);
    }
    const u = pos(raw), st = 0.14 * Math.sin(Math.min(1, raw) * Math.PI * 0.9);
    drawPiece(ctx, S.code, a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u, cs, 1, 1, S.dir < 2 ? 1 + st : 1 - st * 0.5, S.dir < 2 ? 1 - st * 0.5 : 1 + st);
  }
  // падение раздачи
  if (G.drop && now < G.drop.t1){
    // призрак в клетке становится плиткой: до начала — тот же призрак, затем плитка проявляется с лёгким отскоком
    const D = G.drop, p = cellXY(D.cell, g);
    if (now < D.t0) drawSpark(ctx, p.x, p.y, cs, D.code, now);
    else {
      const u = (now - D.t0) / (D.t1 - D.t0), w = Math.min(1, u / 0.7), v = backOut(w), q = u < 0.7 ? 0 : Math.sin((u - 0.7) / 0.3 * Math.PI) * 0.12;
      drawPiece(ctx, D.code, p.x, p.y - (1 - w) * cs * 0.3, cs, Math.min(1, 0.45 + w), 0.6 + 0.4 * v, 1 + q, 1 - q);
    }
  }
  // стыковки: половинки сходятся → вспышка целого → полёт в копилку
  for (const M of G.merges){
    if (now < M.t0 || now >= M.flyEnd) continue;
    const a = cellXY(M.aCell, g), J = mergeJoint(M, g), edgeX = J.x, cy = J.y, R = cs * HALF_R;
    const u = (now - M.t0) / (M.t1 - M.t0);
    if (u < 0.45 && !M.magnet){
      const v = backOut(u / 0.45), gap = cs * 0.06 * (1 - v);
      ctx.save(); ctx.globalAlpha = 1 - v * 0.7; ctx.fillStyle = P.tile;
      if (M.vert) rr(ctx, a.x + cs * 0.06, a.y + cs * 0.06 + v * cs * 0.3, cs * 0.88, cs * 1.88 - v * cs * 0.6, cs * 0.2);
      else rr(ctx, a.x + cs * 0.06 + v * cs * 0.3, a.y + cs * 0.06, cs * 1.88 - v * cs * 0.6, cs * 0.88, cs * 0.2);
      ctx.fill(); ctx.restore();
      if (M.vert){ drawHalf(ctx, M.aCode, J.x, J.y - gap, R, a.x, a.y, cs, cs * 2); drawHalf(ctx, M.bCode, J.x, J.y + gap, R, a.x, a.y, cs, cs * 2); }
      else { drawHalf(ctx, M.aCode, J.x - gap, J.y, R, a.x, a.y, cs * 2, cs); drawHalf(ctx, M.bCode, J.x + gap, J.y, R, a.x, a.y, cs * 2, cs); }
    } else if (u < 1){
      const v = M.magnet ? u : (u - 0.45) / 0.55, pulse = 1 + (0.35 + 0.05 * Math.min(4, M.combo)) * Math.sin(Math.min(1, v * 1.6) * Math.PI);
      drawBurst(ctx, edgeX, cy, R, M.color, v, Math.min(4, M.combo));
      ctx.save(); ctx.translate(edgeX, cy); ctx.rotate(Math.sin(v * Math.PI * 2) * 0.12 * (1 - v)); drawShape(ctx, M.color, 0, 0, R * pulse); ctx.restore();
    } else {
      const v = easeIO((now - M.t1) / (M.flyEnd - M.t1)), sp = targetXY(M.target, g);
      if (M.target.kind === 'bonus'){ ctx.save(); ctx.globalAlpha = 1 - v; drawShape(ctx, M.color, edgeX, cy - v * 40, R * (1 - v * 0.6)); ctx.restore(); continue; }
      const x = edgeX + (sp.x - edgeX) * v, y = cy + (sp.y - cy) * v - Math.sin(v * Math.PI) * 60;
      ctx.save(); ctx.globalAlpha = 0.3; for (let k = 1; k <= 3; k++){ const vk = easeIO((now - M.t1 - k * 30) / (M.flyEnd - M.t1)); if (vk <= 0) continue;
        drawShape(ctx, M.color, edgeX + (sp.x - edgeX) * vk, cy + (sp.y - cy) * vk - Math.sin(vk * Math.PI) * 60, (R + (sp.r - R) * vk) * (1 - k * 0.15)); }
      ctx.restore();
      ctx.save(); ctx.translate(x, y); ctx.rotate(v * Math.PI * 2); drawShape(ctx, M.color, 0, 0, R + (sp.r - R) * v); ctx.restore();
    }
  }
  for (const f of G.crateFly){                                  // ящик летит в фишку цели
    if (now < f.t0 || now >= f.t1) continue;
    const v = easeIO((now - f.t0) / (f.t1 - f.t0)), sp = crateChipXY(g);
    const x = f.x + (sp.x - f.x) * v, y = f.y + (sp.y - f.y) * v - Math.sin(v * Math.PI) * 50, sz = cs * (0.9 - 0.55 * v);
    ctx.save(); ctx.translate(x, y); ctx.rotate(v * 5); drawCrate(ctx, -sz / 2, -sz / 2, sz); ctx.restore();
  }
  // фигуры из лотка летят в открывшийся заказ
  if (G.flies.length){
    G.flies = G.flies.filter(f => now < f.t1);
    for (const f of G.flies){
      const v = easeIO((now - f.t0) / (f.t1 - f.t0)), a = trayXY(f.from, g), b = targetXY(f.T, g);
      drawChip(ctx, f.color, a.x + (b.x - a.x) * v + Math.sin(v * Math.PI) * 14, a.y + (b.y - a.y) * v, a.r + (b.r - a.r) * v, 1 + 0.25 * Math.sin(v * Math.PI));
    }
  }
  // метла: полоса идёт по ряду или столбцу
  if (G.sweep && now >= G.sweep.t0 && now < G.sweep.t1){
    const S = G.sweep, u = (now - S.t0) / (S.t1 - S.t0);
    ctx.save(); ctx.globalAlpha = 0.85 * Math.sin(Math.min(1, u * 1.2) * Math.PI * 0.9 + 0.3); ctx.fillStyle = P.honey;
    if (S.row >= 0) rr(ctx, g.ox + g.bw * u - 7, g.oy + S.row * cs + 4, 14, cs - 8, 7); else rr(ctx, g.ox + S.col * cs + 4, g.oy + g.bh * u - 7, cs - 8, 14, 7);
    ctx.fill(); ctx.restore();
  }
  drawParticles(ctx, now);
  drawPraise(ctx, now);
  // рука на уроках: показывает следующий ход (до первого хода — сразу, дальше после короткой паузы). Текста на уровнях нет.
  if (lesson && G.screen === 'game' && !G.drag && !isWin(s) && !isLose(s) && now >= G.fxUntil && now - G.lastInputT > (s.moves ? CFG.LESSON_HINT_MS : 500)){
    if (G.handFor !== s){ G.handFor = s; G.handMove = lessonMove(s); G.handT0 = now; if (G.handMove >= 0) log('fx.start', 'hand', 'cell=' + (G.handMove >> 2) + ' dir=' + '→←↓↑'[G.handMove & 3]); }
    if (G.handMove >= 0){
      const a = cellXY(G.handMove >> 2, g), b = cellXY(peekMove(s, G.handMove).to, g);
      drawHand(ctx, a.x + cs * 0.5, a.y + cs * 0.62, b.x - a.x, b.y - a.y, now - G.handT0);
    }
  }
  // журнал fx.end и финал — по состоянию в кадре, не по событию (урок «Стыковки»)
  if (G.fxOpen.length){ const keep = []; for (const f of G.fxOpen){ if (now >= f.t1) log('fx.end', f.name); else keep.push(f); } G.fxOpen = keep; }
  if (G.screen === 'game' && !G.ending && (isWin(s) || isLose(s)) && now >= G.fxUntil) G.ending = now + (isWin(s) ? 0 : CFG.END_DELAY_MS);
  if (G.ending && now >= G.ending) finishEnding();
  if (toastUntil && now > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
}

// --- цикл: rAF + watchdog setInterval; безопасно, потому что время абсолютное (§4). Кадр под try/catch. ---
let lastFrame = 0, frameErrors = 0;
function safeRender(){ try { render(); } catch (e) { frameErrors++; if (frameErrors < 5) console.error(e); log('event', 'frame.error', e && e.message); } }
function frame(){ lastFrame = performance.now(); if (!G.paused) safeRender(); requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) safeRender(); }, 40);

// --- дебаг-хук (§6): состояние, любой экран, ходы, прогон времени, автоигра ---
const DIR_KEYS = { R: 0, L: 1, D: 2, U: 3, '→': 0, '←': 1, '↓': 2, '↑': 3 };
window.POLOVINKI = {
  G, CFG,
  state(){ const s = G.s; return s ? { level: s.li + 1, hard: s.hard, rows: gridRows(s), moves: s.moves, docks: s.docks,
    orders: s.active.map(o => o && o.c.map((c, k) => (o.f[k] ? '+' : '') + LAYOUT_CHARS[c]).join(' ')), queueLeft: s.queue.length - s.oi,
    tray: s.tray.map(c => LAYOUT_CHARS[c]).join(''), cap: s.cap, crates: s.crates, crateGoal: s.crateGoal, progress: goalProgress(s), every: s.every,
    next: s.next, par: G.par, undoLeft: G.undoLeft, boost: { ...G.save.boost }, revived: G.revived, win: isWin(s), lose: isLose(s),
    why: !isLose(s) ? '' : s.trayOver ? 'tray' : s.dead ? 'timer' : 'board', screen: G.screen, frameErrors } : { screen: G.screen }; },
  play(n){ startLevel(Math.max(1, n || 1) - 1); return this.state(); },
  move(cell, dir){ doMove(cell * 4 + (typeof dir === 'string' ? DIR_KEYS[dir] : dir)); return this.state(); },
  moves(){ return G.s ? legalMoves(G.s).map(m => ({ cell: m >> 2, dir: '→←↓↑'[m & 3], ...peekMove(G.s, m), kind: moveKind(G.s, m) })) : []; },
  pos(cell){ const g = geo(), q = cellXY(cell, g), r = cv.getBoundingClientRect(); return { x: r.left + (q.x + g.cell / 2) * scale, y: r.top + (q.y + g.cell / 2) * scale, cell: g.cell * scale }; },   // центр клетки в координатах окна — для проверки настоящим касанием
  magnet(){ useBoost('magnet'); return this.state(); },                       // бустеры и «Продолжить» — те же вызовы, что у кнопок
  broom(){ useBoost('broom'); return this.state(); },
  revive(){ doRevive(); return this.state(); },
  boosts(n){ G.save.boost = { magnet: n, broom: n }; save(); hud(); return G.save.boost; },   // задать запас бустеров (для проверки заглушки рекламы — 0)
  bot(policy, delayMs){                                                         // автоигра ботом ядра: greedy | docker | novice
    const step = () => { if (!G.s || G.screen !== 'game' || isWin(G.s) || isLose(G.s)) return; const r = mulberry32(G.s.moves + 5);
      doMove(policy === 'docker' ? dockerPick(G.s, r) : policy === 'novice' ? novicePick(G.s, r) : greedyPick(G.s)); setTimeout(step, delayMs || 400); };
    step(); return policy || 'greedy'; },
  undo(){ undo(); return this.state(); },
  goto(screen){ goto(screen); return G.screen; },
  solve(w){ return G.s ? (solve(G.s, w || CFG.SIM_BEAM) || []).map(m => ({ cell: m >> 2, dir: '→←↓↑'[m & 3] })) : null; },
  hint(){ const p = G.s && solve(G.s, CFG.PAR_BEAM); return p && p.length ? { cell: p[0] >> 2, dir: '→←↓↑'[p[0] & 3] } : null; },
  auto(delayMs, width){ const p = (G.s && solve(G.s, width || CFG.SIM_BEAM)) || []; p.forEach((m, k) => setTimeout(() => doMove(m), (delayMs || 450) * (k + 1))); return p.length; },
  drive(sec){                                   // ручной прогон игрового времени: rAF заморожен в скрытой вкладке
    const end = performance.now() + sec * 1000; let n = 0;
    while (performance.now() < end && n < 200000){ safeRender(); n++; }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },   // чит: открыть все уровни
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт ---
fit(); hud();
const startHash = location.hash.slice(1) === 'unlock' ? (setUnlockAll(true), 'menu') : location.hash.slice(1);
if (startHash === 'game') startLevel(G.save.level); else goto(startHash || 'menu');
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length);
</script>
