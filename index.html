*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 'Nunito', system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:linear-gradient(180deg,var(--frame-top),var(--frame) 45%,#6a4be6);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 2px 16px;pointer-events:none;min-height:50px}
header b{font-size:20px;font-weight:900}
header b i{font-style:normal;font-size:12px;font-weight:900;letter-spacing:.06em;color:#fff;background:var(--danger);border-radius:8px;padding:2px 7px;margin-left:8px;vertical-align:3px}
header button{pointer-events:auto}
.gear{display:flex;align-items:center;justify-content:center;width:46px;height:44px;padding:0;border-radius:14px;background:linear-gradient(180deg,#6cc0ff,var(--btn-b));color:#fff;
  box-shadow:0 5px 0 var(--btn-b-d);transition:transform .06s,box-shadow .06s}
.gear:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-b-d)}
.gear svg{width:26px;height:26px;display:block}
.card .gear{position:absolute;right:12px;top:12px}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#boosts{display:flex;gap:14px;justify-content:center;padding:0 14px 2px}
#boosts.hide{display:none}
.boost{position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:56px;padding:0;border-radius:18px;background:linear-gradient(180deg,#7fcaff,var(--btn-b));box-shadow:0 6px 0 var(--btn-b-d),0 10px 14px rgba(20,10,80,.3);transition:transform .06s,box-shadow .06s}
.boost:active{transform:translateY(5px);box-shadow:0 1px 0 var(--btn-b-d),0 2px 4px rgba(20,10,80,.3)}
.boost svg{width:32px;height:32px;display:block}
.boost img{height:36px;width:auto;max-width:44px;display:block;pointer-events:none;-webkit-user-drag:none}
.boost.dim img{opacity:.4}
.boost b{position:absolute;right:-7px;top:-7px;min-width:24px;padding:2px 6px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.boost b.ad{background:var(--btn-g);display:flex;align-items:center;gap:2px}
.boost b.ad svg,.adico{width:11px;height:11px;display:inline-block;vertical-align:-1px}
#boosts.pulse .boost{animation:bpulse 1s ease-in-out infinite}
.boost.dim svg{opacity:.4}                                          /* Undo: отменять нечего */   /* бустеры появились впервые — кнопки «дышат», текста нет */
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#frame>#boosts{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
button{font:inherit;color:var(--ink);background:var(--off);border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.45}
/* v0.9: все кнопки объёмные — тень-«бортик» снизу, при нажатии кнопка проседает (сдвиг + тень короче), звук press.
   Цвет по смыслу: g — хорошее и спасительное (Next, Continue, Watch, Resume), r — негативное, куда не зовём (Restart, Quit, No thanks, Retry рядом с Continue),
   n — нейтральное (настройки, вспомогательное). */
.btn{--bc:var(--btn-n);--bs:var(--btn-n-d);position:relative;color:#fff;font-weight:900;background:var(--bc);border-radius:16px;padding:12px 20px;
  box-shadow:0 6px 0 var(--bs),0 9px 14px rgba(20,22,60,.28);transform:translateY(0);transition:transform .06s,box-shadow .06s;text-shadow:0 2px 0 rgba(0,0,0,.16)}
.btn::after{content:'';position:absolute;left:12px;right:12px;top:4px;height:24%;max-height:12px;border-radius:12px;background:rgba(255,255,255,.2);pointer-events:none}   /* блик сверху */
.btn:active,.btn.down{transform:translateY(5px);box-shadow:0 1px 0 var(--bs),0 3px 6px rgba(20,22,60,.25)}
.btn.g{--bc:var(--btn-g);--bs:var(--btn-g-d)} .btn.r{--bc:var(--btn-r);--bs:var(--btn-r-d)} .btn.n{--bc:var(--btn-n);--bs:var(--btn-n-d)}
.btn.small{font-size:15px;padding:9px 18px;border-radius:13px;box-shadow:0 4px 0 var(--bs),0 6px 10px rgba(20,22,60,.25)}
.btn.small:active,.btn.small.down{transform:translateY(3px);box-shadow:0 1px 0 var(--bs)}
.btn.late{visibility:hidden} .btn.late.in{visibility:visible;animation:btnIn .5s cubic-bezier(.25,1.8,.5,1) both}
@keyframes btnIn{from{transform:scale(.55)}to{transform:scale(1)}}   /* старт с видимого состояния (§9): кнопку показывает JS через задержку, а не opacity:0 */
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,22,50,.6);padding:20px}
#overlay.show{display:flex}
.card{position:relative;background:var(--frame);border-radius:20px;padding:22px;max-width:340px;width:100%;max-height:100%;overflow-y:auto;text-align:center;
  animation:pop .18s ease-out} /* стартует с видимого состояния, не с opacity:0 (§9) */
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.card h2{margin:0 0 8px;font-weight:900} .card p{color:var(--muted);margin:0 0 16px}
.card .title{font-size:34px;font-weight:1000;letter-spacing:.01em;margin:6px 0 4px}
.card .logo{width:130px;height:78px;margin:4px auto 2px;display:block}
button.big{font-size:22px;font-weight:1000;padding:16px 26px;border-radius:18px;min-width:220px}
.opts{display:flex;flex-direction:column;gap:12px;margin:8px 0 18px}
.opts button{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:900;padding:12px 16px}
.opts button b{font-size:14px;padding:3px 10px;border-radius:10px;background:var(--btn-g);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.opts button b.off{background:rgba(0,0,0,.18);color:#dfe2ff}
.opts button.quiet{justify-content:center}
/* вин-скрин v0.9: без звёзд — «Well done!», собранные фигуры подпрыгивают, Next появляется с задержкой и пружинит */
.card.winc{background:linear-gradient(180deg,#9a74ff,#6c4ce8);box-shadow:0 10px 0 #4a32b0,0 18px 30px rgba(10,10,40,.4);padding:26px 20px 24px;overflow:visible}
.card .wlv{font-size:14px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#dfe2ff;opacity:.85}
.card .wd{font-size:46px;line-height:1.02;font-weight:1000;margin:6px 0 4px;color:#fff;text-shadow:0 4px 0 #4a32b0;animation:wdIn .55s cubic-bezier(.25,1.7,.5,1) both}
@keyframes wdIn{from{transform:scale(.6) rotate(-6deg)}to{transform:scale(1) rotate(0)}}
.card .figs{display:flex;justify-content:center;gap:6px;margin:14px 0 22px;min-height:60px;flex-wrap:wrap}
.card .figs .fg{position:relative;width:52px;height:56px;animation:hop .6s cubic-bezier(.3,.0,.5,1) both;animation-iteration-count:3}
.card .figs .fg canvas{width:52px;height:52px;display:block}
.card .figs .fg b{position:absolute;right:-4px;bottom:0;font-size:13px;font-weight:1000;background:#fff;color:var(--panel-ink);border-radius:9px;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-16px) scale(1.06,.96)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:translateY(0)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#overlay{z-index:10}
.card.ad{background:#111;color:#fff} .card.ad .adbig{font-size:64px;font-weight:1000;letter-spacing:.08em;margin:8px 0}
.card.ad .adbar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:12px 0 4px}
.card.ad .adbar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:adfill var(--adms,1200ms) linear both}
@keyframes adfill{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
/* Заставка (замечание бота): видна до разбора скриптов; полосу двигает LOADER, обёртке — pfSdk.loadingProgress, на первом кадре — pfSdk.ready() */
#loading{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--frame);transition:opacity .3s}
#loading.gone{opacity:0;pointer-events:none}
#loading[hidden]{display:none}
#loading svg{width:150px;height:90px}
#load-title{font-size:32px;font-weight:1000;margin:0}
#load-bar{width:180px;height:8px;border-radius:99px;background:var(--off);overflow:hidden}
#load-fill{height:100%;width:6%;border-radius:99px;background:var(--accent);transition:width .25s ease-out}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px;max-height:42vh;overflow-y:auto;padding:2px}
.levels .ch{grid-column:1/-1;text-align:left;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.levels button{padding:8px 0;font-size:14px}
.levels button small{display:block;font-size:10px;color:var(--c2)}
.levels button.locked{opacity:.4}
.levels button.hard{box-shadow:inset 0 0 0 2px var(--danger)}
.card .note{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.cheat{margin-top:10px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--frame);padding:8px 14px;border-radius:10px;
  pointer-events:none;opacity:.95;transition:opacity .25s;white-space:nowrap}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card, #boosts.pulse .boost, .card .wd, .card .figs .fg, .btn.late.in{animation:none} #toast{transition:none} }
#toast{bottom:96px;font-weight:700}
</style>

<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Половинки». Поле w×h, в клетках — пусто, камень или плитка с половинкой фигуры.
// Свайп двигает плитку до упора (стена, камень, другая плитка). Если после остановки
// левая половинка стоит вплотную слева от правой того же цвета — стыковка: обе исчезают,
// целая фигура уходит в открытый заказ, которому она нужна. Фигура, которую никто не заказал, ложится
// в лоток (cap мест) и сама уйдёт в заказ, когда такой откроется; места в лотке нет — проигрыш.
// После хода без стыковки (CFG.DEAL = 'miss', с v0.8; 'each' — после каждого every-го хода) на поле падает новая половинка в клетку с искрой (видно заранее).
// Цель — закрыть все заказы очереди (и сломать ящики, если есть). Проигрыш — поле забито (пустых клеток нет и ходить некуда)
// или лишняя фигура не влезла в лоток. Если ходить нечем, а место на поле есть, раздача падает сама (topUp) — это не проигрыш.
// Коды клеток: 0 — пусто, -1 — камень, -2 — ящик, половинка — см. pieceCode ниже.
// Ход — число m = клетка*4 + направление (0 →, 1 ←, 2 ↓, 3 ↑).
// ---------------------------------------------------------------------------
const CFG = {
  // --- правила, солвер, генератор ---
  PAR_BEAM: 40,        // ширина луча солвера в игре (par для звёзд); оффлайн-аудит берёт SIM_BEAM
  SIM_BEAM: 300,       // ширина луча солвера в sim.mjs
  MAX_DEPTH: 60,       // предел глубины солвера (ходов)
  BOT_CAP: 150,        // предел ходов ботов: на уровнях без раздачи иначе можно ходить вечно
  GEN_ATTEMPTS: 80,    // попыток собрать поле на один сид, прежде чем взять последнее
  TRAY_CAP: 4,         // мест в лотке: фигура, которую никто не заказал, ждёт здесь; не поместилась — проигрыш
  ORDER_SHOW: 2,       // сколько заказов открыто одновременно
  WANT: 0.5,           // доля раздач, цвет которых берётся из открытых заказов (остальные — любой цвет уровня)
  DEAL: 'miss',        // когда падает раздача: 'miss' — только после хода без стыковки (v0.8, решение Андрея); 'each' — после каждого хода; 'second' — через ход
  TRAY_PLUS: 0,        // добавка к лотку на всех уровнях (удалённый ключ tray_cap − TRAY_CAP; только ≥ 0 — только легче)
  WANT_BONUS: 0,       // сдвиг доли нужных раздач want на уровнях с раздачей (удалённый ключ want_bonus; только ≥ 0 — только легче)
  LOOP_FROM: 51,       // после последнего уровня таблицы — по кругу с этого номера (номера на экране продолжают расти)
  BOOST_START: 2,      // сколько каждого бустера (магнит, метла, отмена) лежит в сейве на старте
  REVIVE_PAIRS: 2,     // «Продолжить» после проигрыша: сколько пар под заказ магнит стыкует сам (плюс пустой лоток и метла)
  BOOST_FROM: 7,       // с какого уровня видны бустеры и рекламное место в лотке (до этого игрок учит заказы и лоток)
  INTER_FROM: 8,       // с какого уровня после победы стоял бы межуровневый ролик (заглушка: только строка в журнале)
  // --- оболочка: тайминги (мс, абсолютное время) и ввод ---
  SLIDE_MS_CELL: 55,   // скольжение плитки на одну клетку
  SLIDE_MIN_MS: 110,   // минимальная длительность скольжения
  DOCK_MS: 320,        // стыковка: половинки сходятся, целое вспыхивает
  FLY_MS: 460,         // целая фигура летит в заказ или в лоток
  ORDER_DONE_MS: 320,  // закрытая карточка заказа празднует и уходит
  ORDER_IN_MS: 240,    // новая карточка заказа въезжает
  ORDER_SHIFT_MS: 180, // карточки съезжаются, когда соседняя стала уже, шире или ушла
  WANT_FLASH_MS: 800,  // вспышка свечения на плитках, чья фигура только что стала нужна заказу
  SHINE_MS: 2400,      // за сколько блик пробегает по светящейся фигуре (и пауза до следующего)
  UNTRAY_MS: 380,      // фигура летит из лотка в заказ
  MAGNET_MS: 340,      // магнит стягивает две половинки друг к другу
  BROOM_MS: 420,       // метла проходит по ряду
  SPAWN_MS: 300,       // новая половинка проявляется в клетке искры (призрак становится плиткой)
  END_DELAY_MS: 380,   // пауза между последним эффектом и карточкой победы/проигрыша
  AD_MS: 1200,         // заглушка ролика «AD» (тело showRewarded / showInterstitial заменит обёртка)
  SWIPE_PX: 14,        // порог свайпа в экранных px; короче — тап (плитка вздрагивает)
  TOAST_MS: 1600,      // сколько висит тост
  // --- сочность (только оболочка; на правила не влияют) ---
  SHAKE_PX: 4,         // амплитуда встряски экрана на «щёлк» (растёт с серией до SHAKE_MAX)
  SHAKE_MAX: 9,        // потолок встряски
  SHAKE_MS: 240,       // длительность встряски
  LAND_MS: 190,        // сплющивание плитки при остановке

const STONE = -1, CRATE = -2;                              // помехи: камень вечный, ящик ломается стыковкой рядом
const HONEY = 1;                                           // пол (массив floor): мёд — плитка на нём останавливается
const RAINBOW = 5;                                         // «цвет» радужной половинки: стыкуется с любым цветом
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];          // → ← ↓ ↑
// Код плитки: 1 + цвет*4 + сторона (0 левая, 1 правая, 2 верхняя, 3 нижняя); +100 — в цепи; +1000*t — таймер на t ходов.
const pieceCode = (color, side, chain, timer) => 1 + color * 4 + side + (chain ? 100 : 0) + (timer ? 1000 * timer : 0);
const colorOf = (code) => ((code % 100) - 1) >> 2;
const sideOf = (code) => ((code % 100) - 1) & 3;
const isChained = (code) => code > 0 && Math.floor((code % 1000) / 100) === 1;
const timerOf = (code) => code > 0 ? Math.floor(code / 1000) : 0;
const isVert = (code) => sideOf(code) >= 2;

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Случайное число без состояния: раздача зависит только от (сид уровня, номер раздачи, соль).
function hashRand(seed, k, salt){
  return mulberry32((seed ^ Math.imul(k + 1, 0x9E3779B1) ^ Math.imul(salt + 7, 0x85EBCA77)) >>> 0)();
}

// (сид от номера уровня таблицы), номер на экране — li + 1.
function levelSpec(li){
  if (li < LEVELS.length) return LEVELS[li];
  const a = Math.max(0, Math.min(LEVELS.length - 1, CFG.LOOP_FROM - 1)), len = LEVELS.length - a;
  return LEVELS[a + (li - LEVELS.length) % len];
}

// --- раскладка уровня ---
const LAYOUT_CHARS = 'hcsdlr';                            // r — радужная (цвет RAINBOW = 5)
function parseLayout(rows){
  const toks = rows.map(r => r.indexOf(' ') >= 0 ? r.trim().split(/\s+/) : r.split(''));
  const h = toks.length, w = toks[0].length, grid = new Array(w * h).fill(0), floor = new Array(w * h).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    let t = toks[y][x]; const i = y * w + x;
    if (t[0] === '~'){ floor[i] = HONEY; t = t.slice(1); if (!t) continue; }
    if (t === '.') continue;
    if (t === '#'){ grid[i] = STONE; continue; }
    if (t === 'x'){ grid[i] = CRATE; continue; }
    const col = LAYOUT_CHARS.indexOf(t[0].toLowerCase());
    if (col < 0) throw new Error('layout: неизвестный токен ' + t);
    const first = t[0] === t[0].toLowerCase(), vert = t.indexOf('^') >= 0, chain = t.indexOf('*') >= 0;
    const tm = t.match(/\d+/);
    grid[i] = pieceCode(col, (vert ? 2 : 0) + (first ? 0 : 1), chain, tm ? +tm[0] : 0);
  }
  return { grid, w, h, floor };
}
function cellToken(s, i){
  const c = s.grid[i], hon = s.floor && s.floor[i] === HONEY ? '~' : '';
  if (c === 0) return hon || '.';
  if (c === STONE) return hon + '#';
  if (c === CRATE) return hon + 'x';
  const ch = LAYOUT_CHARS[colorOf(c)], sd = sideOf(c);
  return hon + (sd === 0 || sd === 2 ? ch : ch.toUpperCase()) + (sd >= 2 ? '^' : '') + (isChained(c) ? '*' : '') + (timerOf(c) || '');
}
function gridRows(s){
  const out = [];
  for (let y = 0; y < s.h; y++){ const r = []; for (let x = 0; x < s.w; x++) r.push(cellToken(s, y * s.w + x)); out.push(r.join(' ')); }
  return out;
}

// --- движение и стыковка ---
// Куда доедет плитка из клетки i в направлении d: до стены, до занятой клетки или до мёда (на мёде останавливается).
function slideDest(grid, w, h, i, d, floor){
  const dx = DIRS[d][0], dy = DIRS[d][1];
  let x = i % w, y = (i - x) / w;
  for (;;){
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= w || ny >= h || grid[ny * w + nx] !== 0) break;
    x = nx; y = ny;
    if (floor && floor[y * w + x] === HONEY) break;
  }
  return y * w + x;
}
const colorsMatch = (a, b) => { const ca = colorOf(a), cb = colorOf(b); return ca === cb || ca === RAINBOW || cb === RAINBOW; };
// Пара для половинки code в клетке j: левой нужна правая справа, правой — левая слева, верхней — нижняя снизу, нижней — верхняя сверху.
function dockPartner(grid, w, h, j, code){
  if (code <= 0) return -1;
  const x = j % w, y = (j - x) / w, sd = sideOf(code);
  let k = -1, want = -1;
  if (sd === 0 && x < w - 1){ k = j + 1; want = 1; }
  else if (sd === 1 && x > 0){ k = j - 1; want = 0; }
  else if (sd === 2 && y < h - 1){ k = j + w; want = 3; }
  else if (sd === 3 && y > 0){ k = j - w; want = 2; }
  if (k < 0) return -1;
  const n = grid[k];
  return n > 0 && sideOf(n) === want && colorsMatch(code, n) ? k : -1;
}
function hasDock(grid, w, h){ for (let i = 0; i < grid.length; i++){ const c = grid[i]; if (c > 0 && (sideOf(c) === 0 || sideOf(c) === 2) && dockPartner(grid, w, h, i, c) >= 0) return true; } return false; }
function nearestEmpty(grid, w, from){
  let best = -1, bd = Infinity; const fx = from % w, fy = (from - fx) / w;
  for (let i = 0; i < grid.length; i++){
    if (grid[i] !== 0) continue;
    const x = i % w, dd = Math.abs(x - fx) + Math.abs((i - x) / w - fy);
    if (dd < bd){ bd = dd; best = i; }
  }
  return best;
}
function pieceCount(s){ let n = 0; for (const c of s.grid) if (c > 0) n++; return n; }
function neighbors4(i, w, h){ const x = i % w, y = (i - x) / w, o = []; if (x > 0) o.push(i - 1); if (x < w - 1) o.push(i + 1); if (y > 0) o.push(i - w); if (y < h - 1) o.push(i + w); return o; }

// --- заказы и лоток ---
// Заказ — { id, c: [цвета], f: [закрыто?] }. Открыто show заказов (слоты s.active, пустой слот — null); очередь — s.queue.
function newOrder(s){ const c = s.queue[s.oi]; return { id: s.oi++, c, f: c.map(() => false) }; }
// Кладёт фигуру цвета col в первый открытый заказ, где она нужна (радужная целая подходит в любое место). Нет места — null.
function place(s, col){
  for (let a = 0; a < s.active.length; a++){
    const o = s.active[a]; if (!o) continue;
    for (let k = 0; k < o.c.length; k++) if (!o.f[k] && (o.c[k] === col || col === RAINBOW)){ o.f[k] = true; s.served++; return { kind: 'order', slot: a, k, id: o.id, color: o.c[k] }; }

}
// Какие цвета сейчас нужны открытым заказам.
function wantedColors(s){ const w = [false, false, false, false, false]; for (const o of s.active) if (o) o.c.forEach((c, k) => { if (!o.f[k]) w[c] = true; }); return w; }
function ordersLeft(s){ return s.active.some(Boolean); }
// Закрытые заказы уходят, на их место встают следующие из очереди, лоток отдаёт подошедшие фигуры — пока что-то меняется.
function settle(s, ev, by){
  for (let guard = 0; guard < 60; guard++){
    let changed = false;
    for (let a = 0; a < s.active.length; a++){
      const o = s.active[a]; if (!o || !o.f.every(Boolean)) continue;
      ev.push({ type: 'done', slot: a, id: o.id, by });
      s.active[a] = s.oi < s.queue.length ? newOrder(s) : null;
      if (s.active[a]) ev.push({ type: 'order', slot: a, id: s.active[a].id, by });
      changed = true;
    }
    for (let t = 0; t < s.tray.length; t++){
      const hit = place(s, s.tray[t]); if (!hit) continue;
      ev.push({ type: 'untray', color: s.tray[t], from: t, slot: hit.slot, k: hit.k, id: hit.id, by });

}
// Куда идёт целая фигура: в заказ, в лоток, мимо (заказов не осталось) или «не поместилась» (лоток полон — проигрыш).
function deliver(s, col, ev, by){
  const hit = place(s, col);
  if (hit){ settle(s, ev, by); return hit; }
  if (!ordersLeft(s)) return { kind: 'bonus' };
  if (s.tray.length >= s.cap){ s.trayOver = true; return { kind: 'over' }; }
  s.tray.push(col);

}
// Стыковка a+b: целая фигура (радужная берёт цвет пары) уходит по deliver, рядом ломаются ящики и снимаются цепи.
// ev — события для оболочки; by — кто стыковал ('move' | 'spawn' | 'boost'). Возвращает { color, target }.
function dock(s, a, b, ev, by){
  const ca = colorOf(s.grid[a]), cb = colorOf(s.grid[b]), col = ca === RAINBOW ? cb : ca;
  s.grid[a] = 0; s.grid[b] = 0; s.docks++;
  for (const c of [a, b]) for (const k of neighbors4(c, s.w, s.h)){
    const v = s.grid[k];
    if (v === CRATE){ s.grid[k] = 0; s.crates++; ev.push({ type: 'crate', cell: k, by }); }
    else if (isChained(v)){ s.grid[k] = v - 100; ev.push({ type: 'chain', cell: k, code: v, by }); }
  }

  return { color: target.kind === 'order' ? target.color : col, target };
}
// Таймеры: после хода каждый тикает; дошёл до нуля — плитка каменеет.
function tickTimers(s, ev){
  for (let i = 0; i < s.grid.length; i++){
    const t = timerOf(s.grid[i]); if (!t) continue;
    if (t === 1){ ev.push({ type: 'stone', cell: i, code: s.grid[i] }); s.grid[i] = STONE; if (!s.every) s.dead = true; }
    else s.grid[i] -= 1000;
  }
}

// Следующая раздача: какая половинка и куда. Решается сразу после хода — игрок видит её заранее.
// С вероятностью help — пара к одинокой половинке на поле, иначе новая; с вероятностью want цвет берётся из открытых заказов.
function planNext(s){

    const [col, ax] = lonely[Math.floor(hashRand(s.seed, s.k, 2) * lonely.length)];

    const ax = s.vert && hashRand(s.seed, s.k, 9) < s.vert ? 1 : 0;

}
// Раздача «под пару» (урок раздачи, spec.near): клетка, встав в которую, новая половинка стыкуется со своей парой одним свайпом
// (её или пары) — в ряд или в столбец с парой, путь свободен. Сразу вплотную (сама состыкуется) — только если иначе нельзя.
// Из подходящих — ближайшая к pref (призрак не прыгает). Нет подходящих — pref.
function dockInOne(s){
  const { grid, w, h, floor } = s;
  for (let i = 0; i < grid.length; i++){
    if (grid[i] <= 0 || isChained(grid[i])) continue;
    for (let d = 0; d < 4; d++){ const j = slideDest(grid, w, h, i, d, floor); if (j !== i && dockPartner(grid, w, h, j, grid[i]) >= 0) return true; }

// Пара в ряд: в той же строке (левая/правая) или столбце (верх/низ) с нужной стороны стоит пара, между ними пусто и есть зазор — свайп любой из двух стыкует.

function lineFits(s, code){ for (let i = 0; i < s.grid.length; i++){ if (s.grid[i] !== 0) continue; s.grid[i] = code; const ok = inLine(s, i, code); s.grid[i] = 0; if (ok) return true; } return false; }

    if (s.grid[i] !== 0) continue;
    const x = i % s.w, dd = Math.abs(x - px) + Math.abs((i - x) / s.w - py);
    s.grid[i] = code;
    const t = dockPartner(s.grid, s.w, s.h, i, code) >= 0 ? 2 : inLine(s, i, code) ? 0 : dockInOne(s) ? 1 : -1;

// Раздача, вставшая в клетку cell, сама состыкуется в фигуру, которой нет места ни в заказе, ни в лотке?
function spawnOverflows(s, cell, code){

// Падение раздачи: в клетку искры, а если её заняли — в ближайшую пустую. Может сразу состыковаться.

function spawn(s, ev, by){
  if (s.near && !lineFits(s, s.next.code)) planNext(s);      // урок: ход прижал пару к «не той» стене — раздача выбирается заново, под тех, к кому можно встать в ряд

// Ходить нечем, а место на поле есть (поле опустело — раздача сама состыковалась с последней плиткой, метла всё смела,
// остались только скованные): раздача падает сама, пока не появится ход или поле не заполнится. Возвращает список таких раздач.
function topUp(s, ev){
  const out = [];
  if (s.every <= 0) return out;
  for (let q = 0; q < s.grid.length && !isWin(s) && !s.trayOver && !s.dead && s.grid.indexOf(0) >= 0 && legalMoves(s).length === 0; q++){
    if (!s.next || s.next.cell < 0 || s.grid[s.next.cell] !== 0) planNext(s);
    const sp = spawn(s, ev, 'extra' + q); if (!sp) break;
    out.push(sp);
  }

}

// Очередь заказов уровня: ручная (queue: ['h', 'cs'] — буквы цветов) или от сида: figs фигур заказами по 1..osz.
function genOrders(spec, seed){
  if (spec.queue) return spec.queue.map(q => q.split('').map(ch => LAYOUT_CHARS.indexOf(ch)));
  const rnd = mulberry32(seed * 53 + 11), out = []; let left = spec.figs || 0;
  while (left > 0){
    const n = Math.min(left, 1 + Math.floor(rnd() * (spec.osz || 2))), o = [];
    for (let k = 0; k < n; k++) o.push(Math.floor(rnd() * spec.colors));
    out.push(o.sort()); left -= n;
  }

}
function makeState(li, spec, grid, w, h, seed, floor){
  const queue = genOrders(spec, seed);
  const s = { li, n: spec.n, w, h, grid, floor: floor || new Array(w * h).fill(0), seed,
    queue, show: spec.show || CFG.ORDER_SHOW, cap: (spec.cap || CFG.TRAY_CAP) + Math.max(0, CFG.TRAY_PLUS || 0),
    want: Math.min(1, (spec.want === undefined ? CFG.WANT : spec.want) + (spec.every ? Math.max(0, CFG.WANT_BONUS || 0) : 0)),
    active: [], oi: 0, tray: [], served: 0, total: queue.reduce((n, o) => n + o.length, 0), trayOver: false, capBonus: 0,
    crateGoal: spec.crateGoal || 0, hard: !!spec.hard,
    every: spec.every || 0, colors: spec.colors || 5, help: spec.help === undefined ? 0.8 : spec.help,
    vert: spec.vert || 0, rainbow: spec.rainbow || 0, timerP: spec.timerP || 0, timer: spec.timer || 8,
    deal: spec.deal || CFG.DEAL, near: !!spec.near, k: 0, moves: 0, docks: 0, crates: 0, dead: false, next: null, last: null };
  for (let a = 0; a < s.show; a++) s.active.push(s.oi < queue.length ? newOrder(s) : null);
  if (s.every > 0) planNext(s);
  return s;
}
// Генератор поля. Порядок расхода rnd для полей без новых механик — как в v0.1 (уровни 1–10 не меняются).
function genGrid(spec, seed){
  const w = spec.w, h = spec.h, N = w * h; let grid = null, floor = null;
  for (let a = 0; a < CFG.GEN_ATTEMPTS; a++){
    const rnd = mulberry32(seed * 131 + a);
    grid = new Array(N).fill(0); floor = new Array(N).fill(0);
    const free = () => { const f = []; for (let i = 0; i < N; i++) if (!grid[i]) f.push(i); return f; };
    const put = (code) => { const f = free(), i = f[Math.floor(rnd() * f.length)]; grid[i] = code; return i; };
    for (let k = 0; k < (spec.stones || 0); k++) put(STONE);
    for (let k = 0; k < (spec.crates || 0); k++) put(CRATE);
    for (let k = 0; k < (spec.honey || 0); k++){ const f = free().filter(i => !floor[i]); floor[f[Math.floor(rnd() * f.length)]] = HONEY; }
    const placed = [];
    for (let p = 0; p < spec.pairs; p++){
      const col = p < spec.colors ? p : Math.floor(rnd() * spec.colors);
      const ax = spec.vert && rnd() < spec.vert ? 2 : 0;
      placed.push(put(pieceCode(col, ax))); placed.push(put(pieceCode(col, ax + 1)));
    }
    for (let k = 0; k < (spec.chains || 0); k++){ const i = placed[Math.floor(rnd() * placed.length)]; if (!isChained(grid[i])) grid[i] += 100; }
    for (let k = 0; k < (spec.timers || 0); k++){ const i = placed[Math.floor(rnd() * placed.length)]; if (!timerOf(grid[i])) grid[i] += 1000 * (spec.timer || 8); }
    if (hasDock(grid, w, h)) continue;                               // пара не должна стоять готовой до первого хода
    const s = makeState(-1, spec, grid.slice(), w, h, seed, floor);
    if (!legalMoves(s).length) continue;
    if (spec.every > 0 && !greedyPlay(s).win) continue;              // страховка в игре: уровень проходим простым ботом
    return { grid, floor };
  }

}
function levelSeed(spec){ return 1000 + spec.n * 97 + (spec.seed || 0); }
function createState(li){
  const spec = levelSpec(li), seed = levelSeed(spec);
  if (spec.layout){ const L = parseLayout(spec.layout); return makeState(li, spec, L.grid, L.w, L.h, seed, L.floor); }

function cloneState(s){ return { ...s, grid: s.grid.slice(), active: s.active.map(o => o && { id: o.id, c: o.c, f: o.f.slice() }), tray: s.tray.slice(), next: s.next && { ...s.next }, last: null }; }

function legalMoves(s){

  for (let i = 0; i < grid.length; i++){
    if (grid[i] <= 0 || isChained(grid[i])) continue;
    const x = i % w, y = (i - x) / w;

// Ход без копирования состояния: куда доедет и с кем состыкуется (для превью, ботов и солвера).
function peekMove(s, m){
  const i = m >> 2, j = slideDest(s.grid, s.w, s.h, i, m & 3, s.floor);

}
// Что даст ход: 'none' — без стыковки; 'order' — фигура в заказ; 'tray' — в лоток; 'over' — лоток переполнится; 'bonus' — заказов уже нет.

function goalProgress(s){ return { done: s.served + Math.min(s.crates, s.crateGoal), total: s.total + s.crateGoal }; }
function isWin(s){ return !ordersLeft(s) && s.crates >= s.crateGoal; }

// Почему проигран: 'tray' — фигура не влезла в лоток; 'timer' — окаменела; 'board' — поле забито; 'stuck' — тупик на уровне без раздачи (ходить нечем, а поле не полно).
function loseWhy(s){ return !isLose(s) ? '' : s.trayOver ? 'tray' : s.dead ? 'timer' : s.grid.indexOf(0) < 0 ? 'board' : 'stuck'; }

// --- бустеры (оболочка списывает их из сейва; ядро только меняет состояние). Раздачи и тика таймеров бустер не вызывает. ---
// Пара для магнита: первая и вторая половинки одной фигуры где угодно на поле; wantedOnly — только под открытый заказ.
function magnetPair(s, wantedOnly){
  const W = wantedColors(s), any = ordersLeft(s);

    const ca = s.grid[a]; if (ca <= 0 || (sideOf(ca) & 1)) continue;
    for (let b = 0; b < s.grid.length; b++){
      const cb = s.grid[b]; if (cb <= 0 || sideOf(cb) !== sideOf(ca) + 1 || !colorsMatch(ca, cb)) continue;
      const col = colorOf(ca) === RAINBOW ? colorOf(cb) : colorOf(ca);
      if (!wantedOnly || !any || col === RAINBOW || W[col]) return [a, b];

}
// Магнит: стыкует одну пару под открытый заказ, где бы половинки ни стояли. Такой пары нет — null (бустер не тратится).
function useMagnet(s){
  if (isWin(s) || isLose(s)) return null;
  const p = magnetPair(s, true); if (!p) return null;
  const n = cloneState(s), ev = [], aCode = n.grid[p[0]], bCode = n.grid[p[1]], dk = dock(n, p[0], p[1], ev, 'boost');
  n.last = { boost: 'magnet', a: p[0], b: p[1], aCode, bCode, color: dk.color, target: dk.target, partner: -1, spawn: null, ev };
  n.last.extra = topUp(n, ev);

}
// Метла: сметает половинки из самого забитого ряда или столбца (камни и ящики остаются). Сметать нечего — null.
function broomLine(s){
  let best = null;
  for (let y = 0; y < s.h; y++){ let k = 0; for (let x = 0; x < s.w; x++) if (s.grid[y * s.w + x] > 0) k++; if (!best || k > best.k) best = { k, row: y, col: -1 }; }
  for (let x = 0; x < s.w; x++){ let k = 0; for (let y = 0; y < s.h; y++) if (s.grid[y * s.w + x] > 0) k++; if (k > best.k) best = { k, row: -1, col: x }; }
  return best && best.k ? best : null;
}
function useBroom(s){
  if (isWin(s) || isLose(s)) return null;

  const n = cloneState(s), gone = [];

  n.last = { boost: 'broom', row: line.row, col: line.col, gone, partner: -1, spawn: null, ev: [] };
  n.last.extra = topUp(n, n.last.ev);

}
// Рекламное место в лотке: +1 место до конца уровня, один раз за уровень (оболочка показывает его закрытой лункой).
function addTraySlot(s){

}
// «Продолжить» после проигрыша (раз за уровень): лоток пуст, магнит стыкует REVIVE_PAIRS пар под заказ,
// метла сметает самый забитый ряд или столбец. Окаменевший таймер на уроке без раздачи не лечится.
function revive(s){
  if (isWin(s) || s.dead || !isLose(s)) return null;
  const n = cloneState(s), ev = [], pairs = [];
  n.trayOver = false; const cleared = n.tray.slice(); n.tray = [];
  for (let q = 0; q < CFG.REVIVE_PAIRS && !isWin(n); q++){
    const p = magnetPair(n, true); if (!p) break;
    const aCode = n.grid[p[0]], bCode = n.grid[p[1]], dk = dock(n, p[0], p[1], ev, 'boost');
    pairs.push({ a: p[0], b: p[1], aCode, bCode, color: dk.color, target: dk.target });
  }
  const gone = [], line = isWin(n) ? null : broomLine(n);

  if (n.every > 0 && !isWin(n) && (!n.next || n.next.cell < 0 || n.grid[n.next.cell] !== 0)) planNext(n);
  n.last = { boost: 'revive', cleared, pairs, gone, row: line ? line.row : -1, col: line ? line.col : -1, partner: -1, spawn: null, ev };
  n.last.extra = topUp(n, ev);
  return n;
}

// Солвер: поиск лучом по слоям глубины (каждый слой — ход). Возвращает список ходов или null.
// Первый найденный выигрыш — самый короткий среди просмотренных; при узком луче это «лучшее найденное», не точный минимум.
function stateKey(s){
  return s.grid.join(',') + '|' + (s.next ? s.next.code + ':' + s.next.cell : '') + '|' + s.crates + '|' + s.tray.join('') + '|' +
    s.active.map(o => o ? o.id + ':' + o.f.map(b => b ? 1 : 0).join('') : '-').join('/') + '|' + (s.every ? s.moves % s.every : 0);
}
// Тесно на поле и в лотке — чем ближе к краю, тем дороже следующая плитка (квадрат): так боты и солвер берегут место.
function crowding(s){ const p = pieceCount(s), t = s.tray.length; return p * p / 6 + t * t * 4 + (t >= s.cap ? 30 : 0); }
function scoreState(s){ return goalProgress(s).done * 1000 + orderMoves(s).length * 25 - crowding(s) * 2; }
function solve(s0, width){
  width = width || CFG.PAR_BEAM;
  if (isWin(s0)) return [];
  let beam = [{ s: s0, path: [] }];
  const seen = new Set([stateKey(s0)]);
  for (let depth = 0; depth < CFG.MAX_DEPTH; depth++){
    const cand = [];
    for (const node of beam){
      for (const m of legalMoves(node.s)){
        const n = applyMove(node.s, m), key = stateKey(n);
        if (seen.has(key)) continue;
        seen.add(key);
        const path = node.path.concat(m);
        if (isWin(n)) return path;
        if (isLose(n)) continue;
        cand.push({ s: n, path, sc: scoreState(n) });
      }
    }
    if (!cand.length) return null;
    cand.sort((a, b) => b.sc - a.sc);
    beam = cand.slice(0, width);
  }
  return null;
}

// Боты для симулятора (PROTO-BASE §6). Все возвращают метрики ощущения, не только исход.
//   random — любой ход;
//   novice — стыкует всё готовое, что видит (сначала под заказ, лишнее — пока есть место в лотке); иначе любой ход, кроме явного переполнения;
//   docker — «стыкуй всё»: любая готовая стыковка, даже в полный лоток, а без неё — ход, который готовит стыковку (цена выбора);
//   greedy — на шаг вперёд: прогресс заказов, готовые стыковки под заказ, место на поле и в лотке;
//   midNN — в NN% ходов думает как greedy, в остальных как novice (mid50 — «средний игрок»).
function greedyPick(s){
  let best = -1, bs = -Infinity;
  const p0 = goalProgress(s).done;
  for (const m of legalMoves(s)){
    const n = applyMove(s, m);
    if (isWin(n)) return m;
    const sc = isLose(n) ? -1e9 : (goalProgress(n).done - p0) * 1000 + orderMoves(n).length * 12 - crowding(n);
    if (sc > bs){ bs = sc; best = m; }
  }
  return best;
}
function dockerPick(s, rnd){
  const dm = dockMoves(s), om = dm.filter(m => moveKind(s, m) !== 'tray' && moveKind(s, m) !== 'over');
  if (om.length) return om[Math.floor(rnd() * om.length)];
  if (dm.length) return dm[Math.floor(rnd() * dm.length)];
  let best = -1, bs = -Infinity;
  for (const m of legalMoves(s)){ const n = applyMove(s, m), sc = isLose(n) ? -1e9 : dockMoves(n).length * 10 - pieceCount(n) + rnd(); if (sc > bs){ bs = sc; best = m; } }
  return best;
}
function novicePick(s, rnd){
  const moves = legalMoves(s), kinds = moves.map(m => moveKind(s, m));
  const om = moves.filter((m, k) => kinds[k] === 'order' || kinds[k] === 'bonus');
  if (om.length) return om[Math.floor(rnd() * om.length)];
  const tm = moves.filter((m, k) => kinds[k] === 'tray'); if (tm.length) return tm[Math.floor(rnd() * tm.length)];
  const safe = moves.filter((m, k) => kinds[k] !== 'over'), pool = safe.length ? safe : moves;
  return pool[Math.floor(rnd() * pool.length)];
}
function playBot(s, policy, seed){
  const rnd = mulberry32(seed || 1), think = policy === 'greedy' ? 1 : policy.slice(0, 3) === 'mid' ? (Number(policy.slice(3)) || 50) / 100 : 0;
  let steps = 0, withDock = 0, firstDock = -1, trayPeak = 0, danger = false;
  while (!isWin(s) && !isLose(s) && steps < CFG.BOT_CAP){
    if (orderMoves(s).length) withDock++;
    if (s.every && (s.tray.length >= s.cap || s.grid.reduce((n, c) => n + (c === 0 ? 1 : 0), 0) <= CFG.DANGER_EMPTY)) danger = true;
    let m;
    if (policy === 'random'){ const moves = legalMoves(s); m = moves[Math.floor(rnd() * moves.length)]; }
    else if (policy === 'docker') m = dockerPick(s, rnd);
    else if (think && rnd() < think) m = greedyPick(s);
    else m = novicePick(s, rnd);
    const d0 = s.docks;
    s = applyMove(s, m); steps++;
    if (firstDock < 0 && s.docks > d0) firstDock = steps;
    if (s.tray.length > trayPeak) trayPeak = s.tray.length;
  }
  const pr = goalProgress(s);
  return { win: isWin(s), moves: s.moves, docks: s.docks, goal: pr.total, done: pr.done, obvious: steps ? withDock / steps : 0, firstDock,
    full: isLose(s), why: loseWhy(s) === 'timer' ? 'dead' : loseWhy(s), trayPeak, danger };
}
function greedyPlay(s){ return playBot(s, 'greedy', 1); }
function randomRun(li, seed){ return playBot(createState(li), 'random', seed); }

function greedyRun(li){ return playBot(createState(li), 'greedy', 1); }

// вне приложения (pfSdk нет) остаются текущие. Списки и объекты приходят строкой JSON. Ключи в Launcher заводит бот.
const RC = { skip_levels: [], free_revive: false, boosts_per_ad: 1, deal: CFG.DEAL };
function readSdkConfig(){
  const sdk = window.pfSdk; if (!sdk || !sdk.config || typeof sdk.config.get !== 'function') return;
  const val = (v) => { if (typeof v === 'string'){ try { return JSON.parse(v); } catch (e) { return v; } } return v; };
  const num = (v, d) => { const n = Number(val(v)); return isFinite(n) ? n : d; };
  const int = (v, d, lo, hi) => { const n = Math.round(num(v, d)); return n >= lo && n <= hi ? n : d; };
  const get = (k, d) => sdk.config.get(k, d);
  try {
    const skip = val(get('skip_levels', []));
    RC.skip_levels = Array.isArray(skip) ? skip.map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= LEVELS.length) : [];

    CFG.INTER_FROM = int(get('inter_start_level', CFG.INTER_FROM), CFG.INTER_FROM, 1, 100000);         // межуровневая — после победы на этом уровне и дальше
    CFG.BOOST_START = int(get('boost_start', CFG.BOOST_START), CFG.BOOST_START, 0, 20);                 // запас каждого бустера у нового игрока
    RC.boosts_per_ad = int(get('boosts_per_ad', RC.boosts_per_ad), RC.boosts_per_ad, 1, 10);           // сколько бустеров даёт один ролик
    const cap = int(get('tray_cap', CFG.TRAY_CAP), CFG.TRAY_CAP, CFG.TRAY_CAP, 6); CFG.TRAY_PLUS = cap - CFG.TRAY_CAP;   // лоток: только больше
    CFG.REVIVE_PAIRS = int(get('revive_pairs', CFG.REVIVE_PAIRS), CFG.REVIVE_PAIRS, 0, 5);             // «Continue»: сколько пар магнит собирает сам
    RC.free_revive = val(get('free_revive', false)) === true;                                          // «Continue» без ролика
    const wb = num(get('want_bonus', 0), 0); CFG.WANT_BONUS = wb >= 0 && wb <= 0.5 ? wb : 0;           // доля нужных раздач: только легче
    const dm = val(get('deal_mode', CFG.DEAL)); if (dm === 'miss' || dm === 'each') CFG.DEAL = dm;     // раздача: после хода без стыковки | каждый ход

      ' cap+' + CFG.TRAY_PLUS + ' revive=' + CFG.REVIVE_PAIRS + (RC.free_revive ? ' free' : '') + ' want+' + CFG.WANT_BONUS + ' deal=' + CFG.DEAL);

// Поля и пределы — в LIM; неверное поле пропускается.
function applyLevelOverrides(o){
  if (!o || typeof o !== 'object') return;
  const LIM = { want: [0.1, 1], seed: [0, 1e6], cap: [2, 6], colors: [2, 5], figs: [3, 24], osz: [1, 3], show: [1, 3], pairs: [2, 6], stones: [0, 4] };
  for (const key of Object.keys(o)){
    const li = parseInt(key, 10) - 1, ov = o[key]; if (!(li >= 0 && li < LEVELS.length) || !ov || typeof ov !== 'object' || LEVELS[li].layout) continue;
    const next = {};
    for (const f of Object.keys(LIM)) if (ov[f] !== undefined){ const n = Number(ov[f]); if (isFinite(n) && n >= LIM[f][0] && n <= LIM[f][1]) next[f] = f === 'want' ? n : Math.round(n); }
    if (Object.keys(next).length){ LEVELS[li] = { ...LEVELS[li], ...next }; log('event', 'remote.level', (li + 1) + ' ' + JSON.stringify(next)); }
  }
}

  tone(freq, ms, type, delay, vol, toFreq){
    if (!this.on()) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, e);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, e);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(e + 0.02);
  },
  hiss(ms, f0, f1, delay, vol, type){
    if (!this.on() || !this.noiseBuf) return;
    const src = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    src.buffer = this.noiseBuf; f.type = type || 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, e);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, e);
    src.connect(f).connect(g).connect(this.ac.destination); src.start(t); src.stop(e + 0.02);
  },
  swipe(ms){ this.hiss(Math.max(80, ms), 900, 2400, 0, 0.12); log('sound', 'swipe'); },
  thunk(delay, dist){ const f = 200 - Math.min(5, dist || 1) * 14; this.tone(f, 100, 'sine', delay, 0.32, f * 0.5); this.hiss(50, 700, 250, delay, 0.1); log('sound', 'thunk'); },
  click(k, delay, combo){                            // «щёлк» стыковки: сухой клик + аккорд, выше с каждой фигурой и серией
    const f = NOTES[Math.min(k + Math.max(0, (combo || 1) - 1), NOTES.length - 1)];
    this.hiss(30, 5000, 3500, delay, 0.4, 'highpass');
    this.tone(f, 300, 'triangle', delay + 0.03, 0.22);
    this.tone(f * 1.5, 260, 'sine', delay + 0.06, 0.1);
    this.tone(f * 2, 200, 'sine', delay + 0.09, 0.07);
    if ((combo || 1) >= 2) this.hiss(260, 6000, 9000, delay + 0.08, 0.06, 'highpass');   // искристый хвост серии
    log('sound', 'click', 'k=' + k + ' combo=' + combo);
  },
  order(delay){ [784, 1047, 1319].forEach((f, i) => this.tone(f, 150, 'triangle', delay + i * 0.06, 0.14)); log('sound', 'order'); },
  tray(delay){ this.tone(330, 110, 'sine', delay, 0.16, 220); this.hiss(40, 900, 500, delay, 0.08); log('sound', 'tray'); },
  over(delay){ this.tone(160, 260, 'sawtooth', delay, 0.12, 90); this.tone(120, 300, 'square', delay + 0.05, 0.06, 70); log('sound', 'over'); },
  magnet(){ this.tone(260, 300, 'sine', 0, 0.14, 880); this.hiss(200, 1500, 5000, 0.05, 0.05, 'highpass'); log('sound', 'magnet'); },
  broom(){ this.hiss(380, 2600, 700, 0, 0.22); this.hiss(200, 5000, 2500, 0.1, 0.08, 'highpass'); log('sound', 'broom'); },
  revive(){ [392, 523, 659, 784].forEach((f, i) => this.tone(f, 160, 'triangle', i * 0.07, 0.14)); log('sound', 'revive'); },
  coin(delay){ this.tone(1568, 60, 'square', delay, 0.04); this.tone(2093, 140, 'sine', delay + 0.04, 0.12); log('sound', 'slot'); },
  star(i, delay){ const f = NOTES[2 + i * 2]; this.tone(f, 320, 'triangle', delay, 0.2); this.tone(f * 2, 240, 'sine', delay + 0.02, 0.08); log('sound', 'star', 'i=' + i); },
  fanfare(delay){
    delay = Math.max(0, delay || 0);
    [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 200, 'triangle', delay + i * 0.08, 0.18));
    [523, 659, 784, 1047].forEach((f) => this.tone(f, 900, 'sine', delay + 0.42, 0.1));
    [1047, 1319, 1568].forEach((f, i) => this.tone(f, 260, 'triangle', delay + 0.42 + i * 0.05, 0.07));
    this.hiss(500, 3000, 8000, delay + 0.3, 0.07, 'highpass');
    log('sound', 'fanfare');
  },
  crack(delay){ this.hiss(140, 900, 300, delay, 0.35, 'lowpass'); this.tone(240, 90, 'square', delay, 0.06, 120); log('sound', 'crack'); },
  clink(delay){ this.tone(2400, 70, 'square', delay, 0.05); this.tone(3100, 120, 'triangle', delay + 0.05, 0.06); log('sound', 'clink'); },
  petrify(delay){ this.tone(120, 260, 'sawtooth', delay, 0.1, 60); this.hiss(260, 500, 150, delay, 0.2, 'lowpass'); log('sound', 'petrify'); },
  press(){ this.tone(660, 45, 'triangle', 0, 0.07, 520); },                                   // нажатие кнопки (без строки в журнале — их много)
  pop(){ this.tone(520, 90, 'sine', 0, 0.14, 1040); this.tone(1320, 80, 'triangle', 0.05, 0.06); log('sound', 'pop'); },
  cannon(delay){ delay = Math.max(0, delay || 0); this.hiss(160, 600, 120, delay, 0.32, 'lowpass'); this.tone(110, 140, 'sine', delay, 0.25, 50); this.hiss(700, 4000, 9000, delay + 0.08, 0.06, 'highpass'); log('sound', 'cannon'); },
  intro(){ [392, 523, 659].forEach((f, i) => this.tone(f, 120, 'sine', i * 0.06, 0.08)); log('sound', 'intro'); },
  plop(delay){ this.tone(720, 120, 'sine', delay, 0.16, 300); log('sound', 'plop'); },
  nope(){ this.tone(140, 70, 'square', 0, 0.05); log('sound', 'nope'); },
  undo(){ this.hiss(120, 2400, 900, 0, 0.1); log('sound', 'undo'); },
  win(){ this.tone(1047, 200, 'triangle', 0, 0.12); log('sound', 'win'); },
  lose(){ this.tone(330, 220, 'triangle', 0, 0.16, 220); this.tone(220, 360, 'triangle', 0.18, 0.16, 140); log('sound', 'lose'); },
};
function buzz(ms){ if (G.save.haptics === false) return; try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// --- экраны: DOM-оверлеи, любой открывается кодом (goto) и, в DEV, хешем (§6, §11) ---
const $ = (id) => document.getElementById(id);
const ICON = {
  ad: '<svg class="adico" viewBox="0 0 12 12"><path d="M2.5 1.5v9l8-4.5z" fill="currentColor"/></svg>',
  lock: '<svg viewBox="0 0 16 16" width="14" height="14"><rect x="3" y="7" width="10" height="8" rx="2" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
};
// Следующий уровень после li: пропускает номера из skip_levels (удалённый конфиг; только в таблице, на круге — нет).
function nextLi(li){ let n = li + 1; while (n < LEVELS.length && RC.skip_levels.indexOf(n + 1) >= 0) n++; return n; }
function playLi(){ let li = G.save.level || 0; if (li < LEVELS.length && RC.skip_levels.indexOf(li + 1) >= 0) li = nextLi(li); return li; }
// Отладочное в меню, на экранах и в кнопках — только в DEV (в сборке для стора блоки вырезаны, функции остаются пустыми).
let devMenu = () => '', devAct = () => false, devQuit = () => '';
const GEAR_SVG = () => $('btn-gear').innerHTML;
function goto(screen, payload){
  G.screen = screen; log('screen', screen);
  const ov = $('overlay'), card = $('card');
  card.className = 'card';
  if (screen === 'game'){ ov.classList.remove('show'); return; }
  ov.classList.add('show');
  if (screen === 'menu'){
    const logo = $('loading').querySelector('svg').outerHTML.replace('<svg ', '<svg class="logo" ');
    card.innerHTML = `<button class="gear" data-act="settings" aria-label="Settings">${GEAR_SVG()}</button>${logo}<div class="title">${TITLE}</div><p>Slide the halves, snap them whole, fill the orders.</p>
      <div class="row"><button class="btn g big" data-act="play">Play · Level ${playLi() + 1}</button></div>${devMenu()}`;
  }
  if (screen === 'settings'){
    const inLevel = G.back === 'game' && !!G.s, sdkS = sdkSettings();
    const opt = (act, label, on) => `<button class="btn n" data-act="${act}">${label}<b class="${on ? '' : 'off'}">${on ? 'On' : 'Off'}</b></button>`;
    // Выхода в меню в сборке для стора нет (юзер-тест и протофлоу: игрок не уходит с линейки уровней); кнопка выхода — только в DEV
    card.innerHTML = `<h2>Settings</h2><div class="opts">
      ${opt('sound', 'Sound', !G.save.muted)}${opt('haptics', 'Haptics', G.save.haptics !== false)}
      ${inLevel ? '<button class="btn r quiet" data-act="restart">Restart level</button>' + devQuit() : ''}
      ${sdkS ? '<button class="btn n quiet" data-act="privacy">Privacy &amp; support</button>' : ''}</div>
      <div class="row"><button class="btn g big" data-act="resume">${inLevel ? 'Resume' : 'Close'}</button></div>`;
  }
  if (screen === 'help') card.innerHTML = `<h2>How to play</h2><p style="text-align:left">
      • Swipe a tile — it slides until it hits a wall, a stone or another tile.<br>
      • A left half stops right next to a right half of the same color — snap! The shape is whole.<br>
      • Whole shapes go to the orders. Fill every order to win.<br>
      • A shape nobody ordered waits in the tray and leaves by itself when its order opens. The tray is small: no room — you lose.<br>
      • The ghost on the board shows the next half and where it lands. It drops after a move without a snap. A full board also loses.<br>
      • Boosters: Undo takes back a move, Magnet snaps a pair for an order, Broom sweeps the fullest row.</p><button class="btn g" data-act="back">Got it</button>`;
  if (screen === 'win'){                                  // v0.9: без звёзд и без Replay — «Well done!», собранные фигуры подпрыгивают, Next с задержкой
    card.className = 'card winc';
    card.innerHTML = `<div class="wlv">Level ${G.s ? G.s.li + 1 : ''} complete</div><div class="wd">${payload && payload.title || 'Well done!'}</div><div class="figs"></div>
      <div class="row"><button class="btn g big late" data-act="next">Next</button></div>`;
    winFigures(card.querySelector('.figs'));
    const btn = card.querySelector('[data-act="next"]');
    setTimeout(() => { if (G.screen === 'win' && btn.isConnected){ btn.classList.add('in'); Audio.pop(); } }, REDUCED ? 0 : CFG.NEXT_DELAY_MS);
  }
  if (screen === 'lose'){
    const s = G.s, canRevive = !!s && !s.dead && !G.revived && isLose(s) && s.every > 0;
    const pr = s ? goalProgress(s) : { done: 0, total: 0 };
    const lw = s ? loseWhy(s) : 'board';
    const title = lw === 'timer' ? 'Turned to stone!' : lw === 'tray' ? 'Tray overflow' : lw === 'stuck' ? 'Out of moves' : 'Board full';
    const why = lw === 'timer' ? 'A timed half ran out of time.' : lw === 'tray' ? 'No room for an extra shape.' : lw === 'stuck' ? 'No moves left.' : 'No empty cells left.';
    if (canRevive) adOffer('continue', 'left=' + (pr.total - pr.done));
    // Continue (спасает) — зелёный; Retry рядом с ним — красный (туда не зовём); без Continue Retry — единственный путь, зелёный
    card.innerHTML = `<h2>${title}</h2><p>${why} ${pr.total - pr.done} of ${pr.total} left to collect.</p>
      ${canRevive ? `<div class="row"><button class="btn g big" data-act="revive">${RC.free_revive ? '' : ICON.ad + ' '}Continue</button></div><p class="note" style="margin-top:12px">Empty tray, ${CFG.REVIVE_PAIRS} pairs snapped for you and a row swept.</p>` : ''}
      <div class="row"><button class="${canRevive ? 'btn r small' : 'btn g big'}" data-act="retry">Retry</button></div>`;
  }
  if (screen === 'offer'){
    const n = RC.boosts_per_ad;
    const T = { magnet: ['Out of magnets', 'Magnet snaps a pair for an open order, wherever the halves are.', '+' + n + ' magnet' + (n > 1 ? 's' : '')],
      broom: ['Out of brooms', 'Broom sweeps the halves off the fullest row or column.', '+' + n + ' broom' + (n > 1 ? 's' : '')],
      undo: ['Out of undos', 'Undo takes back your last move.', '+' + n + ' undo' + (n > 1 ? 's' : '')],
      slot: ['Extra tray space', 'One more space in the tray until the end of this level.', '+1 space'] }[G.offer] || [];
    card.innerHTML = `<h2>${T[0]}</h2><p>${T[1]}</p>
      <div class="row"><button class="btn g big" data-act="ad-yes">${ICON.ad} Watch · ${T[2]}</button></div><div class="row" style="margin-top:14px"><button class="btn r small" data-act="ad-no">No thanks</button></div>`;
  }
  if (screen === 'ad'){                                   // заглушка ролика: тело showRewarded / showInterstitial заменит обёртка
    card.className = 'card ad';
    card.innerHTML = `<div class="adbig">AD</div><p style="color:#bbb;margin:0">${payload || 'ad'} · placeholder</p><div class="adbar" style="--adms:${CFG.AD_MS}ms"><i></i></div>`;
  }
}
// Реклама. Обёртка Proto-vibe заменяет тела showRewarded и showInterstitial настоящим SayKit; здесь — заглушка «AD» на CFG.AD_MS.
// showRewarded(onReward): за награду; onReward — только если досмотрели; место — в adPlace (continue | magnet | broom | undo | tray space).
// showInterstitial(onDone): межуровневая; игра вызывает её сама на Next после победы с уровня CFG.INTER_FROM (inter_start_level); после проигрыша — нет.
let adPlace = '';
function showRewarded(onReward){ adStub(adPlace || 'rewarded', onReward); }
function showInterstitial(onDone){ adStub('interstitial', onDone); }
function adOffer(place, info){ log('event', 'ad.offer', place + ' level=' + (G.s ? G.s.li + 1 : 0) + (info ? ' ' + info : '')); }
function adStub(what, then){
  if (G.busyAd) return; G.busyAd = true;
  const back = G.screen; goto('ad', what); setPaused('ad', true); log('event', 'ad.show', what);
  setTimeout(() => { G.busyAd = false; setPaused('ad', false); log('event', what === 'interstitial' ? 'ad.closed' : 'ad.reward', what);
    if (G.screen === 'ad') goto(back === 'lose' || back === 'offer' || back === 'win' ? (G.s ? 'game' : 'menu') : back);
    then(); }, CFG.AD_MS);
}
// Экран приложения с политикой приватности и поддержкой: pfSdk.shell.settings() (есть только в обёртке).
function sdkSettings(){ const sdk = window.pfSdk; return sdk && sdk.shell && typeof sdk.shell.settings === 'function' ? () => sdk.shell.settings() : null; }
// Выход из начатого уровня (как в cube-levels): выход в меню (DEV), Restart level, уход на другой уровень — одно событие level.quit с причиной.
// Пройденный и проигранный уровень не отмечается: у него уже есть level.win / level.lose.
function quitMark(reason){
  const s = G.s; if (!s || G.screen === 'win' || isWin(s) || isLose(s)) return;
  log('event', 'level.quit', 'level=' + (s.li + 1) + ' moves=' + s.moves + ' reason=' + reason);
}
function openSettings(){
  if (G.screen === 'settings' || G.screen === 'ad') return;
  G.back = G.screen === 'game' ? 'game' : 'menu';
  setPaused('settings', true); goto('settings');
}
function closeSettings(to){ setPaused('settings', false); goto(to || (G.back === 'game' && G.s ? 'game' : 'menu')); }
$('card').addEventListener('click', (e) => {
  const el = e.target && e.target.closest ? e.target.closest('button') : null;
  const act = el && el.dataset.act; if (!act) return;
  Audio.init(); log('input', 'button', act);
  if (devAct(act, el)) return;
  if (act === 'play'){ G.s = null; startLevel(playLi()); }
  else if (act === 'settings') openSettings();
  else if (act === 'sound'){ G.save.muted = !G.save.muted; save(); log('event', 'sound', G.save.muted ? 'off' : 'on'); goto('settings'); }
  else if (act === 'haptics'){ G.save.haptics = G.save.haptics === false; save(); log('event', 'haptics', G.save.haptics ? 'on' : 'off'); if (G.save.haptics) buzz(20); goto('settings'); }
  else if (act === 'restart'){ quitMark('restart'); setPaused('settings', false); startLevel(G.s ? G.s.li : playLi()); }
  else if (act === 'quit'){ quitMark('quit'); setPaused('settings', false); G.s = null; G.hist = []; clearFx(true); hud(); goto('menu'); }
  else if (act === 'privacy'){ log('event', 'privacy'); const f = sdkSettings(); if (f) f(); }
  else if (act === 'resume') closeSettings();
  else if (act === 'retry') startLevel(G.s ? G.s.li : playLi());
  else if (act === 'next'){
    const li = G.s ? G.s.li : playLi(), go = () => startLevel(nextLi(li));
    if (li + 1 >= CFG.INTER_FROM){ log('event', 'ad.inter', 'after level=' + (li + 1)); showInterstitial(go); } else go();
  }
  else if (act === 'revive'){ if (RC.free_revive){ log('event', 'revive.free'); doRevive(); } else { adPlace = 'continue'; showRewarded(doRevive); } }
  else if (act === 'ad-yes'){
    const k = G.offer;
    if (k === 'slot'){ adPlace = 'tray space'; showRewarded(() => openTraySlot()); }
    else { adPlace = k; showRewarded(() => { G.save.boost[k] = (G.save.boost[k] || 0) + RC.boosts_per_ad; save(); hud(); toast('+' + RC.boosts_per_ad + ' ' + (k === 'magnet' ? 'magnet' : k === 'broom' ? 'broom' : 'undo')); }); }
  }
  else if (act === 'ad-no'){ log('event', 'ad.decline', G.offer); goto(G.s ? 'game' : 'menu'); }
  else if (act === 'back') goto(G.s ? 'game' : 'menu');
  else goto('menu');
});

let toastUntil = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.remove('hide'); toastUntil = clock() + CFG.TOAST_MS; }

// Мягкая очистка (новый ход): обрываем то, что привязано к клеткам; уже вспыхнувшие стыковки, частицы
// и надписи доигрывают — быстрый игрок не теряет «щёлк». Полная (старт уровня, отмена) — всё.
function clearFx(hard){
  const now = clock();
  const keep = (f) => !hard && f.ref && now >= f.ref.t0;
  for (const f of G.fxOpen) if (!keep(f)) log('fx.end', f.name, 'cut');
  G.fxOpen = G.fxOpen.filter(keep);
  G.merges = hard ? [] : G.merges.filter(M => now >= M.t0);
  G.slide = null; G.drops = []; G.wiggle = null; G.land = null; G.hit = null; G.ghosts = []; G.sweep = null;
  if (hard){ G.parts = []; G.praise = []; G.shake = null; G.combo = 0; G.crateFly = []; G.trayFlash = 0; }
  G.fxUntil = G.fxOpen.reduce((m, f) => Math.max(m, f.t1), 0);
}
function startLevel(li){
  li = Math.max(0, li);
  CFG.DEAL = RC.deal;                                               // раздача: умолчание ядра или deal_mode из удалённого конфига
    G.s = createState(li); G.s0 = G.s; G.hist = []; G.par = null;
  if (G.screen === 'settings') setPaused('settings', false);
  G.ending = 0; G.drag = null; G.winT = 0; G.revived = false; G.ordX = {}; G.wantPrev = []; G.wantT = []; snapView(); clearFx(true); G.levelT0 = clock(); G.lastInputT = G.levelT0; G.hintFor = null;
  Audio.intro(); log('fx.start', 'intro'); G.fxOpen.push({ name: 'intro', t1: G.levelT0 + CFG.INTRO_MS + CFG.INTRO_STEP * 12 });
  G.cursor = G.s.grid.findIndex(c => c > 0);
  const spec = levelSpec(li);
  log('event', 'level.start', 'level=' + (li + 1) + ' goal=' + goalProgress(G.s).total + ' every=' + G.s.every + ' cap=' + G.s.cap + (G.s.hard ? ' hard' : ''));
  goto('game'); hud(); fit();
}                                                  // par для звёзд считается на победе (finishEnding): на длинных уровнях луч солвера — десятки мс, на старте это рывок
function hud(){
  $('hud-level').innerHTML = G.s ? 'Level ' + (G.s.li + 1) + (G.s.hard ? '<i>HARD</i>' : '') : '';
  if (!G.save.boost) G.save.boost = { magnet: CFG.BOOST_START, broom: CFG.BOOST_START, undo: CFG.BOOST_START };
  if (G.save.boost.undo === undefined) G.save.boost.undo = CFG.BOOST_START;      // сейв до v0.8: бустера Undo не было
  for (const k of ['undo', 'magnet', 'broom']){ const n = G.save.boost[k] || 0, el = $('n-' + k); el.innerHTML = n > 0 ? n : '+' + RC.boosts_per_ad + ICON.ad; el.className = n > 0 ? '' : 'ad'; }
  $('btn-undo').classList.toggle('dim', !G.hist.length);
  $('btn-gear').style.visibility = G.s ? '' : 'hidden';                        // в меню своя шестерёнка в карточке
  $('boosts').classList.toggle('hide', !(G.s && G.s.every > 0 && G.s.li + 1 >= CFG.BOOST_FROM));
  $('boosts').classList.toggle('pulse', !!G.s && G.s.li + 1 === CFG.BOOST_FROM && G.s.moves === 0);
}

// --- ход в оболочке: ядро считает, оболочка раскладывает эффекты по абсолютному времени ---
function doMove(m){
  if (!G.s || G.screen !== 'game' || G.paused || G.ending || isWin(G.s) || isLose(G.s)) return false;
  const i = m >> 2, d = m & 3;
  if (G.s.grid[i] <= 0) return false;
  const next = applyMove(G.s, m);
  if (!next){ bump(i, d); return false; }
  snapView(); clearFx(false);
  G.lastInputT = clock();
  G.combo = next.last.partner >= 0 ? G.combo + 1 : 0;
  G.hist.push(G.s); G.s = next;
  log('input', 'swipe', 'cell=' + i + ' dir=' + '→←↓↑'[d]);
  animateMove(next);
  hud();
  if (isWin(G.s)) log('event', 'level.win', 'level=' + (G.s.li + 1) + ' moves=' + G.s.moves);
  else if (isLose(G.s)) log('event', 'level.lose', 'level=' + (G.s.li + 1) + ' moves=' + G.s.moves + ' done=' + goalProgress(G.s).done + ' why=' + loseWhy(G.s));
  return true;
}
function fxOpen(name, t1, info, ref){ G.fxOpen.push({ name, t1, ref }); log('fx.start', name, info); G.fxUntil = Math.max(G.fxUntil, t1); }
const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
function shakeAt(t0, amp){ if (REDUCED) return; if (!G.shake || G.shake.t1 < t0 || G.shake.amp < amp) G.shake = { t0, t1: t0 + CFG.SHAKE_MS / G.timeScale, amp }; }
function praise(text, x, y, t0, color, size){ G.praise.push({ text, x: Math.max(70, Math.min(W - 70, x)), y, t0, t1: t0 + CFG.PRAISE_MS / G.timeScale, color, size: size || 26 }); log('fx.start', 'praise', text); }
const PRAISE = ['Snap!', 'Great!', 'Super!', 'Wow!', 'Amazing!'];
// Частицы: dot — кружок, rect — вертящееся конфетти, star — искра, dust — пыль. Всё от сида, без Math.random.
function burst(n, x, y, t0, opts){
  const rnd = mulberry32(((t0 * 7) | 0) + n * 131 + (x | 0));
  for (let k = 0; k < n; k++){
    const a = opts.angle !== undefined ? opts.angle + (rnd() - 0.5) * (opts.spread || 1) : rnd() * Math.PI * 2;
    const v = (opts.v || 0.2) * (0.5 + rnd());
    G.parts.push({ type: opts.type || 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + (opts.vy || 0), t0, life: (opts.life || 600) * (0.7 + rnd() * 0.6),
      color: opts.colors ? opts.colors[k % opts.colors.length] : opts.color, r: (opts.r || 3) * (0.6 + rnd() * 0.8), rot: rnd() * 6.28, spin: (rnd() - 0.5) * 0.03, ph: rnd() * 6.28, g: opts.g === undefined ? 0.0004 : opts.g });
  }
}
function animateMove(n){
  const L = n.last, T = clock(), ts = G.timeScale;
  const slideMs = Math.max(CFG.SLIDE_MIN_MS, L.dist * CFG.SLIDE_MS_CELL) / ts;
  const t1 = T + slideMs;
  G.slide = { code: L.code, from: L.from, to: L.to, dir: L.dir, t0: T, t1 };
  fxOpen('slide', t1, 'cells=' + L.dist);
  Audio.swipe(slideMs); buzz(8);

  if (L.partner < 0){
    // остановка: плитка сплющивается, у переднего края — пыль; то, во что упёрлись, вздрагивает
    G.land = { cell: L.to, dir: L.dir, t0: t1, t1: t1 + CFG.LAND_MS / ts };
    const x = L.to % n.w, y = (L.to - x) / n.w, bx = x + dx, by = y + dy, p = cellXY(L.to, g);
    const ex = p.x + cs / 2 + dx * cs * 0.45, ey = p.y + cs / 2 + dy * cs * 0.45;
    burst(7, ex, ey, t1, { type: 'dust', color: -1, angle: Math.atan2(-dy, -dx), spread: 2.6, v: 0.09, life: 380, r: 4, g: 0 });
    if (bx >= 0 && by >= 0 && bx < n.w && by < n.h) G.hit = { cell: by * n.w + bx, dir: L.dir, t0: t1, t1: t1 + CFG.HIT_MS / ts };
    else if (L.dist >= 2) shakeAt(t1, 2);

  const chain = (by) => L.ev.filter(e => e.by === by && (e.type === 'done' || e.type === 'order' || e.type === 'untray'));

    tEnd = addMerge({ active: L.to, partner: L.partner, code: L.code, partnerCode: L.partnerCode, color: L.color, target: L.target, tShow: T, t0: t1, combo: G.combo, kind: 'move', evs: chain('move') });
    Audio.click(n.served, slideMs / 1000, G.combo); buzz([10, 30, 14]);

  } else Audio.thunk(slideMs / 1000, L.dist);
  const sp = animateSpawns(L, T, tNext, n.served);

  animateEvents(L, T, t1);
  if (isWin(n)) celebrate(Math.max(tEnd, G.merges.reduce((m, M) => Math.max(m, M.flyEnd), t1), G.crateFly.reduce((m, f) => Math.max(m, f.t1), 0)));
  else if (isLose(n) && !n.trayOver) shakeAt(Math.max(G.fxUntil, t1), 7);
}
// Раздачи после действия: обычная (L.spawn) и те, что упали сами, потому что ходить было нечем (L.extra). Идут по очереди с t0.
// Каждая проявляется в своей клетке; состыковалась сама — «Подарок!». Возвращает время конца.
function animateSpawns(L, T, t0, served){
  const ts = G.timeScale, list = (L.spawn ? [{ S: L.spawn, by: 'spawn' }] : []).concat((L.extra || []).map((S, q) => ({ S, by: 'extra' + q })));
  let t = t0, tEnd = t0;
  for (const { S, by } of list){
    const d1 = t + CFG.SPAWN_MS / ts, g = geo();
    G.drops.push({ code: S.code, cell: S.cell, t0: t, t1: d1 });
    fxOpen('drop', d1, 'cell=' + S.cell + (S.cell !== S.planned ? ' moved' : '') + (by !== 'spawn' ? ' auto' : ''));
    Audio.plop((t - T) / 1000);
    if (S.partner >= 0){
      const chain = L.ev.filter(e => e.by === by && (e.type === 'done' || e.type === 'order' || e.type === 'untray'));
      tEnd = Math.max(tEnd, addMerge({ active: S.cell, partner: S.partner, code: S.code, partnerCode: S.partnerCode, color: S.color, target: S.target, tShow: T, t0: d1, combo: 1, kind: 'gift', evs: chain }));
      Audio.click(served, (d1 - T) / 1000, 1);
    } else { const p = cellXY(S.cell, g); burst(8, p.x + g.cell / 2, p.y + g.cell * 0.9, d1, { type: 'dust', color: -1, angle: -Math.PI / 2, spread: 3, v: 0.07, life: 340, r: 3.5, g: 0 }); }
    t = d1 + 60 / ts; tEnd = Math.max(tEnd, d1);

}
// Победа: когда последняя фигура долетела в копилку — «Готово!», дождь конфетти, фанфара; карточка — после паузы.
function celebrate(t){
  const hold = CFG.WIN_HOLD_MS / G.timeScale;
  G.winT = t;                                     // плитки на поле подпрыгивают волной (render), с краёв бьют пушки конфетти
  cannons(t, 0.8);
  shakeAt(t, 5);
  Audio.fanfare((t - clock()) / 1000);
  fxOpen('celebrate', t + hold, 'cannons');
}
// Конфетти-пушки v0.9: залп с левого и правого края экрана вверх и к центру; летит поверх карточки (холст #fx над оверлеем).
// Полёт — аналитическая формула от абсолютного времени (сопротивление воздуха + тяжесть), не накопление dt (§4).
const FX = { parts: [] };
function cannons(t, power){
  if (REDUCED) power *= 0.4;
  const r = $('fx').getBoundingClientRect(), w = r.width || 400, h = r.height || 700, cols = [0, 1, 2, 3, 4, -2, -6];
  for (const side of [0, 1]){
    for (let k = 0; k < Math.round(CFG.CANNON_N * power); k++){
      const q = mulberry32(4000 + k * 7 + side * 991 + Math.round(t) % 1000), a = (-52 - q() * 32) * Math.PI / 180, sp = (1.25 + q() * 1.15) * (0.75 + 0.25 * power);
      FX.parts.push({ x: side ? w + 6 : -6, y: h * (0.66 + q() * 0.08), vx: Math.cos(a) * sp * (side ? -1 : 1), vy: Math.sin(a) * sp,
        t0: t + q() * 140, life: 3000 + q() * 1300, color: cols[k % cols.length], w: 6 + q() * 6, h: 4 + q() * 4, rot: q() * 6.28, spin: (q() - 0.5) * 0.03, ph: q() * 6.28, round: q() < 0.25 });
    }
  }
  Audio.cannon((t - clock()) / 1000);
  log('fx.start', 'cannons', 'power=' + power);
}
function drawFx(){
  const cvs = $('fx'), r = cvs.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.round(r.width * d), ch = Math.round(r.height * d);
  if (cvs.width !== cw || cvs.height !== ch){ cvs.width = cw; cvs.height = ch; }
  const c = cvs.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, r.width, r.height);
  if (!FX.parts.length) return;
  const now = clock(), K = 0.0019, Gv = 0.00085;
  FX.parts = FX.parts.filter(p => now < p.t0 + p.life);
  for (const p of FX.parts){
    const dt = now - p.t0; if (dt < 0) continue;
    const e = (1 - Math.exp(-K * dt)) / K, x = p.x + p.vx * e + Math.sin(dt / 260 + p.ph) * 8 * Math.min(1, dt / 600), y = p.y + (p.vy + Gv / K) * e - Gv * dt / K;
    const fade = Math.min(1, (p.life - dt) / 500), flip = Math.cos(dt / 140 + p.ph);
    c.save(); c.globalAlpha = Math.max(0, fade); c.translate(x, y); c.rotate(p.rot + p.spin * dt);
    c.fillStyle = p.color === -2 ? '#ffffff' : p.color === -6 ? '#ffe066' : P.colors[p.color];
    if (p.round){ c.beginPath(); c.arc(0, 0, p.h * 0.6, 0, Math.PI * 2); c.fill(); }
    else c.fillRect(-p.w / 2, -p.h / 2 * Math.abs(flip), p.w, p.h * Math.max(0.15, Math.abs(flip)));
    c.restore();

}
// Фигуры уровня на вин-скрине: фишка каждого собранного цвета с числом, подпрыгивают волной (CSS).
function winFigures(el){
  if (!el || !G.s) return;
  const n = {}; for (const o of G.s.queue) for (const c of o) n[c] = (n[c] || 0) + 1;
  const list = Object.keys(n).map(Number).sort((a, b) => a - b), d = Math.min(window.devicePixelRatio || 1, 2);
  if (G.s.crateGoal) list.push(-1);
  list.forEach((col, k) => {
    const box = document.createElement('div'); box.className = 'fg'; box.style.animationDelay = (0.15 + k * 0.09).toFixed(2) + 's';
    const cv2 = document.createElement('canvas'); cv2.width = cv2.height = 52 * d; const c = cv2.getContext('2d'); c.scale(d, d);
    if (col < 0){ c.fillStyle = P.chip; c.beginPath(); c.arc(26, 26, 24, 0, Math.PI * 2); c.fill(); drawCrate(c, 11, 11, 30); }
    else drawChip(c, col, 26, 25, 23);
    box.appendChild(cv2);
    const cnt = col < 0 ? G.s.crateGoal : n[col]; if (cnt > 1){ const b = document.createElement('b'); b.textContent = '×' + cnt; box.appendChild(b); }
    el.appendChild(box);
  });
}
// Стыковка: active — клетка пришедшей половинки, partner — стоявшей. До t0 стоящую рисуем как плитку.
// o = { active, partner, code, partnerCode, color, target (из ядра), tShow, t0, combo, kind: move|gift|magnet, evs }.
// Магнит: обе половинки сами летят друг к другу (tShow…t0), дальше — как обычная стыковка. Возвращает время конца цепочки событий.
function addMerge(o){
  const ts = G.timeScale, s = G.s, magnet = o.kind === 'magnet', col = o.color;
  const t1 = o.t0 + CFG.DOCK_MS * (magnet ? 0.55 : 1) / ts, flyEnd = t1 + CFG.FLY_MS / ts;
  const first = (sideOf(o.code) & 1) === 0;                    // пришла левая/верхняя
  const aCell = first ? o.active : o.partner, bCell = first ? o.partner : o.active, vert = isVert(o.code);
  const target = o.target.kind === 'order' ? { ...o.target, n: s.queue[o.target.id].length } : o.target;
  const M = { aCell, bCell, aCode: first ? o.code : o.partnerCode, bCode: first ? o.partnerCode : o.code, vert, active: o.active, color: col, magnet,
    tShow: o.tShow, t0: o.t0, t1, flyEnd, target, combo: o.combo || 1 };
  G.merges.push(M);
  fxOpen('dock', flyEnd, SHAPES[col] + ' target=' + target.kind + ' combo=' + M.combo, M);
  // момент «щёлк»: конфетти и искры цвета фигуры, надпись, встряска
  const g = geo(), j = mergeJoint(M, g), cx = j.x, cy = j.y, tp = o.t0 + CFG.DOCK_MS * (magnet ? 0.08 : 0.45) / ts;
  const power = Math.min(4, M.combo);
  burst(10 + power * 3, cx, cy, tp, { type: 'dot', colors: [col, col, -2], v: 0.2 + power * 0.03, vy: -0.1, life: 650, r: 3.2 });
  burst(CFG.CONFETTI_DOCK + power * 4, cx, cy, tp, { type: 'rect', colors: [col, -2, 2, col], v: 0.24 + power * 0.03, vy: -0.16, life: 900, r: 4, g: 0.0005 });
  burst(5 + power, cx, cy, tp, { type: 'star', color: -2, v: 0.16, life: 520, r: 7, g: 0 });
  const rainbow = colorOf(o.code) === RAINBOW || colorOf(o.partnerCode) === RAINBOW;
  const toTray = target.kind === 'tray', over = target.kind === 'over';
  const text = magnet ? 'Magnet!' : o.kind === 'gift' ? 'Gift!' : rainbow && M.combo <= 1 ? 'Rainbow!' : M.combo <= 1 ? PRAISE[0] : PRAISE[Math.min(M.combo - 1, PRAISE.length - 1)] + ' ×' + M.combo;
  if (!over && !toTray) praise(text, cx, cy - g.cell * 0.65, tp, P.colors[col], 24 + power * 3);   // в лоток и «не влезла» — без слов: это видно по полёту и по лотку
  shakeAt(tp, Math.min(CFG.SHAKE_MAX, CFG.SHAKE_PX + (M.combo - 1) * 1.5));
  // фигура долетела до заказа или лотка: звон и искры
  if (target.kind === 'order' || toTray){
    const sp = targetXY(target, g);
    burst(toTray ? 5 : 9, sp.x, sp.y, flyEnd, { type: 'star', color: 2, v: 0.12, life: 420, r: 5, g: 0 });
    burst(8, sp.x, sp.y, flyEnd, { type: 'dot', color: col, v: 0.1, life: 360, r: 2.5, g: 0 });
    if (!toTray) Audio.coin((flyEnd - clock()) / 1000);

}
// Точка стыка пары: середина общего ребра клеток; у магнита — середина между двумя клетками.
function mergeJoint(M, g){
  const a = cellXY(M.aCell, g);
  if (M.magnet){ const b = cellXY(M.bCell, g); return { x: (a.x + b.x) / 2 + g.cell / 2, y: (a.y + b.y) / 2 + g.cell / 2 }; }
  return M.vert ? { x: a.x + g.cell / 2, y: a.y + g.cell } : { x: a.x + g.cell, y: a.y + g.cell / 2 };
}

// --- заказы и лоток на экране ---
// Вид (G.view) отстаёт от ядра ровно на анимации: фигура ещё летит — слот заказа ещё пуст. Изменения вида лежат в G.vq
// с абсолютным временем; новый ход сначала догоняет вид до ядра (snapView), потом раскладывает свои события.
function viewFromState(s){
  return { cards: s.active.map(o => o && { id: o.id, c: o.c, f: o.f.slice(), pop: o.c.map(() => 0), born: 0, done: 0 }),
    tray: s.tray.map(c => ({ color: c, t: 0 })), served: s.served, oi: s.oi, crates: s.crates, landT: 0, crateT: 0 };
}
function snapView(){ G.vq = []; G.flies = []; G.view = G.s ? viewFromState(G.s) : null; }
function vAt(t, fn){ G.vq.push({ t, fn }); }
function runView(now){
  if (!G.vq.length) return;
  G.vq.sort((a, b) => a.t - b.t);
  while (G.vq.length && G.vq[0].t <= now) G.vq.shift().fn();
}
function fillSlot(T, t){ const c = G.view.cards[T.slot]; if (c && c.id === T.id){ c.f[T.k] = true; c.pop[T.k] = t; } G.view.served++; G.view.landT = t; }
// Что происходит после того, как фигура долетела (tL): слот заказа или лоток, затем цепочка ядра —
// заказ закрылся, пришёл новый, лоток отдал подошедшее. Возвращает время конца цепочки.
function scheduleDelivery(T, color, tL, evs){
  const g = geo(), ts = G.timeScale, s = G.s, delay = (t) => (t - clock()) / 1000;
  let tc = tL;
  if (T.kind === 'order') vAt(tL, () => fillSlot(T, tL));
  else if (T.kind === 'tray'){ vAt(tL, () => { G.view.tray.push({ color, t: tL }); }); Audio.tray(delay(tL)); }
  else if (T.kind === 'over'){ shakeAt(tL, 8); Audio.over(delay(tL)); G.trayFlash = tL; }
  for (const e of evs){
    if (e.type === 'done'){

      vAt(t, () => { const c = G.view.cards[e.slot]; if (c && c.id === e.id) c.done = t; });
      burst(12, cx, cy, t, { type: 'star', color: 2, v: 0.16, life: 520, r: 6, g: 0 });
      burst(12, cx, cy, t, { type: 'rect', colors: [3, -2, 2], v: 0.2, vy: -0.1, life: 700, r: 3.5, g: 0.0005 });
      Audio.order(delay(t));
      tc += CFG.ORDER_DONE_MS / ts; const t2 = tc;
      vAt(t2, () => { const c = G.view.cards[e.slot]; if (c && c.id === e.id) G.view.cards[e.slot] = null; });
    } else if (e.type === 'order'){
      const t = tc, id = e.id;
      vAt(t, () => { const c = s.queue[id]; G.view.cards[e.slot] = { id, c, f: c.map(() => false), pop: c.map(() => 0), born: t, done: 0 }; G.view.oi = Math.max(G.view.oi, id + 1); });
      tc += CFG.ORDER_IN_MS / ts;
    } else if (e.type === 'untray'){
      const t0 = tc, t1 = tc + CFG.UNTRAY_MS / ts, T2 = { kind: 'order', slot: e.slot, k: e.k, id: e.id, n: s.queue[e.id].length };
      vAt(t0, () => { const i = Math.min(e.from, G.view.tray.length - 1); if (i >= 0) G.view.tray.splice(i, 1); G.flies.push({ color: e.color, from: e.from, T: T2, t0, t1 }); });
      vAt(t1, () => fillSlot(T2, t1));
      Audio.coin(delay(t1));
      tc = t1;
    }
  }
  if (tc > tL) fxOpen('orders', tc, 'events=' + evs.length);
  return tc;
}

// --- бустеры и «Продолжить» ---
function useBoost(kind){
  if (!G.s || G.screen !== 'game' || G.paused || G.ending || isWin(G.s) || isLose(G.s)) return false;
  if (kind === 'undo' && !G.hist.length){ toast('Nothing to undo'); Audio.nope(); log('event', 'boost.none', kind); return false; }   // нечего отменять — не тратится и не продаётся
  if ((G.save.boost[kind] || 0) <= 0){ G.offer = kind; adOffer(kind); goto('offer'); return false; }
  if (kind === 'undo'){ G.save.boost.undo--; save(); log('event', 'boost.use', 'undo left=' + G.save.boost.undo); undo(); return true; }
  const n = kind === 'magnet' ? useMagnet(G.s) : useBroom(G.s);
  if (!n){ toast(kind === 'magnet' ? 'No pair for an open order' : 'Nothing to sweep'); Audio.nope(); log('event', 'boost.none', kind); return false; }
  G.save.boost[kind]--; save();
  snapView(); clearFx(false);
  const T = clock(); G.lastInputT = T; G.hist = []; G.combo = 0; G.s = n;   // через бустер отмена не шагает
  log('event', 'boost.use', kind + ' left=' + G.save.boost[kind]);
  let tEnd = T;
  if (kind === 'magnet'){ tEnd = animateMagnet(n.last, T, n.last.ev.filter(e => e.by === 'boost')); animateEvents(n.last, T, T + CFG.MAGNET_MS / G.timeScale); }
  else tEnd = animateBroom(n.last, T);
  if (n.last.extra.length) tEnd = Math.max(tEnd, animateSpawns(n.last, T, tEnd + 80 / G.timeScale, n.served));   // поле опустело — раздача упала сама
  hud();
  if (isWin(n)){ log('event', 'level.win', 'level=' + (n.li + 1) + ' moves=' + n.moves + ' by=' + kind); celebrate(Math.max(tEnd, G.merges.reduce((m, M) => Math.max(m, M.flyEnd), T))); }
  return true;
}
// Рекламное место в лотке: закрытая лунка с плюсом после последнего места. Тап — предложение ролика (заглушка), согласие — +1 место до конца уровня.
function adSlotOpen(s){ return !!s && s.every > 0 && !s.capBonus && s.li + 1 >= CFG.BOOST_FROM; }
function trayPlaces(s){ return s.cap + (adSlotOpen(s) ? 1 : 0); }          // сколько лунок рисовать: места лотка и, если есть, рекламная
function offerTraySlot(){
  if (!G.s || G.screen !== 'game' || G.ending || !adSlotOpen(G.s) || isWin(G.s) || isLose(G.s)) return false;
  G.offer = 'slot'; adOffer('tray space', 'tray=' + G.s.tray.length + '/' + G.s.cap); goto('offer'); return true;
}
function openTraySlot(){
  const n = G.s && addTraySlot(G.s); if (!n) return false;
  snapView(); clearFx(false); G.hist = []; G.s = n; snapView();          // через бустер отмена не шагает
  const T = clock(), p = trayXY(n.cap - 1, geo()); G.lastInputT = T;
  burst(14, p.x, p.y, T, { type: 'star', color: 2, v: 0.16, life: 520, r: 6, g: 0 });
  Audio.order(0); buzz([10, 30, 14]); log('event', 'boost.use', 'slot cap=' + n.cap); hud();
  return true;
}
// Магнит: две половинки летят друг к другу и стыкуются посередине. L = { a, b, aCode, bCode, color, target }.
function animateMagnet(L, T, evs){
  const t0 = T + CFG.MAGNET_MS / G.timeScale;
  Audio.magnet(); buzz([8, 40, 16]);

// Метла: полоса идёт по ряду или столбцу, половинки исчезают по мере прохода. L = { row, col, gone: [{ cell, code }] }.
function animateBroom(L, T){
  const g = geo(), cs = g.cell, ms = CFG.BROOM_MS / G.timeScale, t1 = T + ms, s = G.s;
  G.sweep = { row: L.row, col: L.col, t0: T, t1 };

    const x = q.cell % s.w, y = (q.cell - x) / s.w, frac = L.row >= 0 ? (x + 0.5) / s.w : (y + 0.5) / s.h, until = T + ms * frac, p = cellXY(q.cell, g);

  praise('Swept!', mid.x, mid.y - cs * 0.6, t1, P.accent, 26);
