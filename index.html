<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Половинки</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#565c99">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Палитра — одно место; canvas читает цвета через getComputedStyle (PROTO-BASE §9).
   Экран в средних тонах: фон и поле — приглушённый индиго, яркие только плитки и фигуры. Зоны разнесены цветом:
   заказы — «бумажные» карточки, лоток — янтарный, поле — тёмный индиго. Тёмная тема — те же тона глубже, без чёрного. */
:root{
  --bg:#3a3f73; --frame:#565c99; --ink:#ffffff; --muted:#c9cdf0;
  --accent:#ff8a3d; --off:rgba(255,255,255,.16); --danger:#ff5a66;
  --board:#434986; --slot:#4e5596; --tile:#fffdf7; --tile-shadow:#2c3066; --stone:#8d93bd; --stone-dark:#6f75a3;
  --c0:#ff5470; --c1:#3b8cff; --c2:#ffb81f; --c3:#2fbf71; --c4:#9b5cff;
  --paper:#fff4d9; --paper-shadow:#3e4480; --panel-ink:#3b3340; --panel-muted:#b3a487; --panel-slot:#efdfba;   /* карточка заказа: бумага, тень, чернила, пунктир, лунка */
  --tray:#f0a13a; --tray-dark:#b8721c; --tray-hole:#d2861f;                                                  /* лоток: корпус, тень, лунка */
  --chip:#ffffff; --chip-shadow:rgba(30,30,70,.25);                                                           /* фишка: целая фигура на белом кружке */
  --honey:#f7b733; --wood:#c98b4f; --wood-dark:#8f5a2b; --steel:#7d8494; --ok:#2fbf71; --ok-bg:#d9f5e4;
  --frame-w:430px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#2b2f5a; --frame:#454b84; --muted:#bfc4ea; --board:#353a70; --slot:#40467f; --tile-shadow:#22264f;
    --stone:#7d83ad; --stone-dark:#626893; --paper-shadow:#2e3366; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:var(--frame);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;pointer-events:none}
header b{font-size:18px}
header b i{font-style:normal;font-size:12px;font-weight:800;color:#fff;background:var(--danger);border-radius:8px;padding:2px 7px;margin-left:8px;vertical-align:2px}
header button{pointer-events:auto;padding:6px 10px}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#boosts{display:flex;gap:14px;justify-content:center;padding:0 14px 2px}
#boosts.hide{display:none}
.boost{position:relative;display:flex;align-items:center;justify-content:center;width:58px;height:50px;padding:0;border-radius:16px;background:var(--tile);box-shadow:0 3px 0 var(--tile-shadow)}
.boost svg{width:32px;height:32px;display:block}
.boost b{position:absolute;right:-7px;top:-7px;min-width:24px;padding:2px 6px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.boost b.ad{background:var(--ok)}
#boosts.pulse .boost{animation:bpulse 1s ease-in-out infinite}   /* бустеры появились впервые — кнопки «дышат», текста нет */
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
footer{display:flex;gap:8px;justify-content:center;padding:8px 14px calc(10px + env(safe-area-inset-bottom))}
button{font:inherit;color:var(--ink);background:var(--off);border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.45}
button.primary{background:var(--accent);color:#fff;font-weight:700}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,22,50,.6);padding:20px}
#overlay.show{display:flex}
.card{background:var(--frame);border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center;
  animation:pop .18s ease-out} /* стартует с видимого состояния, не с opacity:0 (§9) */
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.card h2{margin:0 0 8px} .card p{color:var(--muted);margin:0 0 16px}
.card .stars{font-size:44px;color:var(--c2);letter-spacing:6px;margin:0 0 6px}
.card .st{display:inline-block;animation:starIn .5s cubic-bezier(.3,1.7,.5,1) both;text-shadow:0 3px 0 rgba(160,100,0,.25)}
.card .st.off{color:var(--off);text-shadow:none}
@keyframes starIn{from{transform:scale(2) rotate(-50deg)}to{transform:scale(1) rotate(0)}}  /* старт с видимого состояния (§9) */
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px;max-height:42vh;overflow-y:auto;padding:2px}
.levels .ch{grid-column:1/-1;text-align:left;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.levels button{padding:8px 0;font-size:14px}
.levels button small{display:block;font-size:10px;color:var(--c2)}
.levels button.locked{opacity:.4}
.levels button.hard{box-shadow:inset 0 0 0 2px var(--danger)}
.card .note{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.cheat{margin-top:10px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--frame);padding:8px 14px;border-radius:10px;
  pointer-events:none;opacity:.95;transition:opacity .25s;white-space:nowrap}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card, .card .st, #boosts.pulse .boost{animation:none} #toast{transition:none} }
</style>
</head>
<body>
<div id="frame">
  <header><b id="hud-level">Уровень 1</b><button id="btn-mute" aria-label="звук">🔊</button></header>
  <div id="game"><canvas id="cv"></canvas></div>
  <div id="boosts" class="hide">
    <button id="btn-magnet" class="boost" aria-label="магнит"><svg viewBox="0 0 26 26"><path d="M5 4v9a8 8 0 0 0 16 0V4h-5v9a3 3 0 0 1-6 0V4z" fill="#e8505b"/><path d="M5 4h5v4H5zM16 4h5v4h-5z" fill="#d9dde6"/></svg><b id="n-magnet">2</b></button>
    <button id="btn-broom" class="boost" aria-label="метла"><svg viewBox="0 0 26 26"><path d="M20.5 3.5l2 2-9 9-2-2z" fill="#c98b4f"/><path d="M11 12l3 3-2.5 2.5L15 21l-3 3-9-9 3-3 3.5 3.5z" fill="#ffb81f"/></svg><b id="n-broom">2</b></button>
  </div>
  <footer>
    <button id="btn-undo">Отмена</button>
    <button id="btn-reset">Заново</button>
    <button id="btn-menu">Меню</button>
  </footer>
  <div id="overlay"><div class="card" id="card"></div></div>
  <div id="toast" class="hide"></div>
</div>
<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Половинки». Поле w×h, в клетках — пусто, камень или плитка с половинкой фигуры.
// Свайп двигает плитку до упора (стена, камень, другая плитка). Если после остановки
// левая половинка стоит вплотную слева от правой того же цвета — стыковка: обе исчезают,
// целая фигура уходит в открытый заказ, которому она нужна. Фигура, которую никто не заказал, ложится
// в лоток (cap мест) и сама уйдёт в заказ, когда такой откроется; места в лотке нет — проигрыш.
// После каждого хода (или каждого every-го) на поле падает новая половинка в клетку с искрой (видно заранее).
// Цель — закрыть все заказы очереди (и сломать ящики, если есть); ходить некуда — тоже проигрыш.
// Коды клеток: 0 — пусто, -1 — камень, -2 — ящик, половинка — см. pieceCode ниже.
// Ход — число m = клетка*4 + направление (0 →, 1 ←, 2 ↓, 3 ↑).
// ---------------------------------------------------------------------------
const CFG = {
  // --- правила, солвер, генератор ---
  PAR_BEAM: 40,        // ширина луча солвера в игре (par для звёзд); оффлайн-аудит берёт SIM_BEAM
  SIM_BEAM: 300,       // ширина луча солвера в sim.mjs
  MAX_DEPTH: 60,       // предел глубины солвера (ходов)
  BOT_CAP: 150,        // предел ходов ботов: на уровнях без раздачи иначе можно ходить вечно
  GEN_ATTEMPTS: 80,    // попыток собрать поле на один сид, прежде чем взять последнее
  TRAY_CAP: 4,         // мест в лотке: фигура, которую никто не заказал, ждёт здесь; не поместилась — проигрыш
  ORDER_SHOW: 2,       // сколько заказов открыто одновременно
  WANT: 0.5,           // доля раздач, цвет которых берётся из открытых заказов (остальные — любой цвет уровня)
  BOOST_START: 2,      // сколько каждого бустера (магнит, метла) лежит в сейве на старте
  REVIVE_PAIRS: 2,     // «Продолжить» после проигрыша: сколько пар под заказ магнит стыкует сам (плюс пустой лоток и метла)
  STAR3_K: 1.35,       // ★★★ — ходов не больше par × STAR3_K (par — лучшее, что нашёл луч солвера)
  STAR2_K: 1.75,       // ★★ — ходов не больше par × STAR2_K
  BOOST_FROM: 7,       // с какого уровня видны бустеры (до этого игрок учит заказы и лоток)
  INTER_FROM: 8,       // с какого уровня после победы стоял бы межуровневый ролик (заглушка: только строка в журнале)
  // --- оболочка: тайминги (мс, абсолютное время) и ввод ---
  SLIDE_MS_CELL: 55,   // скольжение плитки на одну клетку
  SLIDE_MIN_MS: 110,   // минимальная длительность скольжения
  DOCK_MS: 320,        // стыковка: половинки сходятся, целое вспыхивает
  FLY_MS: 460,         // целая фигура летит в заказ или в лоток
  ORDER_DONE_MS: 320,  // закрытая карточка заказа празднует и уходит
  ORDER_IN_MS: 240,    // новая карточка заказа въезжает
  UNTRAY_MS: 380,      // фигура летит из лотка в заказ
  MAGNET_MS: 340,      // магнит стягивает две половинки друг к другу
  BROOM_MS: 420,       // метла проходит по ряду
  SPAWN_MS: 300,       // новая половинка проявляется в клетке искры (призрак становится плиткой)
  END_DELAY_MS: 380,   // пауза между последним эффектом и карточкой победы/проигрыша
  SWIPE_PX: 14,        // порог свайпа в экранных px; короче — тап (плитка вздрагивает)
  UNDO_PER_LEVEL: 3,   // отмен на уровень: раздача делает бесконечную отмену читом
  TOAST_MS: 1600,      // сколько висит тост
  // --- сочность (только оболочка; на правила не влияют) ---
  SHAKE_PX: 4,         // амплитуда встряски экрана на «щёлк» (растёт с серией до SHAKE_MAX)
  SHAKE_MAX: 9,        // потолок встряски
  SHAKE_MS: 240,       // длительность встряски
  LAND_MS: 190,        // сплющивание плитки при остановке
  HIT_MS: 210,         // вздрагивание плитки/камня, в которые упёрлись
  TRAIL_N: 3,          // сколько призраков шлейфа за скользящей плиткой
  PRAISE_MS: 950,      // сколько живёт надпись «Щёлк!» / «Отлично! ×2»
  CONFETTI_DOCK: 18,   // конфетти на одну стыковку
  CONFETTI_WIN: 80,    // конфетти на победу
  WIN_HOLD_MS: 1100,   // сколько празднуем на поле до карточки победы
  INTRO_MS: 260,       // впрыгивание одной плитки на старте уровня (задержка по диагонали INTRO_STEP)
  INTRO_STEP: 38,      // мс задержки на клетку диагонали
  IDLE_HINT_MS: 5000,  // бездействие, после которого подмигивает плитка с готовой стыковкой
  LESSON_HINT_MS: 1400, // на уроке: бездействие, после которого рука показывает следующий ход (до первого хода — сразу)
  DANGER_EMPTY: 4,     // пустых клеток не больше — рамка поля тревожно пульсирует
  DRAG_PULL: 0.16,     // насколько плитка тянется за пальцем (доля клетки)
};

const STONE = -1, CRATE = -2;                              // помехи: камень вечный, ящик ломается стыковкой рядом
const HONEY = 1;                                           // пол (массив floor): мёд — плитка на нём останавливается
const RAINBOW = 5;                                         // «цвет» радужной половинки: стыкуется с любым цветом
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];          // → ← ↓ ↑
// Код плитки: 1 + цвет*4 + сторона (0 левая, 1 правая, 2 верхняя, 3 нижняя); +100 — в цепи; +1000*t — таймер на t ходов.
const pieceCode = (color, side, chain, timer) => 1 + color * 4 + side + (chain ? 100 : 0) + (timer ? 1000 * timer : 0);
const colorOf = (code) => ((code % 100) - 1) >> 2;
const sideOf = (code) => ((code % 100) - 1) & 3;
const isChained = (code) => code > 0 && Math.floor((code % 1000) / 100) === 1;
const timerOf = (code) => code > 0 ? Math.floor(code / 1000) : 0;
const isVert = (code) => sideOf(code) >= 2;

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Случайное число без состояния: раздача зависит только от (сид уровня, номер раздачи, соль).
function hashRand(seed, k, salt){
  return mulberry32((seed ^ Math.imul(k + 1, 0x9E3779B1) ^ Math.imul(salt + 7, 0x85EBCA77)) >>> 0)();
}

// ---------------------------------------------------------------------------
// Контент. layout — ручное поле: строка без пробелов — по символу на клетку, с пробелами — токены:
//   '.' пусто, '#' камень, 'x' ящик, '~' мёд (пустой); половинка — буква цвета
//   (h сердце, c круг, s звезда, d ромб, l капля, r радужная): строчная — левая/верхняя, заглавная — правая/нижняя;
//   суффиксы: '^' — вертикальная (верх/низ), '*' — в цепи, цифра — таймер; префикс '~' — мёд под плиткой.
// Генератор: w×h, colors цветов, pairs пар, stones камней, crates ящиков, honey клеток мёда, vert — доля вертикальных пар,
//   chains — плиток в цепи, timers — плиток с таймером timer на старте, timerP — доля раздач с таймером,
//   rainbow — доля радужных в раздаче.
// Цель: заказы. figs — сколько фигур в очереди заказов, osz — до скольких фигур в одном заказе (queue — ручная очередь,
//   буквы цветов: ['h', 'cs']); show — сколько заказов открыто сразу; cap — мест в лотке; crateGoal — ещё и сломать ящиков.
// every — раздача после каждого every-го хода (0 — нет); help — доля раздач «пара к одинокой»;
// want — доля раздач, цвет которых берётся из открытых заказов (меньше — больше лишнего на поле, это главный рычаг сложности);
// hard — метка «сложный» (каждый пятый: на нём продаются бустеры и «Продолжить»);
// seed — сдвиг сида (подобран sim.mjs autopick под коридор побед среднего игрока); lesson — урок: рука показывает ход, аудит не требует, чтобы случайный бот проигрывал.
// Текстовых подсказок на уровнях нет: новое показывает рука на уроке и сама игра (решение Андрея 2026-11-13).
// ---------------------------------------------------------------------------
const B = { w: 5, h: 6, every: 1, help: 0.85 };           // база генерируемых уровней
// Роли в блоке механики: лёгкий → средний → сложнее → смесь с меткой «сложный». role читает sim.mjs: по ней коридор побед.
const EASY = { ...B, role: 'easy', colors: 3, pairs: 4, stones: 1, figs: 9,  osz: 2, want: 0.8 };
const MID  = { ...B, role: 'mid', colors: 4, pairs: 4, stones: 1, figs: 10, osz: 3, want: 0.5 };
const TOUGH = { ...B, role: 'tough', colors: 4, pairs: 4, stones: 1, figs: 12, osz: 3, want: 0.32 };
const HARD = { ...B, role: 'hard', colors: 5, pairs: 4, stones: 1, figs: 13, osz: 3, want: 0.42, hard: true };
const LEVELS = [
  // --- глава 1: основа ---
  { n: 1, layout: ['.....', '.....', 'h...H', '.....', '.....'], queue: ['h'], every: 0, lesson: true },
  { n: 2, layout: ['.....', '.....', 'h.S.H', '.....', '.....', 's....'], queue: ['h', 's'], every: 0, lesson: true },
  { n: 3, layout: ['.....', '.....', 'hc.CH', '.....', '.....'], queue: ['h', 'c'], show: 1, every: 0, lesson: true },
  { n: 4,  w: 5, h: 5, colors: 2, pairs: 2, stones: 1, figs: 5, osz: 1, every: 1, help: 1, want: 1, seed: 22, lesson: true },
  { n: 5,  ...B, colors: 3, pairs: 3, stones: 1, figs: 6,  osz: 1, help: 0.9, want: 0.85, seed: 0 },
  { n: 6,  ...B, colors: 3, pairs: 4, stones: 1, figs: 7,  osz: 2, want: 0.8, seed: 0 },
  { n: 7,  ...B, colors: 3, pairs: 4, stones: 2, figs: 8,  osz: 2, want: 0.75, seed: 16 },
  { n: 8,  ...B, colors: 4, pairs: 4, stones: 1, figs: 8,  osz: 2, want: 0.75, seed: 17 },
  { n: 9,  ...B, colors: 4, pairs: 4, stones: 1, figs: 9,  osz: 2, want: 0.8, seed: 2 },
  { n: 10, ...B, colors: 3, pairs: 4, stones: 1, figs: 12, osz: 3, want: 0.8, seed: 0 },
  // --- A. верх/низ ---
  { n: 11, layout: ['. . h^ . .', '. . . . .', 's . . . S', '. . . . .', '. . H^ . .'], queue: ['h', 's'], every: 0, lesson: true },
  { n: 12, ...EASY,  vert: 0.5, seed: 13 },
  { n: 13, ...MID,   vert: 0.5, seed: 11 },
  { n: 14, ...TOUGH, want: 0.46, vert: 0.5, seed: 12 },
  { n: 15, ...HARD,  want: 0.55, vert: 0.5, seed: 4 },
  // --- B. мёд ---
  { n: 16, layout: ['. . h . .', '. . . . .', '. . ~ H .', '. . . . .', '. . . . .'], queue: ['h'], every: 0, lesson: true },
  { n: 17, ...EASY,  honey: 3, seed: 33 },
  { n: 18, ...MID,   honey: 4, seed: 15 },
  { n: 19, ...TOUGH, honey: 4, seed: 7 },
  { n: 20, ...HARD,  want: 0.52, honey: 3, vert: 0.5, seed: 6 },
  // --- C. радужная ---
  { n: 21, layout: ['. . . . .', 'r . . . H', '. . . . .', 's . . . R', '. . . . .'], queue: ['h', 's'], every: 0, lesson: true },
  { n: 22, ...EASY,  colors: 4, rainbow: 0.15, seed: 8 },
  { n: 23, ...MID,   rainbow: 0.15, seed: 3 },
  { n: 24, ...TOUGH, rainbow: 0.18, seed: 5 },
  { n: 25, ...HARD,  rainbow: 0.12, vert: 0.5, seed: 20 },
  // --- D. ящики ---
  { n: 26, layout: ['. h . . .', '. . # . .', '. . H x .'], queue: ['h'], crateGoal: 1, every: 0, lesson: true },
  { n: 27, ...EASY,  stones: 0, crates: 3, crateGoal: 3, figs: 7, seed: 3 },
  { n: 28, ...MID,   crates: 4, crateGoal: 4, figs: 8, seed: 1 },
  { n: 29, ...TOUGH, stones: 1, crates: 3, crateGoal: 3, figs: 10, seed: 7 },
  { n: 30, ...HARD,  stones: 1, crates: 3, crateGoal: 3, figs: 10, honey: 3, seed: 16 },

// Уровни после таблицы — бесконечный генератор: пила лёгкий / средний / сложный, на поле не больше 2 механик.
const MECHS = [
  (sp) => { sp.vert = 0.45; },
  (sp) => { sp.honey = 3; },
  (sp) => { sp.rainbow = 0.12; },
  (sp) => { sp.crates = 3; sp.crateGoal = 3; sp.figs = Math.max(6, sp.figs - 3); },
  (sp) => { sp.chains = 2; },
  (sp) => { sp.timerP = 0.22; sp.timer = 8; },
  (sp) => { sp.cap = 3; sp.want = Math.min(0.7, sp.want + 0.1); },
];
function levelSpec(li){
  if (li < LEVELS.length) return LEVELS[li];
  const n = li + 1, step = n - LEVELS.length - 1, phase = step % 3, tier = Math.min(4, Math.floor(step / 15));
  const sp = { ...[EASY, MID, HARD][phase], n, seed: 0 };
  sp.figs += tier >> 1; if (phase === 2) sp.want = 0.65; else if (phase === 1) sp.want = 0.58;             // «сложный» в бесконечном режиме мягче табличного: механики случайные
  const r = mulberry32(7000 + n), a = Math.floor(r() * MECHS.length);
  MECHS[a](sp);
  if (phase > 0){ let b = Math.floor(r() * MECHS.length); if (b === a) b = (b + 1) % MECHS.length; MECHS[b](sp); }
  return sp;
}

// --- раскладка уровня ---
const LAYOUT_CHARS = 'hcsdlr';                            // r — радужная (цвет RAINBOW = 5)
function parseLayout(rows){
  const toks = rows.map(r => r.indexOf(' ') >= 0 ? r.trim().split(/\s+/) : r.split(''));
  const h = toks.length, w = toks[0].length, grid = new Array(w * h).fill(0), floor = new Array(w * h).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    let t = toks[y][x]; const i = y * w + x;
    if (t[0] === '~'){ floor[i] = HONEY; t = t.slice(1); if (!t) continue; }
    if (t === '.') continue;
    if (t === '#'){ grid[i] = STONE; continue; }
    if (t === 'x'){ grid[i] = CRATE; continue; }
    const col = LAYOUT_CHARS.indexOf(t[0].toLowerCase());
    if (col < 0) throw new Error('layout: неизвестный токен ' + t);
    const first = t[0] === t[0].toLowerCase(), vert = t.indexOf('^') >= 0, chain = t.indexOf('*') >= 0;
    const tm = t.match(/\d+/);
    grid[i] = pieceCode(col, (vert ? 2 : 0) + (first ? 0 : 1), chain, tm ? +tm[0] : 0);
  }
  return { grid, w, h, floor };
}
function cellToken(s, i){
  const c = s.grid[i], hon = s.floor && s.floor[i] === HONEY ? '~' : '';
  if (c === 0) return hon || '.';
  if (c === STONE) return hon + '#';
  if (c === CRATE) return hon + 'x';
  const ch = LAYOUT_CHARS[colorOf(c)], sd = sideOf(c);
  return hon + (sd === 0 || sd === 2 ? ch : ch.toUpperCase()) + (sd >= 2 ? '^' : '') + (isChained(c) ? '*' : '') + (timerOf(c) || '');
}
function gridRows(s){
  const out = [];
  for (let y = 0; y < s.h; y++){ const r = []; for (let x = 0; x < s.w; x++) r.push(cellToken(s, y * s.w + x)); out.push(r.join(' ')); }
  return out;
}

// --- движение и стыковка ---
// Куда доедет плитка из клетки i в направлении d: до стены, до занятой клетки или до мёда (на мёде останавливается).
function slideDest(grid, w, h, i, d, floor){
  const dx = DIRS[d][0], dy = DIRS[d][1];
  let x = i % w, y = (i - x) / w;
  for (;;){
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= w || ny >= h || grid[ny * w + nx] !== 0) break;
    x = nx; y = ny;
    if (floor && floor[y * w + x] === HONEY) break;
  }
  return y * w + x;
}
const colorsMatch = (a, b) => { const ca = colorOf(a), cb = colorOf(b); return ca === cb || ca === RAINBOW || cb === RAINBOW; };
// Пара для половинки code в клетке j: левой нужна правая справа, правой — левая слева, верхней — нижняя снизу, нижней — верхняя сверху.
function dockPartner(grid, w, h, j, code){
  if (code <= 0) return -1;
  const x = j % w, y = (j - x) / w, sd = sideOf(code);
  let k = -1, want = -1;
  if (sd === 0 && x < w - 1){ k = j + 1; want = 1; }
  else if (sd === 1 && x > 0){ k = j - 1; want = 0; }
  else if (sd === 2 && y < h - 1){ k = j + w; want = 3; }
  else if (sd === 3 && y > 0){ k = j - w; want = 2; }
  if (k < 0) return -1;
  const n = grid[k];
  return n > 0 && sideOf(n) === want && colorsMatch(code, n) ? k : -1;
}
function hasDock(grid, w, h){ for (let i = 0; i < grid.length; i++){ const c = grid[i]; if (c > 0 && (sideOf(c) === 0 || sideOf(c) === 2) && dockPartner(grid, w, h, i, c) >= 0) return true; } return false; }
function nearestEmpty(grid, w, from){
  let best = -1, bd = Infinity; const fx = from % w, fy = (from - fx) / w;
  for (let i = 0; i < grid.length; i++){
    if (grid[i] !== 0) continue;
    const x = i % w, dd = Math.abs(x - fx) + Math.abs((i - x) / w - fy);
    if (dd < bd){ bd = dd; best = i; }
  }
  return best;
}
function pieceCount(s){ let n = 0; for (const c of s.grid) if (c > 0) n++; return n; }
function neighbors4(i, w, h){ const x = i % w, y = (i - x) / w, o = []; if (x > 0) o.push(i - 1); if (x < w - 1) o.push(i + 1); if (y > 0) o.push(i - w); if (y < h - 1) o.push(i + w); return o; }

// --- заказы и лоток ---
// Заказ — { id, c: [цвета], f: [закрыто?] }. Открыто show заказов (слоты s.active, пустой слот — null); очередь — s.queue.
function newOrder(s){ const c = s.queue[s.oi]; return { id: s.oi++, c, f: c.map(() => false) }; }
// Кладёт фигуру цвета col в первый открытый заказ, где она нужна (радужная целая подходит в любое место). Нет места — null.
function place(s, col){
  for (let a = 0; a < s.active.length; a++){
    const o = s.active[a]; if (!o) continue;
    for (let k = 0; k < o.c.length; k++) if (!o.f[k] && (o.c[k] === col || col === RAINBOW)){ o.f[k] = true; s.served++; return { kind: 'order', slot: a, k, id: o.id, color: o.c[k] }; }
  }
  return null;
}
// Какие цвета сейчас нужны открытым заказам.
function wantedColors(s){ const w = [false, false, false, false, false]; for (const o of s.active) if (o) o.c.forEach((c, k) => { if (!o.f[k]) w[c] = true; }); return w; }
function ordersLeft(s){ return s.active.some(Boolean); }
// Закрытые заказы уходят, на их место встают следующие из очереди, лоток отдаёт подошедшие фигуры — пока что-то меняется.
function settle(s, ev, by){
  for (let guard = 0; guard < 60; guard++){
    let changed = false;
    for (let a = 0; a < s.active.length; a++){
      const o = s.active[a]; if (!o || !o.f.every(Boolean)) continue;
      ev.push({ type: 'done', slot: a, id: o.id, by });
      s.active[a] = s.oi < s.queue.length ? newOrder(s) : null;
      if (s.active[a]) ev.push({ type: 'order', slot: a, id: s.active[a].id, by });
      changed = true;
    }
    for (let t = 0; t < s.tray.length; t++){
      const hit = place(s, s.tray[t]); if (!hit) continue;
      ev.push({ type: 'untray', color: s.tray[t], from: t, slot: hit.slot, k: hit.k, id: hit.id, by });
      s.tray.splice(t, 1); changed = true; break;
    }
    if (!changed) break;
  }
}
// Куда идёт целая фигура: в заказ, в лоток, мимо (заказов не осталось) или «не поместилась» (лоток полон — проигрыш).
function deliver(s, col, ev, by){
  const hit = place(s, col);
  if (hit){ settle(s, ev, by); return hit; }
  if (!ordersLeft(s)) return { kind: 'bonus' };
  if (s.tray.length >= s.cap){ s.trayOver = true; return { kind: 'over' }; }
  s.tray.push(col);
  return { kind: 'tray', k: s.tray.length - 1 };
}
// Стыковка a+b: целая фигура (радужная берёт цвет пары) уходит по deliver, рядом ломаются ящики и снимаются цепи.
// ev — события для оболочки; by — кто стыковал ('move' | 'spawn' | 'boost'). Возвращает { color, target }.
function dock(s, a, b, ev, by){
  const ca = colorOf(s.grid[a]), cb = colorOf(s.grid[b]), col = ca === RAINBOW ? cb : ca;
  s.grid[a] = 0; s.grid[b] = 0; s.docks++;
  for (const c of [a, b]) for (const k of neighbors4(c, s.w, s.h)){
    const v = s.grid[k];
    if (v === CRATE){ s.grid[k] = 0; s.crates++; ev.push({ type: 'crate', cell: k, by }); }
    else if (isChained(v)){ s.grid[k] = v - 100; ev.push({ type: 'chain', cell: k, code: v, by }); }
  }
  const target = deliver(s, col, ev, by);
  return { color: target.kind === 'order' ? target.color : col, target };
}
// Таймеры: после хода каждый тикает; дошёл до нуля — плитка каменеет.
function tickTimers(s, ev){
  for (let i = 0; i < s.grid.length; i++){
    const t = timerOf(s.grid[i]); if (!t) continue;
    if (t === 1){ ev.push({ type: 'stone', cell: i, code: s.grid[i] }); s.grid[i] = STONE; if (!s.every) s.dead = true; }
    else s.grid[i] -= 1000;
  }
}

// Следующая раздача: какая половинка и куда. Решается сразу после хода — игрок видит её заранее.
// С вероятностью help — пара к одинокой половинке на поле, иначе новая; с вероятностью want цвет берётся из открытых заказов.
function planNext(s){
  const empties = [];
  for (let i = 0; i < s.grid.length; i++) if (s.grid[i] === 0) empties.push(i);
  const bal = [];                                    // [цвет][ось]: >0 — первых (левых/верхних) больше
  for (let c = 0; c < s.colors; c++) bal.push([0, 0]);
  for (const c of s.grid) if (c > 0 && colorOf(c) < s.colors){ const sd = sideOf(c); bal[colorOf(c)][sd >> 1] += (sd & 1) ? -1 : 1; }
  const W = wantedColors(s), biased = hashRand(s.seed, s.k, 7) < s.want;
  let lonely = [];
  for (let c = 0; c < s.colors; c++) for (let ax = 0; ax < 2; ax++) if (bal[c][ax]) lonely.push([c, ax]);
  let code;
  if (lonely.length && hashRand(s.seed, s.k, 1) < s.help){
    const lw = lonely.filter(q => W[q[0]]); if (biased && lw.length) lonely = lw;
    const [col, ax] = lonely[Math.floor(hashRand(s.seed, s.k, 2) * lonely.length)];
    const side = ax * 2 + (bal[col][ax] > 0 ? 1 : 0);
    code = pieceCode(s.rainbow && hashRand(s.seed, s.k, 6) < s.rainbow ? RAINBOW : col, side);
  } else {
    let col = Math.floor(hashRand(s.seed, s.k, 3) * s.colors);
    const want = []; for (let c = 0; c < s.colors; c++) if (W[c]) want.push(c);
    if (biased && want.length) col = want[Math.floor(hashRand(s.seed, s.k, 8) * want.length)];
    const ax = s.vert && hashRand(s.seed, s.k, 9) < s.vert ? 1 : 0;
    code = pieceCode(col, ax * 2 + (hashRand(s.seed, s.k, 4) < 0.5 ? 0 : 1));
  }
  if (s.timerP && hashRand(s.seed, s.k, 10) < s.timerP) code += 1000 * s.timer;
  const cell = empties.length ? empties[Math.floor(hashRand(s.seed, s.k, 5) * empties.length)] : -1;
  s.next = { code, cell };
}
// Раздача, вставшая в клетку cell, сама состыкуется в фигуру, которой нет места ни в заказе, ни в лотке?
function spawnOverflows(s, cell, code){
  const p = dockPartner(s.grid, s.w, s.h, cell, code); if (p < 0 || !ordersLeft(s) || s.tray.length < s.cap) return false;
  const ca = colorOf(code), cb = colorOf(s.grid[p]), col = ca === RAINBOW ? cb : ca;
  return col !== RAINBOW && !wantedColors(s)[col];
}
// Падение раздачи: в клетку искры, а если её заняли — в ближайшую пустую. Может сразу состыковаться.
// Раздача не проигрывает уровень за игрока: если её стыковка переполнила бы лоток, она падает в другую пустую клетку.
function spawn(s, ev){
  const want = s.next.cell, code = s.next.code;
  let cell = want >= 0 && s.grid[want] === 0 ? want : nearestEmpty(s.grid, s.w, Math.max(0, want));
  if (cell < 0) return null;
  if (spawnOverflows(s, cell, code)){
    const fx = cell % s.w, fy = (cell - fx) / s.w; let best = -1, bd = Infinity;
    for (let i = 0; i < s.grid.length; i++){
      if (s.grid[i] !== 0 || spawnOverflows(s, i, code)) continue;
      const x = i % s.w, dd = Math.abs(x - fx) + Math.abs((i - x) / s.w - fy);
      if (dd < bd){ bd = dd; best = i; }
    }
    if (best >= 0) cell = best;
  }
  s.grid[cell] = code;
  const partner = dockPartner(s.grid, s.w, s.h, cell, code), partnerCode = partner >= 0 ? s.grid[partner] : 0;
  let color = -1, target = null;
  if (partner >= 0){ const d = dock(s, cell, partner, ev, 'spawn'); color = d.color; target = d.target; }
  s.k++;
  planNext(s);
  return { cell, code, partner, partnerCode, planned: want, color, target };
}

// Очередь заказов уровня: ручная (queue: ['h', 'cs'] — буквы цветов) или от сида: figs фигур заказами по 1..osz.
function genOrders(spec, seed){
  if (spec.queue) return spec.queue.map(q => q.split('').map(ch => LAYOUT_CHARS.indexOf(ch)));
  const rnd = mulberry32(seed * 53 + 11), out = []; let left = spec.figs || 0;
  while (left > 0){
    const n = Math.min(left, 1 + Math.floor(rnd() * (spec.osz || 2))), o = [];
    for (let k = 0; k < n; k++) o.push(Math.floor(rnd() * spec.colors));
    out.push(o.sort()); left -= n;
  }
  return out;
}
function makeState(li, spec, grid, w, h, seed, floor){
  const queue = genOrders(spec, seed);
  const s = { li, n: spec.n, w, h, grid, floor: floor || new Array(w * h).fill(0), seed,
    queue, show: spec.show || CFG.ORDER_SHOW, cap: spec.cap || CFG.TRAY_CAP, want: spec.want === undefined ? CFG.WANT : spec.want,
    active: [], oi: 0, tray: [], served: 0, total: queue.reduce((n, o) => n + o.length, 0), trayOver: false,
    crateGoal: spec.crateGoal || 0, hard: !!spec.hard,
    every: spec.every || 0, colors: spec.colors || 5, help: spec.help === undefined ? 0.8 : spec.help,
    vert: spec.vert || 0, rainbow: spec.rainbow || 0, timerP: spec.timerP || 0, timer: spec.timer || 8,
    k: 0, moves: 0, docks: 0, crates: 0, dead: false, next: null, last: null };
  for (let a = 0; a < s.show; a++) s.active.push(s.oi < queue.length ? newOrder(s) : null);
  if (s.every > 0) planNext(s);
  return s;
}
// Генератор поля. Порядок расхода rnd для полей без новых механик — как в v0.1 (уровни 1–10 не меняются).
function genGrid(spec, seed){
  const w = spec.w, h = spec.h, N = w * h; let grid = null, floor = null;
  for (let a = 0; a < CFG.GEN_ATTEMPTS; a++){
    const rnd = mulberry32(seed * 131 + a);
    grid = new Array(N).fill(0); floor = new Array(N).fill(0);
    const free = () => { const f = []; for (let i = 0; i < N; i++) if (!grid[i]) f.push(i); return f; };
    const put = (code) => { const f = free(), i = f[Math.floor(rnd() * f.length)]; grid[i] = code; return i; };
    for (let k = 0; k < (spec.stones || 0); k++) put(STONE);
    for (let k = 0; k < (spec.crates || 0); k++) put(CRATE);
    for (let k = 0; k < (spec.honey || 0); k++){ const f = free().filter(i => !floor[i]); floor[f[Math.floor(rnd() * f.length)]] = HONEY; }
    const placed = [];
    for (let p = 0; p < spec.pairs; p++){
      const col = p < spec.colors ? p : Math.floor(rnd() * spec.colors);
      const ax = spec.vert && rnd() < spec.vert ? 2 : 0;
      placed.push(put(pieceCode(col, ax))); placed.push(put(pieceCode(col, ax + 1)));
    }
    for (let k = 0; k < (spec.chains || 0); k++){ const i = placed[Math.floor(rnd() * placed.length)]; if (!isChained(grid[i])) grid[i] += 100; }
    for (let k = 0; k < (spec.timers || 0); k++){ const i = placed[Math.floor(rnd() * placed.length)]; if (!timerOf(grid[i])) grid[i] += 1000 * (spec.timer || 8); }
    if (hasDock(grid, w, h)) continue;                               // пара не должна стоять готовой до первого хода
    const s = makeState(-1, spec, grid.slice(), w, h, seed, floor);
    if (!legalMoves(s).length) continue;
    if (spec.every > 0 && !greedyPlay(s).win) continue;              // страховка в игре: уровень проходим простым ботом
    return { grid, floor };
  }
  return { grid, floor };
}
function levelSeed(spec){ return 1000 + spec.n * 97 + (spec.seed || 0); }
function createState(li){
  const spec = levelSpec(li), seed = levelSeed(spec);
  if (spec.layout){ const L = parseLayout(spec.layout); return makeState(li, spec, L.grid, L.w, L.h, seed, L.floor); }
  const G0 = genGrid(spec, seed);
  return makeState(li, spec, G0.grid, spec.w, spec.h, seed, G0.floor);
}
function cloneState(s){ return { ...s, grid: s.grid.slice(), active: s.active.map(o => o && { id: o.id, c: o.c, f: o.f.slice() }), tray: s.tray.slice(), next: s.next && { ...s.next }, last: null }; }

function legalMoves(s){
  const out = [];
  if (isWin(s) || s.dead || s.trayOver) return out;
  const { grid, w, h } = s;
  for (let i = 0; i < grid.length; i++){
    if (grid[i] <= 0 || isChained(grid[i])) continue;
    const x = i % w, y = (i - x) / w;
    for (let d = 0; d < 4; d++){
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (nx >= 0 && ny >= 0 && nx < w && ny < h && grid[ny * w + nx] === 0) out.push(i * 4 + d);
    }
  }
  return out;
}
// Ход без копирования состояния: куда доедет и с кем состыкуется (для превью, ботов и солвера).
function peekMove(s, m){
  const i = m >> 2, j = slideDest(s.grid, s.w, s.h, i, m & 3, s.floor);
  return { to: j, partner: j === i ? -1 : dockPartner(s.grid, s.w, s.h, j, s.grid[i]) };
}
// Что даст ход: 'none' — без стыковки; 'order' — фигура в заказ; 'tray' — в лоток; 'over' — лоток переполнится; 'bonus' — заказов уже нет.
function moveKind(s, m){
  const pk = peekMove(s, m); if (pk.partner < 0) return 'none';
  if (!ordersLeft(s)) return 'bonus';
  const ca = colorOf(s.grid[m >> 2]), cb = colorOf(s.grid[pk.partner]), col = ca === RAINBOW ? cb : ca;
  if (col === RAINBOW || wantedColors(s)[col]) return 'order';
  return s.tray.length >= s.cap ? 'over' : 'tray';
}
function applyMove(s, m){
  const i = m >> 2, d = m & 3, n = cloneState(s);
  const code = n.grid[i];
  if (code <= 0 || isChained(code)) return null;
  const j = slideDest(n.grid, n.w, n.h, i, d, n.floor);
  if (j === i) return null;
  n.grid[i] = 0; n.grid[j] = code; n.moves++;
  const last = { from: i, to: j, dir: d, code, dist: Math.abs(j - i) / (d < 2 ? 1 : n.w), partner: -1, color: -1, target: null, spawn: null, ev: [] };
  const p = dockPartner(n.grid, n.w, n.h, j, code);
  if (p >= 0){ last.partner = p; last.partnerCode = n.grid[p]; const dk = dock(n, j, p, last.ev, 'move'); last.color = dk.color; last.target = dk.target; }
  if (!isWin(n) && !n.trayOver){
    tickTimers(n, last.ev);
    if (n.every > 0){
      if (n.moves % n.every === 0) last.spawn = spawn(n, last.ev);
      else if (n.next && n.grid[n.next.cell] !== 0) n.next.cell = nearestEmpty(n.grid, n.w, n.next.cell);  // искру заняли — переезжает
    }
  }
  n.last = last;

}
function goalProgress(s){ return { done: s.served + Math.min(s.crates, s.crateGoal), total: s.total + s.crateGoal }; }
function isWin(s){ return !ordersLeft(s) && s.crates >= s.crateGoal; }
function isLose(s){ return !isWin(s) && (s.dead || s.trayOver || legalMoves(s).length === 0); }
function dockMoves(s){ return legalMoves(s).filter(m => peekMove(s, m).partner >= 0); }
function orderMoves(s){ return legalMoves(s).filter(m => { const k = moveKind(s, m); return k === 'order' || k === 'bonus'; }); }

// --- бустеры (оболочка списывает их из сейва; ядро только меняет состояние). Раздачи и тика таймеров бустер не вызывает. ---
// Пара для магнита: первая и вторая половинки одной фигуры где угодно на поле; wantedOnly — только под открытый заказ.
function magnetPair(s, wantedOnly){
  const W = wantedColors(s), any = ordersLeft(s);
  for (let a = 0; a < s.grid.length; a++){
    const ca = s.grid[a]; if (ca <= 0 || (sideOf(ca) & 1)) continue;
    for (let b = 0; b < s.grid.length; b++){
      const cb = s.grid[b]; if (cb <= 0 || sideOf(cb) !== sideOf(ca) + 1 || !colorsMatch(ca, cb)) continue;
      const col = colorOf(ca) === RAINBOW ? colorOf(cb) : colorOf(ca);
      if (!wantedOnly || !any || col === RAINBOW || W[col]) return [a, b];
    }
  }
  return null;
}
// Магнит: стыкует одну пару под открытый заказ, где бы половинки ни стояли. Такой пары нет — null (бустер не тратится).
function useMagnet(s){
  if (isWin(s) || isLose(s)) return null;
  const p = magnetPair(s, true); if (!p) return null;
  const n = cloneState(s), ev = [], aCode = n.grid[p[0]], bCode = n.grid[p[1]], dk = dock(n, p[0], p[1], ev, 'boost');
  n.last = { boost: 'magnet', a: p[0], b: p[1], aCode, bCode, color: dk.color, target: dk.target, partner: -1, spawn: null, ev };
  return n;
}
// Метла: сметает половинки из самого забитого ряда или столбца (камни и ящики остаются). Сметать нечего — null.
function broomLine(s){
  let best = null;
  for (let y = 0; y < s.h; y++){ let k = 0; for (let x = 0; x < s.w; x++) if (s.grid[y * s.w + x] > 0) k++; if (!best || k > best.k) best = { k, row: y, col: -1 }; }
  for (let x = 0; x < s.w; x++){ let k = 0; for (let y = 0; y < s.h; y++) if (s.grid[y * s.w + x] > 0) k++; if (k > best.k) best = { k, row: -1, col: x }; }
  return best && best.k ? best : null;
}
function useBroom(s){
  if (isWin(s) || isLose(s)) return null;
  const line = broomLine(s); if (!line) return null;
  const n = cloneState(s), gone = [];
  for (let i = 0; i < n.grid.length; i++){ const x = i % n.w, y = (i - x) / n.w; if (n.grid[i] > 0 && (y === line.row || x === line.col)){ gone.push({ cell: i, code: n.grid[i] }); n.grid[i] = 0; } }
  n.last = { boost: 'broom', row: line.row, col: line.col, gone, partner: -1, spawn: null, ev: [] };
  return n;
}
// «Продолжить» после проигрыша (раз за уровень): лоток пуст, магнит стыкует REVIVE_PAIRS пар под заказ,
// метла сметает самый забитый ряд или столбец. Окаменевший таймер на уроке без раздачи не лечится.
function revive(s){
  if (isWin(s) || s.dead || !isLose(s)) return null;
  const n = cloneState(s), ev = [], pairs = [];
  n.trayOver = false; const cleared = n.tray.slice(); n.tray = [];
  for (let q = 0; q < CFG.REVIVE_PAIRS && !isWin(n); q++){
    const p = magnetPair(n, true); if (!p) break;
    const aCode = n.grid[p[0]], bCode = n.grid[p[1]], dk = dock(n, p[0], p[1], ev, 'boost');
    pairs.push({ a: p[0], b: p[1], aCode, bCode, color: dk.color, target: dk.target });
  }
  const gone = [], line = isWin(n) ? null : broomLine(n);
  if (line) for (let i = 0; i < n.grid.length; i++){ const x = i % n.w, y = (i - x) / n.w; if (n.grid[i] > 0 && (y === line.row || x === line.col)){ gone.push({ cell: i, code: n.grid[i] }); n.grid[i] = 0; } }
  if (n.every > 0 && !isWin(n) && (!n.next || n.next.cell < 0 || n.grid[n.next.cell] !== 0)) planNext(n);
  n.last = { boost: 'revive', cleared, pairs, gone, row: line ? line.row : -1, col: line ? line.col : -1, partner: -1, spawn: null, ev };
  return n;
}

// Солвер: поиск лучом по слоям глубины (каждый слой — ход). Возвращает список ходов или null.
// Первый найденный выигрыш — самый короткий среди просмотренных; при узком луче это «лучшее найденное», не точный минимум.
function stateKey(s){
  return s.grid.join(',') + '|' + (s.next ? s.next.code + ':' + s.next.cell : '') + '|' + s.crates + '|' + s.tray.join('') + '|' +
    s.active.map(o => o ? o.id + ':' + o.f.map(b => b ? 1 : 0).join('') : '-').join('/') + '|' + (s.every ? s.moves % s.every : 0);
}
// Тесно на поле и в лотке — чем ближе к краю, тем дороже следующая плитка (квадрат): так боты и солвер берегут место.
function crowding(s){ const p = pieceCount(s), t = s.tray.length; return p * p / 6 + t * t * 4 + (t >= s.cap ? 30 : 0); }
function scoreState(s){ return goalProgress(s).done * 1000 + orderMoves(s).length * 25 - crowding(s) * 2; }
function solve(s0, width){
  width = width || CFG.PAR_BEAM;
  if (isWin(s0)) return [];
  let beam = [{ s: s0, path: [] }];
  const seen = new Set([stateKey(s0)]);
  for (let depth = 0; depth < CFG.MAX_DEPTH; depth++){
    const cand = [];
    for (const node of beam){
      for (const m of legalMoves(node.s)){
        const n = applyMove(node.s, m), key = stateKey(n);
        if (seen.has(key)) continue;
        seen.add(key);
        const path = node.path.concat(m);
        if (isWin(n)) return path;
        if (isLose(n)) continue;
        cand.push({ s: n, path, sc: scoreState(n) });
      }
    }
    if (!cand.length) return null;
    cand.sort((a, b) => b.sc - a.sc);
    beam = cand.slice(0, width);
  }
  return null;
}

// Боты для симулятора (PROTO-BASE §6). Все возвращают метрики ощущения, не только исход.
//   random — любой ход;
//   novice — стыкует всё готовое, что видит (сначала под заказ, лишнее — пока есть место в лотке); иначе любой ход, кроме явного переполнения;
//   docker — «стыкуй всё»: любая готовая стыковка, даже в полный лоток, а без неё — ход, который готовит стыковку (цена выбора);
//   greedy — на шаг вперёд: прогресс заказов, готовые стыковки под заказ, место на поле и в лотке;
//   midNN — в NN% ходов думает как greedy, в остальных как novice (mid50 — «средний игрок»).
function greedyPick(s){
  let best = -1, bs = -Infinity;
  const p0 = goalProgress(s).done;
  for (const m of legalMoves(s)){
    const n = applyMove(s, m);
    if (isWin(n)) return m;
    const sc = isLose(n) ? -1e9 : (goalProgress(n).done - p0) * 1000 + orderMoves(n).length * 12 - crowding(n);
    if (sc > bs){ bs = sc; best = m; }
  }
  return best;
}
function dockerPick(s, rnd){
  const dm = dockMoves(s), om = dm.filter(m => moveKind(s, m) !== 'tray' && moveKind(s, m) !== 'over');
  if (om.length) return om[Math.floor(rnd() * om.length)];
  if (dm.length) return dm[Math.floor(rnd() * dm.length)];
  let best = -1, bs = -Infinity;
  for (const m of legalMoves(s)){ const n = applyMove(s, m), sc = isLose(n) ? -1e9 : dockMoves(n).length * 10 - pieceCount(n) + rnd(); if (sc > bs){ bs = sc; best = m; } }
  return best;
}
function novicePick(s, rnd){
  const moves = legalMoves(s), kinds = moves.map(m => moveKind(s, m));
  const om = moves.filter((m, k) => kinds[k] === 'order' || kinds[k] === 'bonus');
  if (om.length) return om[Math.floor(rnd() * om.length)];
  const tm = moves.filter((m, k) => kinds[k] === 'tray'); if (tm.length) return tm[Math.floor(rnd() * tm.length)];
  const safe = moves.filter((m, k) => kinds[k] !== 'over'), pool = safe.length ? safe : moves;
  return pool[Math.floor(rnd() * pool.length)];
}
function playBot(s, policy, seed){
  const rnd = mulberry32(seed || 1), think = policy === 'greedy' ? 1 : policy.slice(0, 3) === 'mid' ? (Number(policy.slice(3)) || 50) / 100 : 0;
  let steps = 0, withDock = 0, firstDock = -1, trayPeak = 0, danger = false;
  while (!isWin(s) && !isLose(s) && steps < CFG.BOT_CAP){
    if (orderMoves(s).length) withDock++;
    if (s.every && (s.tray.length >= s.cap || s.grid.reduce((n, c) => n + (c === 0 ? 1 : 0), 0) <= CFG.DANGER_EMPTY)) danger = true;
    let m;
    if (policy === 'random'){ const moves = legalMoves(s); m = moves[Math.floor(rnd() * moves.length)]; }
    else if (policy === 'docker') m = dockerPick(s, rnd);
    else if (think && rnd() < think) m = greedyPick(s);
    else m = novicePick(s, rnd);
    const d0 = s.docks;
    s = applyMove(s, m); steps++;
    if (firstDock < 0 && s.docks > d0) firstDock = steps;
    if (s.tray.length > trayPeak) trayPeak = s.tray.length;
  }
  const pr = goalProgress(s);
  return { win: isWin(s), moves: s.moves, docks: s.docks, goal: pr.total, done: pr.done, obvious: steps ? withDock / steps : 0, firstDock,
    full: isLose(s), why: !isLose(s) ? '' : s.trayOver ? 'tray' : s.dead ? 'dead' : 'board', trayPeak, danger };
}
function greedyPlay(s){ return playBot(s, 'greedy', 1); }
function randomRun(li, seed){ return playBot(createState(li), 'random', seed); }
function noviceRun(li, seed){ return playBot(createState(li), 'novice', seed); }
function greedyRun(li){ return playBot(createState(li), 'greedy', 1); }

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---
const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];   // пентатоника для щелчков по счёту стыковок
const Audio = {
  ac: null, noiseBuf: null,
  init(){
    if (this.ac){ if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; return; }
    const len = Math.floor(this.ac.sampleRate * 0.5), buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0), rnd = mulberry32(99);
    for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
    this.noiseBuf = buf;
  },
  on(){ return this.ac && !G.save.muted; },
  tone(freq, ms, type, delay, vol, toFreq){
    if (!this.on()) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, e);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, e);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(e + 0.02);
  },
  hiss(ms, f0, f1, delay, vol, type){
    if (!this.on() || !this.noiseBuf) return;
    const src = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    src.buffer = this.noiseBuf; f.type = type || 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, e);

    src.connect(f).connect(g).connect(this.ac.destination); src.start(t); src.stop(e + 0.02);
  },
  swipe(ms){ this.hiss(Math.max(80, ms), 900, 2400, 0, 0.12); log('sound', 'swipe'); },
  thunk(delay, dist){ const f = 200 - Math.min(5, dist || 1) * 14; this.tone(f, 100, 'sine', delay, 0.32, f * 0.5); this.hiss(50, 700, 250, delay, 0.1); log('sound', 'thunk'); },
  click(k, delay, combo){                            // «щёлк» стыковки: сухой клик + аккорд, выше с каждой фигурой и серией
    const f = NOTES[Math.min(k + Math.max(0, (combo || 1) - 1), NOTES.length - 1)];
    this.hiss(30, 5000, 3500, delay, 0.4, 'highpass');
    this.tone(f, 300, 'triangle', delay + 0.03, 0.22);
    this.tone(f * 1.5, 260, 'sine', delay + 0.06, 0.1);
    this.tone(f * 2, 200, 'sine', delay + 0.09, 0.07);
    if ((combo || 1) >= 2) this.hiss(260, 6000, 9000, delay + 0.08, 0.06, 'highpass');   // искристый хвост серии

  },
  order(delay){ [784, 1047, 1319].forEach((f, i) => this.tone(f, 150, 'triangle', delay + i * 0.06, 0.14)); log('sound', 'order'); },
  tray(delay){ this.tone(330, 110, 'sine', delay, 0.16, 220); this.hiss(40, 900, 500, delay, 0.08); log('sound', 'tray'); },
  over(delay){ this.tone(160, 260, 'sawtooth', delay, 0.12, 90); this.tone(120, 300, 'square', delay + 0.05, 0.06, 70); log('sound', 'over'); },
  magnet(){ this.tone(260, 300, 'sine', 0, 0.14, 880); this.hiss(200, 1500, 5000, 0.05, 0.05, 'highpass'); log('sound', 'magnet'); },
  broom(){ this.hiss(380, 2600, 700, 0, 0.22); this.hiss(200, 5000, 2500, 0.1, 0.08, 'highpass'); log('sound', 'broom'); },

  star(i, delay){ const f = NOTES[2 + i * 2]; this.tone(f, 320, 'triangle', delay, 0.2); this.tone(f * 2, 240, 'sine', delay + 0.02, 0.08); log('sound', 'star', 'i=' + i); },

  intro(){ [392, 523, 659].forEach((f, i) => this.tone(f, 120, 'sine', i * 0.06, 0.08)); log('sound', 'intro'); },
  plop(delay){ this.tone(720, 120, 'sine', delay, 0.16, 300); log('sound', 'plop'); },
  nope(){ this.tone(140, 70, 'square', 0, 0.05); log('sound', 'nope'); },
  undo(){ this.hiss(120, 2400, 900, 0, 0.1); log('sound', 'undo'); },
  win(){ this.tone(1047, 200, 'triangle', 0, 0.12); log('sound', 'win'); },
  lose(){ this.tone(330, 220, 'triangle', 0, 0.16, 220); this.tone(220, 360, 'triangle', 0.18, 0.16, 140); log('sound', 'lose'); },
};
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// --- экраны: DOM-оверлеи, любой открывается кодом или хешем (§6, §11) ---
const $ = (id) => document.getElementById(id);
const STARS = (k) => '★'.repeat(k) + '☆'.repeat(3 - k);
function starsFor(s, par){ return par == null ? 3 : s.moves <= Math.ceil(par * CFG.STAR3_K) ? 3 : s.moves <= Math.ceil(par * CFG.STAR2_K) ? 2 : 1; }
// Уровень открыт, если до него дошёл прогресс или включён чит «открыть все уровни».
function isOpen(li){ return G.save.unlockAll || li <= G.save.level; }
function setUnlockAll(on){ G.save.unlockAll = !!on; save(); log('event', 'cheat', 'unlockAll=' + G.save.unlockAll); if (on) toast('Все уровни открыты'); }
function goto(screen, payload){

    for (let i = 0; i < LEVELS.length; i++){
      if (CH[i]) lv += `<div class="ch">${CH[i]}</div>`;
      const b = G.save.best[i] || 0, open = isOpen(i);
      lv += `<button data-act="lvl" data-li="${i}" class="${open ? '' : 'locked'}${LEVELS[i].hard ? ' hard' : ''}">${open ? i + 1 : '🔒'}<small>${b ? STARS(b) : open ? '&nbsp;' : i + 1}</small></button>`;
    }
    card.innerHTML = `<h2>Половинки</h2><p>Свайпни половинку — она скользит до упора. Собирай фигуры под заказы; лишнее ждёт в лотке. Красная рамка — сложный уровень.</p>

      <div class="levels">${lv}</div><div class="row"><button data-act="help">Как играть</button></div>
      <div class="row">${G.save.unlockAll ? '<button class="cheat" data-act="relock">Чит включён · закрыть обратно</button>' : '<button class="cheat" data-act="unlock">Чит: открыть все уровни</button>'}<button class="cheat" data-act="wipe">Сбросить прогресс</button></div>`;
  }
  if (screen === 'help') card.innerHTML = `<h2>Как играть</h2><p style="text-align:left">
      • Свайп по плитке — она скользит до стены, камня или другой плитки.<br>
      • Левая половинка встала вплотную слева от правой того же цвета — щёлк, целая фигура.<br>
      • Фигура уходит в открытый заказ, которому она нужна. Закрой все заказы.<br>
      • Фигура, которую никто не заказал, ждёт в лотке и сама уйдёт в заказ, когда он откроется. Мест в лотке мало: не влезла — проигрыш.<br>
      • После хода появляется новая половинка: её призрак на поле заранее показывает, какая и куда. Поле забилось — тоже проигрыш.<br>
      • Бустеры: магнит стыкует пару под заказ, метла сметает самый забитый ряд.<br>
      • Дальше: верх/низ, мёд-стоп, радужная к любому цвету, ящики и цепи ломаются стыковкой рядом, таймер, тесный лоток.</p><button class="primary" data-act="back">Понятно</button>`;
  if (screen === 'win'){
    const n = payload ? payload.stars : 3;
    let st = ''; for (let i = 0; i < 3; i++) st += `<span class="st ${i < n ? 'on' : 'off'}" style="animation-delay:${(0.12 + i * 0.22).toFixed(2)}s">★</span>`;
    card.innerHTML = `<h2>${n === 3 ? 'Идеально!' : n === 2 ? 'Отлично!' : 'Заказы закрыты!'}</h2><div class="stars">${st}</div><p>${payload ? payload.text : ''}</p>
      <div class="row"><button class="primary" data-act="next">Дальше</button><button data-act="retry">Ещё раз</button></div>`;

  if (screen === 'lose'){
    const s = G.s, canUndo = G.undoLeft > 0 && G.hist.length > 0, canRevive = !!s && !s.dead && !G.revived && isLose(s);

    const why = s && s.dead ? 'Половинка с таймером не успела.' : s && s.trayOver ? 'Лишней фигуре не хватило места.' : 'Ходить больше некуда.';
